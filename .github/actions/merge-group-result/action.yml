name: Merge-group result
description: Reuse this workflow's successful merge-group run for the same tree on main.
inputs:
  workflow:
    description: Workflow file whose successful merge-group result may be reused.
    required: true
outputs:
  reuse:
    description: Whether this workflow already passed on a merge group with this tree.
    value: ${{ steps.result.outputs.reuse }}
runs:
  using: composite
  steps:
    - id: result
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        WORKFLOW: ${{ inputs.workflow }}
      run: python3 -I scripts/merge_group_result.py --workflow "$WORKFLOW"
