name: Shared CI fixtures
description: Publish one cached or generated fixture set for this run
inputs:
  fresh:
    description: Exercise fixture generation even on a cache hit
    default: 'false'
  composed:
    description: Include the registered composed-audio fixture set
    default: 'false'
runs:
  using: composite
  steps:
    - name: Key the fixtures by what generates them
      id: key
      shell: bash
      run: |
        set -euo pipefail
        helpers=$(grep -o '\$SCRIPTS/[A-Za-z0-9_.-]*' scripts/gen-fixtures.sh | sed 's|^\$SCRIPTS/|scripts/|' | sort -u)
        support=$(python3 -I -B -c 'import sys; sys.path.insert(0, "scripts"); from test_oracle import SUPPORT; print(" ".join("scripts/" + name for name in SUPPORT))')
        identity="$(cat scripts/gen-fixtures.sh scripts/install-ci-oracle-ffmpeg.sh scripts/oracle-ffmpeg.env $helpers $support | sha256sum | cut -c1-32)"
        composed="$(cat docs/design/composed-opus-aac-v2.json scripts/composed_audio.py scripts/composed_audio_fixtures.py scripts/install-oracle-ffmpeg.sh $support | sha256sum | cut -c1-32)"
        comparator="$(python3 -I -c 'import json; print(json.load(open("docs/design/composed-opus-aac-v2.json"))["opus_compare"]["sha256"])')"
        echo "key=linux-x64-fixtures-$identity" >> "$GITHUB_OUTPUT"
        echo "composed=linux-x64-composed-$composed" >> "$GITHUB_OUTPUT"
        echo "comparator=comparator-archive-$comparator" >> "$GITHUB_OUTPUT"
    - name: Restore the fixtures
      id: fixtures
      uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
      with:
        path: ${{ runner.temp }}/coreav-fixtures
        key: ${{ steps.key.outputs.key }}
    - name: Restore the registered composed-audio fixtures
      if: inputs.composed == 'true'
      id: composed
      uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
      with:
        path: ${{ runner.temp }}/coreav-composed-fixtures
        key: ${{ steps.key.outputs.composed }}
    - name: Cache the pinned comparator archive
      if: steps.composed.outputs.cache-hit != 'true'
      uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
      with:
        path: ${{ runner.temp }}/coreav-comparator-archive
        key: ${{ steps.key.outputs.comparator }}
    - name: Cache pinned black-box binaries
      if: inputs.fresh == 'true' || steps.fixtures.outputs.cache-hit != 'true' || (inputs.composed == 'true' && steps.composed.outputs.cache-hit != 'true')
      id: ffmpeg-cache
      uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
      with:
        path: ${{ runner.temp }}/coreav-oracle-bin
        key: linux-x64-oracle-mediainfo-26.10-${{ hashFiles('scripts/oracle-ffmpeg.env', 'scripts/install-oracle-ffmpeg.sh', 'scripts/install-oracle-mediainfo.sh') }}
    - name: Cache the pinned oracle archive
      if: inputs.fresh == 'true' || steps.fixtures.outputs.cache-hit != 'true' || (inputs.composed == 'true' && steps.composed.outputs.cache-hit != 'true')
      uses: ./.github/actions/oracle-cache
    - name: Install pinned FFmpeg and ffprobe
      if: inputs.fresh == 'true' || steps.fixtures.outputs.cache-hit != 'true' || (inputs.composed == 'true' && steps.composed.outputs.cache-hit != 'true')
      shell: bash
      run: scripts/install-ci-oracle-ffmpeg.sh "$RUNNER_TEMP/coreav-oracle-bin"
    - name: Install pinned MediaInfo
      if: (inputs.fresh == 'true' || steps.fixtures.outputs.cache-hit != 'true' || (inputs.composed == 'true' && steps.composed.outputs.cache-hit != 'true')) && steps.ffmpeg-cache.outputs.cache-hit != 'true'
      shell: bash
      run: scripts/install-oracle-mediainfo.sh "$RUNNER_TEMP/coreav-oracle-bin"
    - name: Generate all required fixtures
      if: inputs.fresh == 'true' || steps.fixtures.outputs.cache-hit != 'true'
      shell: bash
      env:
        COREAV_REQUIRE_ALL_FIXTURES: '1'
      run: |
        python3 -I scripts/oracle_pin.py --verify-bin "$RUNNER_TEMP/coreav-oracle-bin"
        export PATH="$RUNNER_TEMP/coreav-oracle-bin:$PATH"
        scripts/gen-fixtures.sh "$RUNNER_TEMP/coreav-fixtures"
    - name: Fetch the pinned comparator archive on a cache miss
      if: steps.composed.outputs.cache-hit != 'true'
      shell: bash
      run: |
        set -euo pipefail
        read -r url digest < <(python3 -I -c 'import json; pin = json.load(open("docs/design/composed-opus-aac-v2.json"))["opus_compare"]; print(pin["url"], pin["sha256"])')
        archive="$RUNNER_TEMP/coreav-comparator-archive/opus.tar.gz"
        if [ -f "$archive" ] && ! echo "$digest  $archive" | sha256sum --check --status -; then
          echo "::warning::the cached comparator archive has another digest; fetching it again"
          rm -f "$archive"
        fi
        if [ ! -f "$archive" ]; then
          download="$RUNNER_TEMP/comparator-archive.download"
          status=0
          curl --fail --silent --show-error --location --proto =https --proto-redir =https --connect-timeout 15 \
            --max-time 120 --max-filesize 10485760 --retry 3 --retry-all-errors --retry-delay 5 \
            --output "$download" "$url" || status=$?
          if [ "$status" -ne 0 ] || ! echo "$digest  $download" | sha256sum --check --status -; then
            echo "::warning::comparator archive fetch failed (curl exit $status); the generator downloads it itself"
            rm -f "$download"
          else
            mkdir -p "${archive%/*}"
            mv "$download" "$archive"
          fi
        fi
        if [ -f "$archive" ]; then
          mkdir -p "$RUNNER_TEMP/coreav-comparator-curl"
          cp .github/actions/ci-fixtures/comparator-curl.sh "$RUNNER_TEMP/coreav-comparator-curl/curl"
          chmod +x "$RUNNER_TEMP/coreav-comparator-curl/curl"
        fi
    - name: Generate the registered composed-audio fixtures
      if: inputs.composed == 'true' && steps.composed.outputs.cache-hit != 'true'
      shell: bash
      run: |
        url=$(python3 -I -c 'import json; print(json.load(open("docs/design/composed-opus-aac-v2.json"))["opus_compare"]["url"])')
        export COREAV_COMPARATOR_URL="$url" COREAV_COMPARATOR_ARCHIVE="$RUNNER_TEMP/coreav-comparator-archive/opus.tar.gz"
        rm -rf "$RUNNER_TEMP/coreav-composed-fixtures"
        for attempt in 1 2 3; do
          if env PATH="$RUNNER_TEMP/coreav-comparator-curl:$PATH" python3 -I scripts/composed_audio_fixtures.py \
              --ffmpeg "$RUNNER_TEMP/coreav-oracle-bin/ffmpeg" --out "$RUNNER_TEMP/coreav-composed-fixtures"; then
            exit 0
          fi
          rm -rf "$RUNNER_TEMP/coreav-composed-fixtures"
          status=0
          probe=$(curl --silent --show-error --location --proto =https --proto-redir =https --connect-timeout 15 \
            --max-time 60 --range 0-1023 --output /dev/null --write-out '%{http_code} %{url_effective}' "$url" 2>&1) || status=$?
          echo "::warning::composed fixtures attempt $attempt failed; comparator archive probe: curl exit $status, $probe"
          if [ "$attempt" -lt 3 ]; then sleep $((attempt * 60)); fi
        done
        exit 1
    - name: Publish the registered composed-audio fixtures
      if: inputs.composed == 'true'
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: composed-audio-fixture-set
        path: ${{ runner.temp }}/coreav-composed-fixtures
        if-no-files-found: error
        retention-days: 1
    - name: Save the registered composed-audio fixtures
      if: inputs.composed == 'true' && steps.composed.outputs.cache-hit != 'true' && github.ref == 'refs/heads/main'
      uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
      with:
        path: ${{ runner.temp }}/coreav-composed-fixtures
        key: ${{ steps.key.outputs.composed }}
    - name: Publish this run's fixtures
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: isobmff-fixture-set
        path: ${{ runner.temp }}/coreav-fixtures
        if-no-files-found: error
        retention-days: 1
    - name: Save the fixtures
      if: steps.fixtures.outputs.cache-hit != 'true' && github.ref == 'refs/heads/main'
      uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
      with:
        path: ${{ runner.temp }}/coreav-fixtures
        key: ${{ steps.key.outputs.key }}
