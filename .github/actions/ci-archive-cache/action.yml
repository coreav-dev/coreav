name: Cache a pinned CI archive
description: Restore an archive by tool version and content digest
inputs:
  tool:
    description: Tool identifier
    required: true
  version:
    description: Pinned tool version
    required: true
  sha256:
    description: Pinned archive digest
    required: true
runs:
  using: composite
  steps:
    - id: archive
      shell: bash
      env:
        TOOL: ${{ inputs.tool }}
        VERSION: ${{ inputs.version }}
        SHA256: ${{ inputs.sha256 }}
      run: |
        set -euo pipefail
        [[ "$TOOL" =~ ^[a-zA-Z0-9][a-zA-Z0-9._-]*$ ]]
        [[ "$VERSION" =~ ^[a-zA-Z0-9][a-zA-Z0-9._-]*$ ]]
        [[ "$SHA256" =~ ^[0-9a-f]{64}$ ]]
        directory="$RUNNER_TEMP/coreav-ci-archives"
        echo "path=$directory/$TOOL-$VERSION-$SHA256.archive" >> "$GITHUB_OUTPUT"
        echo "COREAV_CI_ARCHIVE_DIR=$directory" >> "$GITHUB_ENV"
    - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
      with:
        path: ${{ steps.archive.outputs.path }}
        key: ci-tool-archive-${{ inputs.tool }}-${{ inputs.version }}-${{ inputs.sha256 }}
