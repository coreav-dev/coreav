name: h264-encoder

# workflow-check: not required

on:
  push:
    branches: [main]
    paths:
      - crates/coreav-h264-encoder/**
      - crates/coreav-cli/**
      - crates/coreav-transcode/**
      - crates/coreav-isobmff-write/**
      - crates/coreav-frame/**
      - scripts/native_h264_cli.py
      - scripts/native_h264_matroska.py
      - scripts/tests/test_native_h264_cli.py
      - scripts/track_boxes.py
      - crates/coreav-kernels-h264/**
      - crates/coreav-h264/**
      - scripts/h264_g1*
      - scripts/tests/test_h264_g1*
      - scripts/h264_deblock_conformance.py
      - scripts/tests/test_h264_deblock.py
      - scripts/h264_p_conformance.py
      - scripts/h264_crf_conformance.py
      - scripts/tests/test_h264_crf.py
      - scripts/tests/test_h264_p.py
      - scripts/install-jm-decoder.sh
      - scripts/install-ci-jm-decoder.sh
      - scripts/fetch-ci-archive.sh
      - scripts/tests/test_ci_reference_downloads.py
      - .github/actions/ci-archive-cache/action.yml
      - scripts/jm-decoder.env
      - scripts/oracle-ffmpeg.env
      - scripts/oracle_pin.py
      - scripts/install-ci-oracle-ffmpeg.sh
      - .github/actions/oracle-cache/action.yml
      - scripts/gen-fixtures.sh
      - .github/workflows/h264-encoder.yml
      - Cargo.toml
      - Cargo.lock
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - crates/coreav-h264-encoder/**
      - crates/coreav-cli/**
      - crates/coreav-transcode/**
      - crates/coreav-isobmff-write/**
      - crates/coreav-frame/**
      - scripts/native_h264_cli.py
      - scripts/native_h264_matroska.py
      - scripts/tests/test_native_h264_cli.py
      - scripts/track_boxes.py
      - crates/coreav-kernels-h264/**
      - crates/coreav-h264/**
      - scripts/h264_g1*
      - scripts/tests/test_h264_g1*
      - scripts/h264_deblock_conformance.py
      - scripts/tests/test_h264_deblock.py
      - scripts/h264_p_conformance.py
      - scripts/h264_crf_conformance.py
      - scripts/tests/test_h264_crf.py
      - scripts/tests/test_h264_p.py
      - scripts/install-jm-decoder.sh
      - scripts/install-ci-jm-decoder.sh
      - scripts/fetch-ci-archive.sh
      - scripts/tests/test_ci_reference_downloads.py
      - .github/actions/ci-archive-cache/action.yml
      - scripts/jm-decoder.env
      - scripts/oracle-ffmpeg.env
      - scripts/oracle_pin.py
      - scripts/install-ci-oracle-ffmpeg.sh
      - .github/actions/oracle-cache/action.yml
      - scripts/gen-fixtures.sh
      - .github/workflows/h264-encoder.yml
      - Cargo.toml
      - Cargo.lock
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  native-h264-cli:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: candidate
    steps:
      - name: Check out the shared acquisition action
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          sparse-checkout: |
            .github/actions/oracle-cache
            scripts/oracle-ffmpeg.env
          sparse-checkout-cone-mode: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: candidate
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: baseline
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
          components: clippy
      - name: Preserve base-build byte references
        run: |
          cd ../baseline
          git rev-parse HEAD
          test "$(git rev-parse HEAD)" = '${{ github.event.pull_request.base.sha || github.sha }}'
          cargo build --locked --release -p coreav-cli
          cp target/release/coreav "$RUNNER_TEMP/default-base"
          cargo build --locked --release -p coreav-cli --features native-h264
          cp target/release/coreav "$RUNNER_TEMP/external-base"
          cargo build --locked --release -p coreav-cli --features native-h264-encoder,native-h264
          cp target/release/coreav "$RUNNER_TEMP/native-base"
      - name: Keep native encoding out of default and release builds
        run: |
          set -euo pipefail
          for features in '' release-default release-full; do
            cargo tree --locked -p coreav-cli --features "$features" -e normal > "$RUNNER_TEMP/native-tree"
            if grep -q coreav-h264-encoder "$RUNNER_TEMP/native-tree"; then
              echo 'native H.264 encoder entered a default or release feature set' >&2
              exit 1
            fi
          done
          cargo build --locked --release -p coreav-cli
          cp target/release/coreav "$RUNNER_TEMP/default-candidate"
      - name: Check opt-in adapters and existing CLI limits
        run: |
          python3 -I -m unittest discover -s scripts/tests -p 'test_native_h264_cli.py' -v
          cargo test --locked --release -p coreav-cli --features native-h264-encoder,native-h264 --lib ffmpeg -- --nocapture
          cargo test --locked --release -p coreav-cli --features native-h264-encoder,native-h264 --test docs_site --test strict_safe_limit --test ffprobe_limits --test native_h264_cli
          cargo test --locked --release -p coreav-transcode --features h264-native --lib
          cargo test --locked --release -p coreav-isobmff-write --lib mkv_output
          cargo clippy --locked -p coreav-cli --features native-h264-encoder,native-h264 --all-targets -- -D warnings
          cargo build --locked --release -p coreav-cli --features native-h264-encoder,native-h264
          cargo build --locked --release -p coreav-h264-encoder --features full --example p
      - uses: ./.github/actions/oracle-cache
      - name: Install pinned black-box tools and generate trusted fixtures
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends nasm
          echo 'Installing pinned FFmpeg'
          scripts/install-ci-oracle-ffmpeg.sh "$RUNNER_TEMP/cli-oracles" || { echo '::error::reason=pinned_ffmpeg_install_failed'; exit 1; }
          echo 'Installing pinned x264'
          scripts/install-x264.sh "$RUNNER_TEMP/cli-oracles" || { echo '::error::reason=pinned_x264_install_failed'; exit 1; }
          python3 -I scripts/oracle_pin.py --verify-bin "$RUNNER_TEMP/cli-oracles"
          export PATH="$RUNNER_TEMP/cli-oracles:$PATH"
          scripts/gen-fixtures.sh "$RUNNER_TEMP/cli-fixtures"
      - name: Verify stored native output and unchanged external behavior
        run: |
          python3 -I scripts/native_h264_cli.py \
            --candidate target/release/coreav \
            --default-candidate "$RUNNER_TEMP/default-candidate" \
            --baseline-default "$RUNNER_TEMP/default-base" \
            --baseline-external "$RUNNER_TEMP/external-base" \
            --baseline-native "$RUNNER_TEMP/native-base" \
            --baseline-revision "$(git -C ../baseline rev-parse HEAD)" \
            --driver target/release/examples/p \
            --ffmpeg "$RUNNER_TEMP/cli-oracles/ffmpeg" \
            --output "$RUNNER_TEMP/native-cli"
      - name: Retain encoder timeout and staging regressions
        env:
          COREAV_FFMPEG: ${{ runner.temp }}/cli-oracles/ffmpeg
          COREAV_X264: ${{ runner.temp }}/cli-oracles/x264
          COREAV_FIXTURES: ${{ runner.temp }}/cli-fixtures
          COREAV_REQUIRE_FFMPEG: '1'
        run: cargo test --locked --release -p coreav-cli --features native-h264-encoder,native-h264 --test transcode hostile_encoders_end_in_an_error_and_leave_nothing -- --exact
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: native-h264-cli
          path: ${{ runner.temp }}/native-cli/summary.json
          if-no-files-found: ignore
  h264-encoder-conformance:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
          components: clippy
      - name: Unit tests and opt-in driver
        run: |
          python3 -I -m unittest discover -s scripts/tests -p 'test_ci_reference_downloads.py' -v
          H264_VUI_FIXTURE_DIR="$RUNNER_TEMP/vui" H264_P_FIXTURE_DIR="$RUNNER_TEMP/p-forced" cargo test --locked --release -p coreav-h264-encoder --features full
          cargo clippy --locked -p coreav-h264-encoder --features full --all-targets -- -D warnings
          cargo build --locked --release -p coreav-h264-encoder --features full --example g1
          cargo build --locked --release -p coreav-h264-encoder --features full --example p
          cp target/release/examples/p "$RUNNER_TEMP/p-auto"
          cargo test --locked --release -p coreav-h264-encoder --features full,scalar
          cargo build --locked --release -p coreav-h264-encoder --features full,scalar --example p
          cp target/release/examples/p "$RUNNER_TEMP/p-scalar"
          python3 -I scripts/h264_g1_simd_identity.py --auto-driver "$RUNNER_TEMP/p-auto" --scalar-driver "$RUNNER_TEMP/p-scalar" --output "$RUNNER_TEMP/simd-identity"
          cp "$RUNNER_TEMP/p-auto" target/release/examples/p
          cargo build --locked --release -p coreav-h264 --example decode
          if cargo tree --locked -p coreav-h264-encoder --no-default-features -e normal | grep coreav-kernels-h264; then
            echo 'default encoder feature graph links H.264 kernels' >&2
            exit 1
          fi
          cargo tree --locked -p coreav-h264-encoder --features full -e normal | grep coreav-kernels-h264
          python3 -I -m unittest discover -s scripts/tests -p 'test_h264_g1*.py'
          python3 -I -m unittest discover -s scripts/tests -p 'test_h264_deblock.py'
          python3 -I -m unittest discover -s scripts/tests -p 'test_h264_p.py'
          python3 -I -m unittest discover -s scripts/tests -p 'test_h264_crf.py'
      - uses: ./.github/actions/oracle-cache
      - name: Read the decoder archive pins
        id: jm
        run: |
          . scripts/jm-decoder.env
          echo "version=$JM_VERSION" >> "$GITHUB_OUTPUT"
          echo "sha256=$JM_SHA256" >> "$GITHUB_OUTPUT"
          echo "ca-sha256=$JM_CA_SHA256" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/ci-archive-cache
        with:
          tool: jm
          version: ${{ steps.jm.outputs.version }}
          sha256: ${{ steps.jm.outputs.sha256 }}
      - uses: ./.github/actions/ci-archive-cache
        with:
          tool: jm-ca
          version: ${{ steps.jm.outputs.version }}
          sha256: ${{ steps.jm.outputs.ca-sha256 }}
      - name: Install black-box decoder oracles
        run: |
          scripts/install-ci-oracle-ffmpeg.sh "$RUNNER_TEMP/g1-oracles"
          bash scripts/install-ci-jm-decoder.sh "$RUNNER_TEMP/g1-oracles"
          python3 -I scripts/oracle_pin.py --verify-bin "$RUNNER_TEMP/g1-oracles"
          cat "$RUNNER_TEMP/g1-oracles/jm-build.txt"
      - name: Generate existing non-judged fixtures
        env:
          ORACLES: ${{ runner.temp }}/g1-oracles
        run: |
          export PATH="$ORACLES:$PATH"
          scripts/gen-fixtures.sh "$RUNNER_TEMP/g1-existing-fixtures"
      - name: Compare constant cadence and sample aspect ratio
        run: |
          python3 -I crates/coreav-h264-encoder/tests/vui.py --ffmpeg "$RUNNER_TEMP/g1-oracles/ffmpeg" --fixtures "$RUNNER_TEMP/vui"
      - name: Compare every visible plane with all three decoders
        run: |
          python3 -I scripts/h264_g1_conformance.py \
            --driver target/release/examples/g1 \
            --ffmpeg "$RUNNER_TEMP/g1-oracles/ffmpeg" \
            --jm "$RUNNER_TEMP/g1-oracles/ldecod" \
            --fixtures "$RUNNER_TEMP/g1-existing-fixtures" \
            --output "$RUNNER_TEMP/g1-conformance"
      - name: Compare enabled deblocking at every QP
        run: |
          python3 -I scripts/h264_deblock_conformance.py \
            --driver target/release/examples/g1 \
            --ffmpeg "$RUNNER_TEMP/g1-oracles/ffmpeg" \
            --jm "$RUNNER_TEMP/g1-oracles/ldecod" \
            --output "$RUNNER_TEMP/deblock-conformance"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: h264-encoder-conformance
          path: |
            ${{ runner.temp }}/g1-conformance
            ${{ runner.temp }}/vui
            ${{ runner.temp }}/deblock-conformance
            ${{ runner.temp }}/g1-oracles/jm-build.txt
          if-no-files-found: ignore
      - name: Compare synthetic P sequences with all three decoders
        run: |
          python3 -I scripts/h264_p_conformance.py \
            --driver target/release/examples/p \
            --decoder target/release/examples/decode \
            --forced-fixtures "$RUNNER_TEMP/p-forced" \
            --ffmpeg "$RUNNER_TEMP/g1-oracles/ffmpeg" \
            --jm "$RUNNER_TEMP/g1-oracles/ldecod" \
            --output "$RUNNER_TEMP/p-conformance"
      - name: Compare CRF pictures with all three decoders
        run: |
          python3 -I scripts/h264_crf_conformance.py \
            --driver target/release/examples/p \
            --decoder target/release/examples/decode \
            --ffmpeg "$RUNNER_TEMP/g1-oracles/ffmpeg" \
            --jm "$RUNNER_TEMP/g1-oracles/ldecod" \
            --output "$RUNNER_TEMP/crf-conformance"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: h264-p-conformance
          path: |
            ${{ runner.temp }}/p-conformance
            ${{ runner.temp }}/crf-conformance
            ${{ runner.temp }}/p-forced
            ${{ runner.temp }}/simd-identity/summary.json
          if-no-files-found: ignore
