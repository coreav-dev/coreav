name: hevc-reference
run-name: HEVC reference ${{ inputs.candidate }} (${{ inputs.only || 'all' }}, cap ${{ inputs.frames }})
# workflow-check: not required

on:
  workflow_dispatch:
    inputs:
      interpolation_ceiling:
        description: Count the interior reference copy ceiling only
        required: false
        default: false
        type: boolean
      inverse:
        description: Run the same-host inverse reconstruction comparison
        required: false
        default: false
        type: boolean
      candidate:
        description: Exact decoder commit
        required: true
        type: string
      baseline:
        description: Optional full baseline SHA for a comparison
        required: false
        default: ''
        type: string
      sanitizer_only:
        description: Run only the threading sanitizer stress check
        required: false
        default: false
        type: boolean
      only:
        description: Optional comma-separated input IDs
        required: false
        default: ''
        type: string
      frames:
        description: Maximum pictures per reference input
        required: false
        default: 32
        type: number
      diagnose_only:
        description: Compare pixels without timing or profiling
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  inverse-comparison:
    if: inputs.interpolation_ceiling != true && inputs.inverse
    uses: ./.github/workflows/hevc-inverse-reference.yml
    with:
      baseline: ${{ inputs.baseline }}
      candidate: ${{ inputs.candidate }}
      only: ${{ inputs.only }}
    secrets: inherit

  reference:
    if: ${{ !inputs.interpolation_ceiling && !inputs.inverse && inputs.baseline == '' && !inputs.sanitizer_only }}
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      CANDIDATE: ${{ inputs.candidate }}
      ONLY: ${{ inputs.only }}
      DIAGNOSE_ONLY: ${{ inputs.diagnose_only }}
      FRAMES: ${{ inputs.frames }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          path: driver
      - name: Check reference process and comparison boundaries
        run: python3 -m unittest discover -s driver/scripts/tests -p test_reference_hevc.py
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: ${{ env.CANDIDATE }}
          path: candidate
      - name: Admit only commits on this repository's branches
        working-directory: candidate
        run: |
          set -euo pipefail
          git fetch --quiet --unshallow --no-tags origin '+refs/heads/*:refs/remotes/origin/*'
          test -n "$(git branch -r --contains "$CANDIDATE")"
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249
        with:
          toolchain: stable
      - name: Build the opt-in scalar driver
        working-directory: candidate
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE"
          cp ../driver/bench/hevc-reference/decode.rs crates/coreav-hevc/examples/reference.rs
          CARGO_PROFILE_RELEASE_DEBUG=1 cargo build --locked --release -p coreav-hevc --features native-hevc --example reference
          rustc -Vv > "$RUNNER_TEMP/compiler.txt"
      - name: Install profiling tools
        run: sudo apt-get update -qq && sudo apt-get install -y valgrind
      - name: Install the pinned binary oracle
        env:
          R2_ENDPOINT: ${{ secrets.COREAV_CORPUS_R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.COREAV_CORPUS_R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.COREAV_CORPUS_R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ vars.COREAV_CORPUS_R2_BUCKET }}
        run: driver/scripts/install-oracle-ffmpeg.sh "$RUNNER_TEMP/oracle"
      - name: Compare pixels before decoder-only reference calls
        env:
          R2_ENDPOINT: ${{ secrets.COREAV_CORPUS_R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.COREAV_CORPUS_R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.COREAV_CORPUS_R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ vars.COREAV_CORPUS_R2_BUCKET }}
        run: |
          EXTRA=()
          if [ "$DIAGNOSE_ONLY" = true ]; then EXTRA+=(--diagnose-only); fi
          python3 -I driver/scripts/hevc_reference.py \
            --native "$PWD/candidate/target/release/examples/reference" \
            --oracle-bin "$RUNNER_TEMP/oracle" --out "$RUNNER_TEMP/reference" \
            --candidate "$CANDIDATE" --only "$ONLY" --frames "$FRAMES" "${EXTRA[@]}"
      - name: Bind retained results to the dispatched decoder
        run: |
          python3 -I driver/scripts/hevc_reference.py check-result \
            "$RUNNER_TEMP/reference/results.json" --expected-candidate "$CANDIDATE"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: hevc-reference-${{ env.CANDIDATE }}
          path: |
            ${{ runner.temp }}/reference/results.json
            ${{ runner.temp }}/compiler.txt
          if-no-files-found: error
          retention-days: 30

  threading:
    if: ${{ !inputs.interpolation_ceiling && !inputs.inverse && (inputs.baseline != '' || inputs.sanitizer_only) }}
    uses: ./.github/workflows/hevc-threading.yml
    with:
      candidate: ${{ inputs.candidate }}
      baseline: ${{ inputs.baseline }}
      sanitizer_only: ${{ inputs.sanitizer_only }}
      only: ${{ inputs.only }}
      frames: ${{ fromJSON(inputs.frames) }}
    secrets: inherit

  interpolation-ceiling:
    if: inputs.interpolation_ceiling
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CANDIDATE: ${{ inputs.candidate }}
      BASELINE: ${{ inputs.baseline }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: .
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: baseline
          ref: ${{ inputs.baseline }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: shipping
          ref: ${{ inputs.candidate }}
          persist-credentials: false
          fetch-depth: 0
      - name: Admit exact owned arms before credentials
        run: |
          set -euo pipefail
          test "$(git -C . rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C baseline rev-parse HEAD)" = "$BASELINE"
          test "$(git -C shipping rev-parse HEAD)" = "$CANDIDATE"
          test -n "$(git -C shipping branch -r --contains "$CANDIDATE")"
          git -C baseline merge-base --is-ancestor "$BASELINE" origin/main
          python3 -I scripts/hevc_interpolation_copy_ceiling.py self-test
          python3 -m unittest discover -s scripts/tests -p test_reference_hevc.py
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249
        with:
          toolchain: stable
      - name: Build both exact arms with identical settings
        env:
          CARGO_PROFILE_RELEASE_DEBUG: 1
          CARGO_INCREMENTAL: 0
        run: |
          set -euo pipefail
          cp bench/hevc-reference/decode.rs baseline/crates/coreav-hevc/examples/reference.rs
          cp bench/hevc-reference/decode.rs shipping/crates/coreav-hevc/examples/reference.rs
          (cd baseline && CARGO_TARGET_DIR="$RUNNER_TEMP/target-baseline" cargo build --locked --release -p coreav-hevc --features native-hevc --example reference)
          (cd shipping && CARGO_TARGET_DIR="$RUNNER_TEMP/target-ablated" cargo build --locked --release -p coreav-hevc --features native-hevc --example reference)
          mkdir -p "$RUNNER_TEMP/counts"
          rustc -Vv > "$RUNNER_TEMP/counts/compiler.txt"
          grep -qw avx2 /proc/cpuinfo
          (cd shipping && CARGO_TARGET_DIR="$RUNNER_TEMP/target-ablated" cargo test --locked -p coreav-kernels-hevc --features native-hevc)
          (cd shipping && CARGO_TARGET_DIR="$RUNNER_TEMP/target-ablated" cargo test --locked -p coreav-kernels-hevc --features native-hevc,scalar)
      - name: Install instruction counter
        run: sudo apt-get update -qq && sudo apt-get install -y valgrind
      - uses: ./.github/actions/oracle-cache
      - name: Install the pinned binary oracle
        run: scripts/install-ci-oracle-ffmpeg.sh "$RUNNER_TEMP/oracle"
      - name: Verify pixels and count only the interior reference copy erasure
        env:
          R2_ENDPOINT: ${{ secrets.COREAV_CORPUS_R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.COREAV_CORPUS_R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.COREAV_CORPUS_R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ vars.COREAV_CORPUS_R2_BUCKET }}
        run: |
          python3 -I scripts/hevc_interpolation_copy_ceiling.py \
            --baseline "$RUNNER_TEMP/target-baseline/release/examples/reference" \
            --ablated "$RUNNER_TEMP/target-ablated/release/examples/reference" \
            --baseline-sha "$BASELINE" --ablated-sha "$CANDIDATE" \
            --oracle-bin "$RUNNER_TEMP/oracle" --out "$RUNNER_TEMP/counts"
      - name: Seal private counts without publishing inputs or figures
        if: always()
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/counts" "$RUNNER_TEMP/sealed"
          tar -czf "$RUNNER_TEMP/counts.tgz" -C "$RUNNER_TEMP/counts" .
          openssl rand -hex -out "$RUNNER_TEMP/key.txt" 32
          openssl enc -aes-256-cbc -pbkdf2 -salt -pass file:"$RUNNER_TEMP/key.txt" -in "$RUNNER_TEMP/counts.tgz" -out "$RUNNER_TEMP/sealed/counts.tgz.enc"
          openssl pkeyutl -encrypt -pubin -inkey bench/hevc-interpolation-copy/evidence-public.pem -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 -in "$RUNNER_TEMP/key.txt" -out "$RUNNER_TEMP/sealed/key.txt.enc"
          shred -u "$RUNNER_TEMP/key.txt" "$RUNNER_TEMP/counts.tgz"
          rm -rf "$RUNNER_TEMP/counts"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: main10-shipping-count-sealed
          path: ${{ runner.temp }}/sealed
          if-no-files-found: error
          retention-days: 1
