name: hevc-reference
run-name: HEVC remaining filter count ${{ inputs.baseline }}

on:
  workflow_dispatch:
    inputs:
      baseline:
        description: Exact main commit to count
        required: true
        type: string
      cases:
        description: JSON array of neutral reference IDs
        required: true
        type: string
        default: '["d00", "d01", "d02", "d03", "d04", "d05", "d06", "d07", "d08", "d09", "d10", "d11", "d12", "d13", "d14", "d15", "d16", "d17", "d18", "d19", "d20", "d21", "d22", "d23", "d24", "d25", "c00", "c01", "c02", "c03"]'
      frames:
        description: Maximum original pictures per reference
        required: true
        type: number
        default: 16
      diagnose:
        description: Diagnose oracle qualification only, without instruction counting
        required: true
        type: boolean
        default: false
      arms:
        description: Space-separated scalar erasure targets
        required: true
        type: string
        default: deblock10 deblock-write deblock8-gather sao8-validation sao8-tail sao8-protection

permissions:
  contents: read

jobs:
  count:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        case: ${{ fromJSON(inputs.cases) }}
    env:
      BASELINE: ${{ inputs.baseline }}
      CASE: ${{ matrix.case }}
      FRAMES: ${{ inputs.frames }}
      DIAGNOSE: ${{ inputs.diagnose }}
      ARMS: ${{ inputs.arms }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
          path: driver
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ env.BASELINE }}
          path: main
      - name: Admit the exact main commit
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, re
          assert re.fullmatch('[0-9a-f]{40}', os.environ['BASELINE'])
          assert re.fullmatch('[dc][0-9]{2}', os.environ['CASE'])
          assert 1 <= int(os.environ['FRAMES']) <= 32
          arms = os.environ['ARMS'].split()
          assert arms and set(arms) <= {'deblock10', 'deblock-write', 'deblock8-gather', 'deblock-metadata', 'sao8-validation', 'sao8-tail', 'sao8-protection'}
          PY
          test "$(git -C main rev-parse HEAD)" = "$BASELINE"
          git -C main merge-base --is-ancestor "$BASELINE" origin/main
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249
        with:
          toolchain: stable
      - name: Build matched original and erased arithmetic
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/count" "$RUNNER_TEMP/binaries"
          cp driver/bench/hevc-reference/decode.rs main/crates/coreav-hevc/examples/reference.rs
          export CARGO_PROFILE_RELEASE_DEBUG=1
          (cd main && cargo build --locked --release -p coreav-hevc --features native-hevc --example reference)
          cp main/target/release/examples/reference "$RUNNER_TEMP/binaries/main"
          cp main/crates/coreav-kernels-hevc/src/filter.rs "$RUNNER_TEMP/kernel.rs"
          cp main/crates/coreav-hevc/src/reconstruction/filter.rs "$RUNNER_TEMP/driver.rs"
          if [ "$DIAGNOSE" != true ]; then
          for ARM in $ARMS; do
            cp "$RUNNER_TEMP/kernel.rs" main/crates/coreav-kernels-hevc/src/filter.rs
            cp "$RUNNER_TEMP/driver.rs" main/crates/coreav-hevc/src/reconstruction/filter.rs
            python3 -I driver/scripts/filter_ceiling.py erase --kind "$ARM" --filter main/crates/coreav-kernels-hevc/src/filter.rs --driver main/crates/coreav-hevc/src/reconstruction/filter.rs --diff "$RUNNER_TEMP/count/$ARM.patch"
            (cd main && cargo build --locked --release -p coreav-hevc --features native-hevc --example reference)
            cp main/target/release/examples/reference "$RUNNER_TEMP/binaries/$ARM"
          done
          fi
          rustc -Vv > "$RUNNER_TEMP/count/compiler.txt"
      - name: Install instruction profiler
        run: sudo apt-get update -qq && sudo apt-get install -y valgrind
      - name: Install the qualified binary oracle
        env:
          R2_ENDPOINT: ${{ secrets.COREAV_CORPUS_R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.COREAV_CORPUS_R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.COREAV_CORPUS_R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ vars.COREAV_CORPUS_R2_BUCKET }}
        run: driver/scripts/install-oracle-ffmpeg.sh "$RUNNER_TEMP/oracle"
      - name: Verify original pixels and count removed arithmetic
        env:
          R2_ENDPOINT: ${{ secrets.COREAV_CORPUS_R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.COREAV_CORPUS_R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.COREAV_CORPUS_R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ vars.COREAV_CORPUS_R2_BUCKET }}
        run: |
          if [ "$DIAGNOSE" = true ]; then
            python3 -I driver/scripts/filter_oracle_diagnostic.py --baseline "$BASELINE" \
              --native "$RUNNER_TEMP/binaries/main" --oracle-bin "$RUNNER_TEMP/oracle" \
              --only "$CASE" --frames "$FRAMES" --out "$RUNNER_TEMP/count"
          else
            python3 -I driver/scripts/filter_ceiling.py run --baseline "$BASELINE" --arms $ARMS \
              --binaries "$RUNNER_TEMP/binaries" --oracle-bin "$RUNNER_TEMP/oracle" \
              --only "$CASE" --depth 0 --frames "$FRAMES" --out "$RUNNER_TEMP/count"
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: remainder-count-${{ matrix.case }}
          path: ${{ runner.temp }}/count
          retention-days: 1
