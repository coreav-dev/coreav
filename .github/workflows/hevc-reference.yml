name: hevc-reference
# workflow-check: not required
on:
  workflow_dispatch:
    inputs:
      candidate:
        required: true
        type: string
permissions:
  contents: read
jobs:
  profile:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
          path: candidate
      - name: Admit the owned diagnostic branch
        working-directory: candidate
        env:
          CANDIDATE: ${{ inputs.candidate }}
        run: |
          test "$GITHUB_REF" = refs/heads/work/hevc-threading-profile
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$GITHUB_SHA" = "$CANDIDATE"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: 5f3aa0a4326cd20d52aac26b4947e23a36d463c0
          fetch-depth: 0
          path: baseline
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249
        with:
          toolchain: stable
      - name: Build instrumentation and the unchanged serial baseline
        run: |
          set -euo pipefail
          cp candidate/bench/hevc-reference/decode.rs candidate/crates/coreav-hevc/examples/reference.rs
          cp candidate/bench/hevc-reference/decode.rs baseline/crates/coreav-hevc/examples/reference.rs
          (cd candidate && RUSTFLAGS='--check-cfg=cfg(hevc_serial_baseline)' cargo build --locked --release -p coreav-hevc --features native-hevc --example reference)
          (cd baseline && RUSTFLAGS='--cfg hevc_serial_baseline --check-cfg=cfg(hevc_serial_baseline)' cargo build --locked --release -p coreav-hevc --features native-hevc --example reference)
      - name: Install the qualified oracle
        env:
          R2_ENDPOINT: ${{ secrets.COREAV_CORPUS_R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.COREAV_CORPUS_R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.COREAV_CORPUS_R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ vars.COREAV_CORPUS_R2_BUCKET }}
        run: candidate/scripts/install-oracle-ffmpeg.sh "$RUNNER_TEMP/oracle"
      - name: Record private scheduler phases and baseline geometry
        env:
          R2_ENDPOINT: ${{ secrets.COREAV_CORPUS_R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.COREAV_CORPUS_R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.COREAV_CORPUS_R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ vars.COREAV_CORPUS_R2_BUCKET }}
        run: |
          umask 077
          ulimit -v 2097152
          python3 candidate/scripts/hevc_wpp_profile.py --native "$PWD/candidate/target/release/examples/reference" --main "$PWD/baseline/target/release/examples/reference" --oracle-bin "$RUNNER_TEMP/oracle" --out "$RUNNER_TEMP/private" > "$RUNNER_TEMP/profile.log" 2>&1
      - name: Seal diagnostic metadata
        if: always()
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          [ -d private ] || exit 0
          cp profile.log private/
          tar -czf records.tgz private
          mkdir -p sealed
          openssl rand -hex -out key.txt 32
          openssl enc -aes-256-cbc -pbkdf2 -salt -pass file:key.txt -in records.tgz -out sealed/records.tgz.enc
          openssl pkeyutl -encrypt -pubin -inkey "$GITHUB_WORKSPACE/candidate/bench/hevc-conformance/evidence-public.pem" -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 -in key.txt -out sealed/key.txt.enc
          shred -u key.txt records.tgz
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: hevc-wpp-profile-${{ github.sha }}
          path: ${{ runner.temp }}/sealed
          if-no-files-found: error
          retention-days: 7
