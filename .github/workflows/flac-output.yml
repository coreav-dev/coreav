name: flac-output

# workflow-check: not required

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - crates/coreav-audio/**
      - crates/coreav-cli/src/ffmpeg/**
      - scripts/flac_output_check.py
      - scripts/flac_output_identity.py
      - scripts/flac_output_measure.py
      - scripts/tests/test_flac_output_measure.py
      - scripts/tests/test_flac_output_check.py
      - scripts/tests/test_flac_output_identity.py
      - scripts/oracle_audio.py
      - scripts/oracle-audio-args.txt
      - scripts/oracle_pin.py
      - scripts/oracle-ffmpeg.env
      - scripts/install-oracle-ffmpeg.sh
      - tools/compat-corpus/speed.py
      - .github/workflows/flac-output.yml
  workflow_dispatch:
    inputs:
      frame_ceiling:
        description: Build a diagnostic-only encoded-frame replay arm
        type: boolean
        default: false
      subframe_ceiling:
        description: Build a diagnostic-only selected-subframe replay arm
        type: boolean
        default: false
      rice_ceiling:
        description: Build a diagnostic-only Rice decision capture and replay arm
        type: boolean
        default: false
      build_only:
        description: Build diagnostic binaries without running profiles
        type: boolean
        default: false
      diagnostic:
        description: Profile spent synthetic FLAC inputs without judging bars
        type: boolean
        default: false
      measure:
        description: Run the registered size and speed comparison after merge
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  flac-output:
    if: ${{ !inputs.diagnostic }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - name: Install and verify the pinned oracle
        run: |
          scripts/install-oracle-ffmpeg.sh "$RUNNER_TEMP/oracle"
          python3 -I scripts/oracle_pin.py --verify-bin "$RUNNER_TEMP/oracle"
      - name: Check native frames and failure states
        env:
          COREAV_FFMPEG: ${{ runner.temp }}/oracle/ffmpeg
          COREAV_REQUIRE_FFMPEG: "1"
        run: |
          cargo test --locked --no-fail-fast -p coreav-audio --lib --test flac_encode
      - name: Build the native compatibility command
        run: cargo build --locked -p coreav-cli
      - name: Require byte-identical residual optimization
        run: |
          python3 -I -m unittest discover -s scripts/tests -p test_flac_output_identity.py
          baseline=$(python3 -I scripts/flac_output_identity.py --baseline)
          reference="$RUNNER_TEMP/flac-reference"
          git fetch --no-tags --depth=1 origin "$baseline"
          git worktree add --detach "$reference" "$baseline"
          test "$(git -C "$reference" rev-parse HEAD)" = "$baseline"
          mkdir -p "$reference/crates/coreav-audio/examples"
          cp crates/coreav-audio/examples/flac_identity.rs "$reference/crates/coreav-audio/examples/flac_identity.rs"
          cargo build --locked --release -p coreav-audio --example flac_identity
          CARGO_TARGET_DIR="$RUNNER_TEMP/flac-reference-target" cargo build --locked --release \
            --manifest-path "$reference/Cargo.toml" -p coreav-audio --example flac_identity
          python3 -I scripts/flac_output_identity.py \
            --reference "$RUNNER_TEMP/flac-reference-target/release/examples/flac_identity" \
            --candidate target/release/examples/flac_identity --candidate-commit "$(git rev-parse HEAD)" \
            --producer crates/coreav-audio/examples/flac_identity.rs --out "$RUNNER_TEMP/flac-identity.json"
      - name: Compare complete output with the independent decoder
        run: |
          python3 -I -m unittest discover -s scripts/tests -p test_flac_output_check.py
          python3 -I scripts/flac_output_check.py --coreav target/debug/coreav \
            --oracle-dir "$RUNNER_TEMP/oracle" --out "$RUNNER_TEMP/flac-correctness.json"
      - name: Check the measurement driver without judged inputs
        run: |
          python3 -I -m unittest discover -s scripts/tests -p test_flac_output_measure.py
          python3 -I scripts/flac_output_measure.py --smoke --coreav target/debug/coreav \
            --oracle-dir "$RUNNER_TEMP/oracle" --out "$RUNNER_TEMP/flac-smoke.json"
      - name: Require merged main before measuring
        if: github.event_name == 'workflow_dispatch' && inputs.measure
        run: test "$GITHUB_REF" = refs/heads/main
      - name: Build the release encoder
        if: github.event_name == 'workflow_dispatch' && inputs.measure
        run: cargo build --locked --release -p coreav-cli
      - name: Run the registered comparison once
        if: github.event_name == 'workflow_dispatch' && inputs.measure
        run: |
          python3 -I scripts/flac_output_measure.py --coreav target/release/coreav \
            --oracle-dir "$RUNNER_TEMP/oracle" --out "$RUNNER_TEMP/flac-measurement.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: flac-output
          path: |
            ${{ runner.temp }}/flac-correctness.json
            ${{ runner.temp }}/flac-identity.json
            ${{ runner.temp }}/flac-smoke.json
            ${{ runner.temp }}/flac-measurement.json
          if-no-files-found: ignore
  flac-cpu-diagnostic:
    if: github.event_name == 'workflow_dispatch' && inputs.diagnostic
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - name: Prepare diagnostic tools and pinned executable oracle
        run: |
          test '${{ inputs.measure }}' != true
          if [ '${{ inputs.rice_ceiling }}' = true ] || [ '${{ inputs.subframe_ceiling }}' = true ] || [ '${{ inputs.frame_ceiling }}' = true ]; then
            test '${{ inputs.build_only }}' = true
            count=0
            for enabled in '${{ inputs.rice_ceiling }}' '${{ inputs.subframe_ceiling }}' '${{ inputs.frame_ceiling }}'; do
              if [ "$enabled" = true ]; then count=$((count + 1)); fi
            done
            test "$count" = 1
          fi
          if [ '${{ inputs.build_only }}' != true ]; then
            sudo apt-get update -qq
            sudo apt-get install -y linux-tools-common linux-tools-generic
            sudo sysctl kernel.perf_event_paranoid=-1
            perf=$(find -L /usr/lib/linux-tools -type f -name perf | head -1)
            test -n "$perf"
            sudo "$perf" stat -x ';' -o "$RUNNER_TEMP/perf-probe.txt" -e instructions:u,cycles:u -- true
            cat "$RUNNER_TEMP/perf-probe.txt"
            ! grep -E '<not (supported|counted)>' "$RUNNER_TEMP/perf-probe.txt"
          fi
          scripts/install-oracle-ffmpeg.sh "$RUNNER_TEMP/oracle"
          python3 -I scripts/oracle_pin.py --verify-bin "$RUNNER_TEMP/oracle"
      - name: Preflight aligned executable options
        run: |
          python3 - <<'PY'
          import os, pathlib, subprocess, sys
          sys.path.insert(0, 'scripts')
          from flac_cpu_diagnostic import ALIGNED
          ffmpeg = pathlib.Path(os.environ['RUNNER_TEMP']) / 'oracle/ffmpeg'
          for channels in (1, 2):
              for sample_format in ('s16', 's32'):
                  encoded = subprocess.run([str(ffmpeg), '-v', 'error', '-f', 'lavfi', '-i',
                      'sine=frequency=1000:sample_rate=48000:duration=0.2', '-ac', str(channels),
                      '-sample_fmt', sample_format, '-c:a', 'flac', *ALIGNED, '-f', 'flac', '-'],
                      check=True, capture_output=True, timeout=30).stdout
                  subprocess.run([str(ffmpeg), '-v', 'error', '-err_detect', 'crccheck', '-xerror',
                      '-i', '-', '-f', 'null', '-'], input=encoded, check=True, capture_output=True, timeout=30)
          print('All four aligned executable preflights passed')
          PY
      - name: Build plain and symbolized optimized commands
        run: |
          cargo build --locked --release -p coreav-cli
          cp target/release/coreav "$RUNNER_TEMP/plain-coreav"
          if [ '${{ inputs.rice_ceiling }}' = true ] || [ '${{ inputs.subframe_ceiling }}' = true ] || [ '${{ inputs.frame_ceiling }}' = true ]; then
            sha256sum crates/coreav-audio/src/flac/encode.rs > "$RUNNER_TEMP/encoder-before.sha256"
            if [ '${{ inputs.frame_ceiling }}' = true ]; then
              python3 -I scripts/flac_frame_ceiling.py --instrument crates/coreav-audio/src/flac/encode.rs
            elif [ '${{ inputs.subframe_ceiling }}' = true ]; then
              python3 -I scripts/flac_subframe_ceiling.py --instrument crates/coreav-audio/src/flac/encode.rs
            else
              python3 -I scripts/flac_rice_ceiling.py --instrument crates/coreav-audio/src/flac/encode.rs
            fi
            cargo build --locked --release -p coreav-cli
          else
            CARGO_PROFILE_RELEASE_DEBUG=2 RUSTFLAGS='-C force-frame-pointers=yes' cargo build --locked --release -p coreav-cli
          fi
      - name: Capture unjudged counters and native profiles
        if: ${{ !inputs.build_only }}
        run: |
          python3 -I scripts/flac_cpu_diagnostic.py --plain "$RUNNER_TEMP/plain-coreav" \
            --profile target/release/coreav --oracle "$RUNNER_TEMP/oracle" --out "$RUNNER_TEMP/flac-cpu"
      - name: Package diagnostic binaries
        if: inputs.build_only
        run: |
          mkdir "$RUNNER_TEMP/flac-build"
          cp "$RUNNER_TEMP/plain-coreav" "$RUNNER_TEMP/flac-build/plain-coreav"
          cp target/release/coreav "$RUNNER_TEMP/flac-build/profile-coreav"
          cp -r "$RUNNER_TEMP/oracle" "$RUNNER_TEMP/flac-build/oracle"
          git rev-parse HEAD > "$RUNNER_TEMP/flac-build/source.txt"
          rustc --version > "$RUNNER_TEMP/flac-build/rustc.txt"
          if [ '${{ inputs.rice_ceiling }}' = true ] || [ '${{ inputs.subframe_ceiling }}' = true ] || [ '${{ inputs.frame_ceiling }}' = true ]; then
            cp crates/coreav-audio/src/flac/encode.rs "$RUNNER_TEMP/flac-build/instrumented-encode.rs"
            cp "$RUNNER_TEMP/encoder-before.sha256" "$RUNNER_TEMP/flac-build/"
          fi
          cd "$RUNNER_TEMP/flac-build"
          find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: inputs.build_only
        with:
          name: flac-build
          path: ${{ runner.temp }}/flac-build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: flac-cpu-diagnostic
          path: ${{ runner.temp }}/flac-cpu
          if-no-files-found: ignore
