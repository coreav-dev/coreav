name: deny

# The licence and advisory checks (cargo-deny, including every fuzz project's
# own dependency graph), the check that default builds link no
# still-patented codec, the DCO sign-off check and the workflow check, in one
# job; the required `deny` name is a report job that always runs and fails
# when that job failed or was cancelled (docs/design/ci-checks.md).
# Nothing here is filtered, by design: every commit needs a sign-off whatever
# it touches, a dependency can change in a file ci.yml's filter ignores, and
# the required-check list has to stay true of the workflows even when a pull
# request changes nothing but documentation (docs/design/ci-checks.md).

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  # A group of the merge queue: the pull requests queued, applied to main
  # (docs/design/ci-checks.md, "The merge queue").
  merge_group:
    types: [checks_requested]

permissions:
  contents: read
  actions: read

concurrency:
  # Supersede PR runs and main pushes. Merge groups, manual and scheduled
  # runs have run-id groups of their own (docs/design/ci-checks.md).
  group: ${{ github.workflow }}-${{ (github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')) && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}

jobs:
  deny-checks:
    # One job for the license and advisory checks, the DCO check and the
    # workflow check: each is seconds long, and every job is billed at least
    # a minute.
    runs-on: ubuntu-24.04
    # This job runs for 7 to 10 minutes, so the ceiling sits far above that
    # rather than at it. GitHub cancels a job that reaches its own timeout
    # and reports the check as cancelled, and nothing starts a newer run to
    # replace that cancellation; a timeout here is a red `deny` instead,
    # reported by the job below (docs/design/ci-checks.md, "A job timeout is
    # not a cancellation").
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          # Full history and every branch, so the DCO step can list the
          # PR's commits and skip those already on main.
          fetch-depth: 0
      - id: result
        uses: ./.github/actions/merge-group-result
        with:
          workflow: deny.yml
      # scripts/pr_shape_check.py reads a body with the parser pinned in
      # scripts/pr-text-requirements.txt, and its self-test sits in the step
      # below. A virtual environment keeps the runner's own Python untouched,
      # and $GITHUB_PATH makes `python3` in the later steps this one.
      - name: Install the parser the pull request body is read with
        if: steps.result.outputs.reuse != 'true'
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/parser"
          "$RUNNER_TEMP/parser/bin/pip" install --quiet --require-hashes -r scripts/pr-text-requirements.txt
          "$RUNNER_TEMP/parser/bin/pip" install --quiet --only-binary=:all: --require-hashes -r scripts/aac-pns-requirements.txt
          echo "$RUNNER_TEMP/parser/bin" >> "$GITHUB_PATH"
      # The required checks and the workflows have to agree whatever a change
      # touches, and docs/design/ci-checks.md, which names them, is
      # itself behind ci.yml's filter; so this runs here, where nothing is
      # filtered (docs/design/ci-checks.md).
      - name: Check the workflows against the required-check list
        if: steps.result.outputs.reuse != 'true'
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          python3 -I scripts/workflow_check.py
          python3 -I scripts/compat_sources.py check
          python3 -I scripts/compat_frozen_check.py
          python3 -I scripts/oracle_pin.py --check
          python3 -I scripts/workflow_check_selftest.py
          python3 -I -m unittest discover -s scripts/tests -p 'test_oracle_install.py' -v
          for suite in test_ci_downloads.py test_ci_reference_downloads.py test_maturin_downloads.py; do
            python3 -I -m unittest discover -s scripts/tests -p "$suite" -v
          done
          python3 -m unittest discover -s scripts/encoders/macos -p 'test_source_freeze.py' -v
          python3 -I -m unittest discover -s .github/actions/changed-paths/tests -p 'test_*.py'
          python3 -I scripts/pr_text_check_selftest.py
          python3 -I scripts/pr_shape_check_selftest.py
          python3 -I scripts/issue_refs_check.py
          python3 -I scripts/issue_refs_check_selftest.py
          python3 -I scripts/dco_check_selftest.py
          python3 -I scripts/label_sync.py --check
      # An expression has to use a context GitHub makes available where it
      # stands: a `runner` expression in a job's `env:` parses as YAML, passes
      # the checks above and fails only when the workflow runs. actionlint
      # holds GitHub's availability table, so it runs here rather than
      # that rule being rewritten in scripts/workflow_check.py's line parser.
      # Its shellcheck and pyflakes passes are off: they judge scripts, not
      # expressions. The fixture it writes is the mistake this step exists
      # for, which has to fail.
      - uses: ./.github/actions/ci-check-tool
        with:
          tool: actionlint
      - name: Check the expressions of the workflows
        run: |
          set -euo pipefail
          actionlint -shellcheck= -pyflakes=
          # GitHub expands an expression anywhere in this script before it
          # runs, so the fixture's opening is put together here.
          open='$''{{'
          printf '%s\n' 'on: push' 'jobs:' '  probe:' '    runs-on: ubuntu-24.04' '    env:' \
            "      DIR: $open runner.temp }}/out" '    steps:' '      - run: echo hi' \
            > "$RUNNER_TEMP/runner-in-job-env.yml"
          if found=$(actionlint -shellcheck= -pyflakes= "$RUNNER_TEMP/runner-in-job-env.yml" 2>&1); then
            echo 'actionlint accepted a runner expression in a job env' >&2
            exit 1
          fi
          grep -q 'context "runner" is not allowed here' <<< "$found"
      # tools/compat-corpus/commands-v1 stays what tools/compat-corpus/classify.py says
      # it is, the vocabulary table of docs/design/compat-cli.md stays what
      # that file implements (docs/design/compat-cli.md, bar B5), and
      # docs/measurements/compat-ffprobe.md says what its JSON evidence
      # holds (tools/compat-corpus/record.py). It runs here, not in ci.yml,
      # because the notes it reads are behind that workflow's path filter.
      - uses: ./.github/actions/oracle-cache
        if: steps.result.outputs.reuse != 'true'
      - name: Install the pinned test oracle
        if: steps.result.outputs.reuse != 'true'
        run: scripts/install-ci-oracle-ffmpeg.sh "$RUNNER_TEMP/coreav-test-oracle"
      - name: Verify the test oracle before real Python discovery
        if: steps.result.outputs.reuse != 'true'
        run: |
          python3 -I scripts/oracle_pin.py --verify-bin "$RUNNER_TEMP/coreav-test-oracle"
          echo "COREAV_FFMPEG=$RUNNER_TEMP/coreav-test-oracle/ffmpeg" >> "$GITHUB_ENV"
          echo "COREAV_FFPROBE=$RUNNER_TEMP/coreav-test-oracle/ffprobe" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/coreav-test-oracle" >> "$GITHUB_PATH"
      - name: Check the command-coverage set against its rules
        if: steps.result.outputs.reuse != 'true'
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 -I -m unittest discover -s tools/compat-corpus/tests -p 'test_*.py'
      # The pure parts of the transcode oracle (docs/design/transcode.md,
      # "Bars"): seconds long, no FFmpeg, no corpus.
      - name: Self-test the transcode oracle
        if: steps.result.outputs.reuse != 'true'
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 -I scripts/transcode_check_selftest.py
      # A round's speed bars go through scripts/h264_parity_bars.py, which
      # refuses reports that miss a stream; no new per-round analyze*.py is
      # added under docs/measurements (docs/design/h264.md, "A round's bars:
      # one analyzer, complete reports"). It runs here, not in ci.yml, because
      # that workflow's filter skips a change to docs/measurements alone.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        if: steps.result.outputs.reuse != 'true'
        with:
          node-version: 24
      - name: Install structural invocation discovery
        if: steps.result.outputs.reuse != 'true'
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/oracle-discovery" --no-audit --no-fund --save-exact @ast-grep/cli@0.50.0
          echo "$RUNNER_TEMP/oracle-discovery/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Check the measurement analyzers
        if: steps.result.outputs.reuse != 'true'
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          OPENBLAS_NUM_THREADS: '1'
        run: python3 -I -m unittest discover -s scripts/tests -p 'test_*.py'
      - name: Check Opus capacity before a new registration
        if: steps.result.outputs.reuse != 'true'
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          OPENBLAS_NUM_THREADS: '1'
        run: |
          set -euo pipefail
          python3 -m pip install --quiet --require-hashes -r bench/audio-decode/requirements.txt
          python3 -I -m unittest discover -s bench/audio-decode/tests -p 'test_*.py'
          python3 -I bench/audio-decode/capacity.py check-registrations
      - name: Check registered Opus timing and reporting
        if: steps.result.outputs.reuse != 'true'
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          OPENBLAS_NUM_THREADS: '1'
        run: |
          set -euo pipefail
          python3 -m pip install --quiet --require-hashes -r bench/opus-speed/requirements.txt
          python3 -I -m unittest discover -s bench/opus-speed/tests -p 'test_*.py'
      # The fuzz projects are outside the workspace; check their own license
      # graphs. Projects are found as scripts/fuzz_plan.py finds them
      # (crates/*/fuzz), so a new one is checked without editing this file;
      # finding none fails.
      - name: Install cargo-deny
        if: steps.result.outputs.reuse != 'true' || github.event_name == 'merge_group'
        uses: ./.github/actions/ci-check-tool
        with:
          tool: cargo-deny
      - name: Check the workspace dependency policy
        if: steps.result.outputs.reuse != 'true'
        run: |
          set -euo pipefail
          rustup show active-toolchain || rustup toolchain install
          CARGO_TERM_COLOR=always cargo-deny --log-level warn --manifest-path ./Cargo.toml --all-features check
      - name: Refresh advisory checks on a reused merge group
        id: fresh-advisories
        if: github.event_name == 'merge_group' && steps.result.outputs.reuse == 'true'
        run: |
          set -euo pipefail
          python3 scripts/fuzz_plan.py --projects > "$RUNNER_TEMP/fuzz-projects.txt"
          status=0
          cargo deny --all-features check advisories || status=1
          while read -r project; do
            cargo deny --all-features --manifest-path "$project/Cargo.toml" check advisories || status=1
          done < "$RUNNER_TEMP/fuzz-projects.txt"
          exit "$status"
      - name: Require fresh advisories on a reused merge group
        if: always() && github.event_name == 'merge_group' && steps.result.outputs.reuse == 'true'
        env:
          ADVISORIES: ${{ steps.fresh-advisories.outcome }}
        run: test "$ADVISORIES" = success
      - name: Check the licenses of every fuzz project
        if: steps.result.outputs.reuse != 'true'
        run: |
          set -euo pipefail
          # As the action does: make sure rust-toolchain.toml's toolchain is
          # installed before cargo-deny runs cargo metadata.
          rustup show active-toolchain || rustup toolchain install
          python3 scripts/fuzz_plan.py --projects > "$RUNNER_TEMP/fuzz-projects.txt"
          status=0
          while read -r project; do
            echo "::group::$project"
            cargo-deny --all-features --manifest-path "$project/Cargo.toml" check licenses || status=1
            echo "::endgroup::"
          done < "$RUNNER_TEMP/fuzz-projects.txt"
          exit "$status"
      # Default builds hold no implementation of a still-patented codec: a licensing check, so
      # it runs here, unfiltered, and even when a deny step failed; cargo
      # installs rust-toolchain.toml's toolchain itself if the step above
      # did not run (docs/design/ci-checks.md, "Default builds and patents").
      - name: Default builds link no still-patented codec
        if: ${{ !cancelled() && steps.result.outputs.reuse != 'true' }}
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 -I scripts/patent_free_check.py
      - name: Every commit has a Signed-off-by line with its author's email
        # Runs even when a deny step failed, so both results show at once.
        # Commits already on main are skipped (docs/design/ci-checks.md,
        # "DCO sign-off"). Not in a merge group: the queue adds no commit of
        # its own author, only the squash of a pull request whose commits
        # this step passed (docs/design/ci-checks.md, "The merge queue").
        if: always() && github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 -I scripts/dco_check.py --base "$BASE" --head "$HEAD"

  deny:
    # The required check. A timeout cancels the job that does the work, and
    # a cancelled required check has no replacement run, so this job always
    # runs and fails unless `deny-checks` succeeded
    # (docs/design/ci-checks.md, "A job timeout is not a cancellation"). It
    # reports and does nothing else; whether a step here really does no work
    # is review judgment, since a shell script cannot be read for that.
    needs: [deny-checks]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Fail unless the job above succeeded
        # `success` and nothing else: nothing here is filtered, so no job of
        # this workflow has anything to skip, and a required check that a
        # skipped job passes is not a check at all
        # (docs/design/ci-checks.md, "A job timeout is not a cancellation").
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          { echo '| job | result |'
            echo '|---|---|'
            jq -r 'to_entries[] | "| \(.key) | \(.value.result) |"' <<< "$RESULTS"
          } >> "$GITHUB_STEP_SUMMARY"
          bad=$(jq -r '[to_entries[]
            | select(.value.result != "success")
            | .key] | join(", ")' <<< "$RESULTS")
          if [ -n "$bad" ]; then
            echo "::error::did not succeed: $bad"
            exit 1
          fi
