name: encoder-backends

# workflow-check: not required

on:
  push:
    branches: [main]
    paths:
      - crates/coreav-backend-apple/**
      - crates/coreav-backend-svt-av1/**
      - .github/workflows/encoder-backends.yml
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - crates/coreav-backend-apple/**
      - crates/coreav-backend-svt-av1/**
      - .github/workflows/encoder-backends.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  encoder-backend:
    strategy:
      fail-fast: false
      matrix:
        include:
          - backend: apple
            os: macos-15
          - backend: svt-av1
            os: ubuntu-24.04
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
          components: clippy
      - name: Test and lint the standalone backend
        env:
          MANIFEST: crates/coreav-backend-${{ matrix.backend }}/Cargo.toml
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -d "${MANIFEST%/*}" ]]; then
            echo "${MANIFEST%/*} has not landed yet; no standalone backend to check"
            exit 0
          fi
          if [[ ! -f "$MANIFEST" ]]; then
            echo "missing $MANIFEST in an existing backend crate" >&2
            exit 1
          fi
          cargo test --locked --manifest-path "$MANIFEST"
          cargo clippy --locked --manifest-path "$MANIFEST" --all-targets -- -D warnings
