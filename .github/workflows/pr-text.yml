name: pr-text

# A pull request's title and body hold nothing that is kept out of public
# pull requests: Korean text, session identifiers, spend details, and the
# private patterns of the secret PR_TEXT_TERMS (scripts/pr_text_check.py;
# docs/design/ci-checks.md). It runs again when the title or body is edited, so the check
# of the head commit always reflects the current text. In a private
# repository the job is skipped, which reports success: the repository this
# one was exported from keeps such records in its own pull requests. So is
# a pull request of Dependabot, whose text is generated.

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pr-text:
    if: ${{ !github.event.repository.private && github.event.pull_request.user.login != 'dependabot[bot]' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          sparse-checkout: scripts/pr_text_check.py
          sparse-checkout-cone-mode: false
      - name: Check the title and body
        env:
          PR_TEXT_TERMS: ${{ secrets.PR_TEXT_TERMS }}
          PR_TEXT_REQUIRE_TERMS: '1'
        run: python3 -I scripts/pr_text_check.py
