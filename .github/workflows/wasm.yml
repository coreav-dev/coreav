name: wasm

# workflow-check: not required

on:
  push:
    branches: [main]
    paths:
      - packages/wasm/**
      - packages/wasm-h264/**
      - crates/**
      - tools/edge-native/**
      - tools/counting-alloc/**
      - tools/*/Cargo.toml
      - NOTICE
      - docs/design/wasm-memory-bars.md
      - docs/design/wasm-thumbnail-memory-bars.md
      - .github/scripts/wasm-memory-failure.cjs
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - scripts/gen-fixtures.sh
      - scripts/wasm-thumbnail-fixtures.py
      - scripts/install-x264.sh
      - scripts/chap_craft.py
      - scripts/colr_craft.py
      - scripts/elst_craft.py
      - scripts/iso_patch.py
      - scripts/stss_craft.py
      - docs/schema/policy-examples/**
      - scripts/install-oracle-ffmpeg.sh
      - scripts/oracle-ffmpeg.env
      - scripts/test_oracle.py
      - scripts/oracle_pin.py
      - scripts/oracle_pin_macos.py
      - scripts/oracle_audio.py
      - scripts/oracle-ffmpeg-macos.env
      - scripts/oracle-audio-args.txt
      - scripts/binaryen.env
      - scripts/install-binaryen.sh
      - scripts/rust-dist.env
      - scripts/notices/**
      - deny.toml
      - .gitattributes
      - .github/workflows/wasm.yml
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - packages/wasm/**
      - packages/wasm-h264/**
      - crates/**
      - tools/edge-native/**
      - tools/counting-alloc/**
      - tools/*/Cargo.toml
      - NOTICE
      - docs/design/wasm-memory-bars.md
      - docs/design/wasm-thumbnail-memory-bars.md
      - .github/scripts/wasm-memory-failure.cjs
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - scripts/gen-fixtures.sh
      - scripts/wasm-thumbnail-fixtures.py
      - scripts/install-x264.sh
      - scripts/chap_craft.py
      - scripts/colr_craft.py
      - scripts/elst_craft.py
      - scripts/iso_patch.py
      - scripts/stss_craft.py
      - docs/schema/policy-examples/**
      - scripts/install-oracle-ffmpeg.sh
      - scripts/oracle-ffmpeg.env
      - scripts/test_oracle.py
      - scripts/oracle_pin.py
      - scripts/oracle_pin_macos.py
      - scripts/oracle_audio.py
      - scripts/oracle-ffmpeg-macos.env
      - scripts/oracle-audio-args.txt
      - scripts/binaryen.env
      - scripts/install-binaryen.sh
      - scripts/rust-dist.env
      - scripts/notices/**
      - deny.toml
      - .gitattributes
      - .github/workflows/wasm.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  wasm-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24.22.1'
      - run: npm ci --ignore-scripts --no-audit --no-fund --prefix packages/wasm
      - run: npm test --prefix packages/wasm && npm run test:types --prefix packages/wasm
      - run: npm test --prefix packages/wasm-h264 && npm run test:types --prefix packages/wasm-h264
      - run: python3 -m unittest discover -s scripts/tests -p test_wasm_thumbnail_fixtures.py
      - run: npm ci --ignore-scripts --no-audit --no-fund --prefix packages/wasm/examples
      - run: npm test --prefix packages/wasm/examples

  wasm-module:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      gate-outcomes: >-
        {"installed":"${{ steps.installed.outcome }}","examples":"${{ steps.examples.outcome }}","installed_h264":"${{ steps.installed_h264.outcome }}","thumbnails":"${{ steps.thumbnails.outcome }}"}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24.22.1'
      - name: Read the WASM compiler pin
        id: rust
        run: |
          . scripts/rust-dist.env
          echo "version=$RUST_DIST_TOOLCHAIN" >> "$GITHUB_OUTPUT"
          echo "RUSTUP_TOOLCHAIN=$RUST_DIST_TOOLCHAIN" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249
        with:
          toolchain: ${{ steps.rust.outputs.version }}
          targets: wasm32-unknown-unknown
          components: rust-src
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          shared-key: wasm-jspi
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Read the bindings CLI pin
        id: bindings
        run: |
          pin=$(sed -n 's/^wasm-bindgen = "=\(.*\)"$/\1/p' crates/coreav-wasm/Cargo.toml)
          test -n "$pin"
          echo "version=$pin" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684
        id: bindings-cache
        with:
          path: ~/.cargo/bin/wasm-bindgen
          key: linux-x64-wasm-bindgen-${{ steps.bindings.outputs.version }}
      - name: Install the bindings CLI
        if: steps.bindings-cache.outputs.cache-hit != 'true'
        env:
          BINDGEN_VERSION: ${{ steps.bindings.outputs.version }}
        run: cargo install wasm-bindgen-cli --version "$BINDGEN_VERSION" --locked
      - name: Key the shared fixture cache
        id: fixtures-key
        run: |
          set -euo pipefail
          helpers=$(grep -o '\$SCRIPTS/[A-Za-z0-9_.-]*' scripts/gen-fixtures.sh | sed 's|^\$SCRIPTS/|scripts/|' | sort -u)
          support=$(python3 -I -B -c 'import sys; sys.path.insert(0, "scripts"); from test_oracle import SUPPORT; print(" ".join("scripts/" + name for name in SUPPORT))')
          identity="$(cat scripts/gen-fixtures.sh scripts/install-oracle-ffmpeg.sh scripts/oracle-ffmpeg.env $helpers $support | sha256sum | cut -c1-32)"
          echo "key=linux-x64-fixtures-$identity" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684
        id: fixtures
        with:
          path: ${{ runner.temp }}/coreav-fixtures
          key: ${{ steps.fixtures-key.outputs.key }}
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684
        id: oracle-cache
        with:
          path: ${{ runner.temp }}/coreav-oracle-bin
          key: linux-x64-oracle-${{ hashFiles('scripts/oracle-ffmpeg.env', 'scripts/install-oracle-ffmpeg.sh') }}
      - name: Install the pinned fixture generator
        if: steps.oracle-cache.outputs.cache-hit != 'true'
        run: scripts/install-oracle-ffmpeg.sh "$RUNNER_TEMP/coreav-oracle-bin"
      - name: Generate required fixtures
        if: steps.fixtures.outputs.cache-hit != 'true'
        env:
          COREAV_REQUIRE_ALL_FIXTURES: '1'
        run: |
          python3 -I scripts/oracle_pin.py --verify-bin "$RUNNER_TEMP/coreav-oracle-bin"
          export PATH="$RUNNER_TEMP/coreav-oracle-bin:$PATH"
          scripts/gen-fixtures.sh "$RUNNER_TEMP/coreav-fixtures"
      - name: Install package verification tools
        run: |
          npm ci --ignore-scripts --no-audit --no-fund --prefix packages/wasm
          npm ci --ignore-scripts --no-audit --no-fund --prefix packages/wasm/examples
      - name: Install the pinned optimizer
        run: |
          set -euo pipefail
          opt="$(scripts/install-binaryen.sh "$RUNNER_TEMP/binaryen")"
          echo "WASM_OPT=$opt" >> "$GITHUB_ENV"
      - name: Build the module
        run: npm run build --prefix packages/wasm
      - name: Test the real module
        run: COREAV_FIXTURES="$RUNNER_TEMP/coreav-fixtures" npm run test:module --prefix packages/wasm
      - name: Verify the installed package
        id: installed
        run: |
          set -euo pipefail
          (cd packages/wasm && npm pack --json --pack-destination "$RUNNER_TEMP") > "$RUNNER_TEMP/wasm-pack.json"
          tarball="$RUNNER_TEMP/$(node -p 'JSON.parse(require("node:fs").readFileSync(process.argv[1]))[0].filename' "$RUNNER_TEMP/wasm-pack.json")"
          npm run check:package --prefix packages/wasm -- --tarball "$tarball"
          cargo build --locked -p coreav-edge-native --profile edge
          echo "WASM_PACKAGE=$tarball" >> "$GITHUB_ENV"
      - name: Retain the verified package for installation rehearsals
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: wasm-package
          path: ${{ env.WASM_PACKAGE }}
          if-no-files-found: error
          retention-days: 7
      - name: Judge the registered memory gates
        id: examples
        timeout-minutes: 5
        run: |
          tarball="$WASM_PACKAGE"
          npm run check --prefix packages/wasm/examples -- --edge-native "$PWD/target/edge/edge-native" --tarball "$tarball"
      - name: Verify the installed H.264 package
        id: installed_h264
        run: |
          set -euo pipefail
          private="$RUNNER_TEMP/thumbnail-preflight"
          mkdir -p "$private"
          npm run build --prefix packages/wasm-h264
          (cd packages/wasm-h264 && npm pack --json --pack-destination "$RUNNER_TEMP") > "$private/pack.json"
          tarball="$RUNNER_TEMP/$(node -p 'JSON.parse(require("node:fs").readFileSync(process.argv[1]))[0].filename' "$private/pack.json")"
          env -u GITHUB_STEP_SUMMARY node packages/wasm-h264/scripts/check-package.mjs --tarball "$tarball" > "$private/package-record.json"
          echo "WASM_H264_PACKAGE=$tarball" >> "$GITHUB_ENV"
      - name: Install the pinned thumbnail fixture encoder
        timeout-minutes: 5
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq nasm
          scripts/install-x264.sh "$RUNNER_TEMP/thumbnail-x264"
      - name: Preflight the installed thumbnail profile
        id: thumbnails
        timeout-minutes: 15
        run: |
          set -euo pipefail
          private="$RUNNER_TEMP/thumbnail-preflight"
          cargo tree --locked --color never -p coreav-edge-native --no-default-features --features native-h264 -e features -i jpeg-encoder > "$private/native-jpeg-features.txt"
          grep -F 'jpeg-encoder feature "std"' "$private/native-jpeg-features.txt" > /dev/null
          if grep -F 'jpeg-encoder feature "simd"' "$private/native-jpeg-features.txt" > /dev/null; then
            echo 'the native portable-encoder reference must not enable JPEG SIMD'
            exit 1
          fi
          cargo tree --locked --color never -p coreav-cli --no-default-features --features native-h264 -e features -i jpeg-encoder > "$private/production-jpeg-features.txt"
          if ! grep -F 'jpeg-encoder feature "simd"' "$private/production-jpeg-features.txt" > /dev/null; then
            echo 'ordinary native thumbnails must enable JPEG SIMD'
            exit 1
          fi
          cargo test --locked -p coreav-thumbnail --no-default-features --lib jpeg::tests::portable_output_does_not_depend_on_cpu_dispatch -- --exact > "$private/portable-jpeg.log" 2>&1
          if ! grep -F 'test result: ok. 1 passed; 0 failed; 0 ignored;' "$private/portable-jpeg.log" > /dev/null; then
            echo 'the portable JPEG golden must run exactly once; check its exact test name'
            exit 1
          fi
          cargo build --locked -p coreav-edge-native --no-default-features --features native-h264 --profile edge --target-dir target/edge-h264
          cargo test --locked -p coreav-wasm --features native-h264 --test thumbnail_contract --no-run --message-format=json > "$private/test-build.json"
          test_binary=$(python3 -c 'import json,sys; rows=[json.loads(line) for line in open(sys.argv[1])]; matches=[r["executable"] for r in rows if r.get("reason")=="compiler-artifact" and r.get("target",{}).get("name")=="thumbnail_contract" and r.get("executable")]; assert len(matches)==1; print(matches[0])' "$private/test-build.json")
          if ! "$test_binary" > "$private/native-contract.log" 2>&1; then
            echo 'thumbnail native contract failed'
            grep '^test .*FAILED' "$private/native-contract.log" || true
            grep '^thumbnail-contract step=' "$private/native-contract.log" | tail -1 || true
            exit 1
          fi
          COREAV_THUMBNAIL_HOSTILE_DIR="$private/hostile" "$test_binary" --ignored --exact export_synthetic_contract_fixtures > "$private/hostile-export.log" 2>&1
          python3 scripts/wasm-thumbnail-fixtures.py --oracle-bin "$RUNNER_TEMP/coreav-oracle-bin" --x264 "$RUNNER_TEMP/thumbnail-x264/x264" --hostile-manifest "$private/hostile/hostile.json" --output "$private/fixtures"
          COREAV_THUMBNAIL_MANIFEST="$private/fixtures/manifest.json" COREAV_THUMBNAIL_ALLOCATION_REPORT="$private/allocations.json" "$test_binary" --ignored --exact generated_4k_refusals_allocate_no_decoded_frame > "$private/allocations.log" 2>&1
          node packages/wasm-h264/test/installed/check.mjs --fixtures "$private/fixtures" --tarball "$WASM_H264_PACKAGE" --package-record "$private/package-record.json" --edge-native "$PWD/target/edge-h264/edge/edge-native" --allocation-report "$private/allocations.json" --allocation-binary "$test_binary" --host-cases packages/wasm-h264/test/installed-host-cases.mjs --oracle-bin "$RUNNER_TEMP/coreav-oracle-bin" --output "$private/capture"

  wasm-failure:
    needs: wasm-module
    if: always() && needs.wasm-module.result == 'failure' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Record a release-blocking failure
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        env:
          GATE_OUTCOMES: ${{ needs.wasm-module.outputs.gate-outcomes }}
        with:
          script: |
            const report = require('./.github/scripts/wasm-memory-failure.cjs');
            const outcomes = JSON.parse(process.env.GATE_OUTCOMES);
            await report({ github, context, outcomes });
