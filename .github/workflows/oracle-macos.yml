name: oracle-macos

# workflow-check: not required

on:
  push:
    branches: [main]
    paths:
      - scripts/oracle-ffmpeg.env
      - scripts/oracle_pin.py
      - scripts/oracle-ffmpeg-macos.env
      - scripts/oracle_pin_macos.py
      - scripts/install-oracle-ffmpeg-macos.sh
      - scripts/tests/test_oracle_pin_macos.py
      - scripts/tests/test_oracle_install_macos.py
      - .github/workflows/oracle-macos.yml
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - scripts/oracle-ffmpeg.env
      - scripts/oracle_pin.py
      - scripts/oracle-ffmpeg-macos.env
      - scripts/oracle_pin_macos.py
      - scripts/install-oracle-ffmpeg-macos.sh
      - scripts/tests/test_oracle_pin_macos.py
      - scripts/tests/test_oracle_install_macos.py
      - .github/workflows/oracle-macos.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  install:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Check independent pin ownership
        run: |
          python3 -I scripts/oracle_pin.py --check
          python3 -I scripts/oracle_pin_macos.py --check
      - name: Test macOS installation refusals
        run: |
          python3 -I -m unittest discover -s scripts/tests -p 'test_oracle_pin_macos.py'
          python3 -I -m unittest discover -s scripts/tests -p 'test_oracle_install_macos.py'
      - name: Install and verify the signed macOS oracle
        run: |
          scripts/install-oracle-ffmpeg-macos.sh "$RUNNER_TEMP/oracle-macos"
          python3 -I scripts/oracle_pin_macos.py --verify-bin "$RUNNER_TEMP/oracle-macos"
