name: hevc-conformance

# workflow-check: not required

on:
  push:
    branches: [main]
    paths: ["crates/coreav-hevc/**", "crates/coreav-kernels-hevc/**", "crates/coreav-backend-hevc/**", "crates/coreav-thumbnail/**", "crates/coreav-decode/**", "crates/coreav-frame/**", "crates/coreav-isobmff/**", "crates/coreav-cli/**", "bench/hevc-conformance/**", "scripts/hevc_conformance.py", "scripts/hevc_intra.py", "scripts/hevc_decode.py", "scripts/hevc_boundary.py", "scripts/hevc_fixture.py", "scripts/hevc_synthetic.py", "scripts/hevc_smoke.py", "scripts/test_oracle.py", "scripts/hevc_oracle_input.py", "scripts/tests/test_hevc*.py", "docs/measurements/hevc-native/roster.json", "docs/measurements/transcode/round-2/corpus-selection.json", "docs/spikes/thumbnail-bench/evidence/speed-dev-2.jsonl", "docs/spikes/thumbnail-bench/evidence/speed-2-hevc.jsonl", "docs/measurements/transcode/speed-selection.json", "tools/compat-corpus/**", "tools/stage3-report/**", "scripts/oracle-ffmpeg.env", "scripts/install-ci-oracle-ffmpeg.sh", ".github/actions/oracle-cache/action.yml", "scripts/oracle_pin.py", "scripts/oracle_from_r2.py", "scripts/oracle_audio.py", "scripts/oracle-audio-args.txt", "Cargo.toml", "Cargo.lock", ".github/workflows/hevc-conformance.yml"]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths: ["crates/coreav-hevc/**", "crates/coreav-kernels-hevc/**", "crates/coreav-backend-hevc/**", "crates/coreav-thumbnail/**", "crates/coreav-decode/**", "crates/coreav-frame/**", "crates/coreav-isobmff/**", "crates/coreav-cli/**", "bench/hevc-conformance/**", "scripts/hevc_conformance.py", "scripts/hevc_intra.py", "scripts/hevc_decode.py", "scripts/hevc_boundary.py", "scripts/hevc_fixture.py", "scripts/hevc_synthetic.py", "scripts/hevc_smoke.py", "scripts/test_oracle.py", "scripts/hevc_oracle_input.py", "scripts/tests/test_hevc*.py", "docs/measurements/hevc-native/roster.json", "docs/measurements/transcode/round-2/corpus-selection.json", "docs/spikes/thumbnail-bench/evidence/speed-dev-2.jsonl", "docs/spikes/thumbnail-bench/evidence/speed-2-hevc.jsonl", "docs/measurements/transcode/speed-selection.json", "tools/compat-corpus/**", "tools/stage3-report/**", "scripts/oracle-ffmpeg.env", "scripts/install-ci-oracle-ffmpeg.sh", ".github/actions/oracle-cache/action.yml", "scripts/oracle_pin.py", "scripts/oracle_from_r2.py", "scripts/oracle_audio.py", "scripts/oracle-audio-args.txt", "Cargo.toml", "Cargo.lock", ".github/workflows/hevc-conformance.yml"]
  schedule:
    - cron: "45 3 * * *"
    - cron: "45 4 * * 0"
  workflow_dispatch:
    inputs:
      scalar:
        description: Force scalar kernels for the complete correctness run
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  full-coverage:
    name: hevc-conformance-coverage
    if: github.event_name == 'schedule' && github.event.schedule == '45 3 * * *'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      reuse: ${{ steps.result.outputs.reuse == 'true' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        continue-on-error: true
        with:
          persist-credentials: false
      - id: result
        uses: ./.github/actions/merge-group-result
        continue-on-error: true
        with:
          workflow: hevc-conformance.yml
      - name: Covered by run ${{ steps.result.outputs.run }} attempt ${{ steps.result.outputs.attempt }}
        if: steps.result.outputs.reuse == 'true'
        run: 'true'

  headers:
    needs: full-coverage
    if: >-
      !cancelled() && needs.full-coverage.outputs.reuse != 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249
        with:
          toolchain: stable
      - run: cargo test --locked -p coreav-hevc -p coreav-kernels-hevc -p coreav-backend-hevc --no-default-features
      - run: cargo test --locked -p coreav-hevc -p coreav-kernels-hevc -p coreav-backend-hevc -p coreav-thumbnail --features native-hevc --all-targets
      - run: cargo test --locked -p coreav-hevc -p coreav-kernels-hevc --features native-hevc,scalar --all-targets
      - run: cargo clippy --locked -p coreav-hevc -p coreav-kernels-hevc -p coreav-backend-hevc -p coreav-thumbnail --features native-hevc --all-targets -- -D warnings
      - name: Check the opt-in CLI registration with and without default features
        run: |
          cargo test --locked -p coreav-cli --features native-hevc,native-h264 --lib
          cargo clippy --locked -p coreav-cli --features native-hevc,native-h264 --all-targets -- -D warnings
          cargo clippy --locked -p coreav-cli --no-default-features --features cli,native-hevc --all-targets -- -D warnings
      - name: Keep HEVC out of feature-disabled and default consumers
        run: |
          set -euo pipefail
          cargo tree --locked -p coreav-hevc --no-default-features -e normal,build > "$RUNNER_TEMP/hevc-off.txt"
          test "$(wc -l < "$RUNNER_TEMP/hevc-off.txt")" -eq 1
          cargo tree --locked -p coreav-backend-hevc --no-default-features -e normal,build > "$RUNNER_TEMP/backend-off.txt"
          if grep -E 'coreav-(kernels-)?hevc' "$RUNNER_TEMP/backend-off.txt"; then exit 1; fi
          cargo tree --locked -p coreav-cli -e normal,build > "$RUNNER_TEMP/default-consumer.txt"
          if grep -E 'coreav-(kernels-|backend-)?hevc' "$RUNNER_TEMP/default-consumer.txt"; then exit 1; fi
      - name: Check Linux acquisition and subprocess isolation
        if: runner.os == 'Linux'
        run: python3 -m unittest discover -s scripts/tests -p 'test_hevc*.py'

  hevc-smoke:
    needs: full-coverage
    if: >-
      !cancelled() && needs.full-coverage.outputs.reuse != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249
        with:
          toolchain: stable
      - run: cargo build --locked --release -p coreav-hevc --features native-hevc --example headers --example intra
      - uses: ./.github/actions/oracle-cache
      - name: Install the pinned binary oracle
        run: scripts/install-ci-oracle-ffmpeg.sh "$RUNNER_TEMP/oracle"
      - name: Verify registered synthetic references before smoke comparison
        run: |
          python3 -I scripts/hevc_fixture.py verify \
            --ffmpeg "$RUNNER_TEMP/oracle/ffmpeg" --ffprobe "$RUNNER_TEMP/oracle/ffprobe" \
            --output "$RUNNER_TEMP/hevc-synthetic"
      - name: Compare all eight synthetic pictures
        run: |
          python3 -I scripts/hevc_smoke.py --data "$RUNNER_TEMP/hevc-synthetic" \
            --out "$RUNNER_TEMP/hevc-smoke" --parser "$PWD/target/release/examples/headers" \
            --native "$PWD/target/release/examples/intra" --oracle-bin "$RUNNER_TEMP/oracle"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: hevc-smoke
          path: |
            ${{ runner.temp }}/hevc-smoke/result.json
            ${{ runner.temp }}/hevc-synthetic/reference.json
          if-no-files-found: error
          retention-days: 30

  hevc-vectors:
    needs: full-coverage
    if: >-
      !cancelled() && needs.full-coverage.outputs.reuse != 'true' &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249
        with:
          toolchain: stable
      - run: cargo build --locked --release -p coreav-hevc --features native-hevc${{ inputs.scalar && ',scalar' || '' }} --example headers --example intra --example decode
      - run: cargo build --locked --release -p coreav-backend-hevc --features native-hevc${{ inputs.scalar && ',coreav-hevc/scalar' || '' }} --example boundary
      - uses: ./.github/actions/oracle-cache
      - name: Install the pinned binary oracle
        run: scripts/install-ci-oracle-ffmpeg.sh "$RUNNER_TEMP/oracle"
      - name: Verify registered synthetic references before native classification
        run: |
          python3 -I scripts/hevc_fixture.py verify \
            --ffmpeg "$RUNNER_TEMP/oracle/ffmpeg" --ffprobe "$RUNNER_TEMP/oracle/ffprobe" \
            --output "$RUNNER_TEMP/hevc-synthetic"
      - name: Acquire every registered official archive
        run: python3 -I scripts/hevc_conformance.py acquire --dest "$RUNNER_TEMP/hevc-data"
      - name: Bind archive and extracted-data hashes
        run: python3 -I scripts/hevc_conformance.py manifest --data "$RUNNER_TEMP/hevc-data" --out "$RUNNER_TEMP/archives.pinned.json"
      - name: Check complete headers and every selected intra reference
        run: |
          python3 -I scripts/hevc_intra.py \
            --registration "$RUNNER_TEMP/archives.pinned.json" \
            --data "$RUNNER_TEMP/hevc-data" --out "$RUNNER_TEMP/hevc-intra" \
            --parser "$PWD/target/release/examples/headers" --oracle-bin "$RUNNER_TEMP/oracle" \
            --native "$PWD/target/release/examples/intra" --synthetic-data "$RUNNER_TEMP/hevc-synthetic" \
            --max-memory-bytes 268435456 --max-bins 268435456 --filters
      - name: Check complete scalar conformance output
        run: |
          python3 -I scripts/hevc_decode.py \
            --registration "$RUNNER_TEMP/archives.pinned.json" \
            --census "$RUNNER_TEMP/hevc-intra/g1/census.json" \
            --data "$RUNNER_TEMP/hevc-data" --out "$RUNNER_TEMP/hevc-decode" \
            --parser "$PWD/target/release/examples/headers" --native "$PWD/target/release/examples/decode" \
            --oracle-bin "$RUNNER_TEMP/oracle" --max-memory-bytes 1073741824 \
            --max-stream-bins 1099511627776 --max-picture-bins 268435456
      - name: Check complete conformance output and random access through the decode boundary
        run: |
          python3 -I scripts/hevc_boundary.py \
            --registration "$RUNNER_TEMP/archives.pinned.json" \
            --census "$RUNNER_TEMP/hevc-intra/g1/census.json" \
            --data "$RUNNER_TEMP/hevc-data" --out "$RUNNER_TEMP/hevc-boundary" \
            --parser "$PWD/target/release/examples/headers" --native "$PWD/target/release/examples/boundary" \
            --scalar-result "$RUNNER_TEMP/hevc-decode/result.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: hevc-intra
          path: |
            ${{ runner.temp }}/archives.pinned.json
            ${{ runner.temp }}/hevc-data/acquisition.json
            ${{ runner.temp }}/hevc-data/*/inventory.json
            ${{ runner.temp }}/hevc-intra
            ${{ runner.temp }}/hevc-decode
            ${{ runner.temp }}/hevc-boundary
            ${{ runner.temp }}/hevc-synthetic/reference.json
          if-no-files-found: error
          retention-days: 30

  profile-census:
    needs: full-coverage
    if: >-
      !cancelled() && needs.full-coverage.outputs.reuse != 'true' &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249
        with:
          toolchain: stable
      - run: cargo build --locked --release -p coreav-hevc --features native-hevc${{ inputs.scalar && ',scalar' || '' }} --example headers --example intra --example packets
      - run: cargo build --locked --release -p coreav-backend-hevc --features native-hevc${{ inputs.scalar && ',coreav-hevc/scalar' || '' }} --example boundary
      - uses: ./.github/actions/oracle-cache
      - name: Install the pinned binary oracle
        run: scripts/install-ci-oracle-ffmpeg.sh "$RUNNER_TEMP/oracle"
      - name: Inspect all fixed files with isolated metadata subprocesses
        env:
          R2_ENDPOINT: ${{ secrets.COREAV_CORPUS_R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.COREAV_CORPUS_R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.COREAV_CORPUS_R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ vars.COREAV_CORPUS_R2_BUCKET }}
        run: |
          set -euo pipefail
          umask 077
          python3 -I scripts/hevc_conformance.py corpus-online --dest "$RUNNER_TEMP/media" \
            --out "$RUNNER_TEMP/private" --oracle-bin "$RUNNER_TEMP/oracle" \
            --parser "$PWD/target/release/examples/headers" --native "$PWD/target/release/examples/intra" \
            --packet-native "$PWD/target/release/examples/packets" --decode-memory-bytes 1073741824 \
            --boundary-native "$PWD/target/release/examples/boundary" \
            --stream-bins 1099511627776 --picture-bins 268435456 \
            --shard-count 4 --shard-index "${{ matrix.shard }}"
      - name: Retain only aggregate profile counts publicly
        if: always()
        run: |
          python3 -I - "$RUNNER_TEMP" <<'PY'
          import json, pathlib, sys
          root = pathlib.Path(sys.argv[1])
          source = root / 'private/corpus-census.json'
          if source.exists():
              data = json.loads(source.read_text())
              summary = {key: data[key] for key in ('roster_sha256', 'complete', 'passed', 'counts')}
              summary['scope'] = data['scope']
              summary['files'] = len(data['files'])
              if 'development_intra' in data:
                  summary['development_intra'] = data['development_intra']
              if 'packet_decode' in data:
                  summary['packet_decode'] = data['packet_decode']
              (root / 'profile-summary.json').write_text(json.dumps(summary, indent=2) + '\n')
          PY
      - name: Seal private census records
        if: always()
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          [ -d private ] || exit 0
          tar -czf records.tgz private
          mkdir -p sealed
          openssl rand -hex -out key.txt 32
          openssl enc -aes-256-cbc -pbkdf2 -salt -pass file:key.txt -in records.tgz -out sealed/records.tgz.enc
          openssl pkeyutl -encrypt -pubin -inkey "$GITHUB_WORKSPACE/bench/hevc-conformance/evidence-public.pem" \
            -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 -in key.txt -out sealed/key.txt.enc
          shred -u key.txt records.tgz
          rm -rf private
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: hevc-profile-census-sealed-${{ matrix.shard }}
          path: ${{ runner.temp }}/sealed
          if-no-files-found: ignore
          retention-days: 30
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: hevc-profile-summary-${{ matrix.shard }}
          path: ${{ runner.temp }}/profile-summary.json
          if-no-files-found: ignore
          retention-days: 30

  kernel-differential:
    if: github.event_name == 'workflow_dispatch' && !inputs.scalar
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249
        with:
          toolchain: stable
      - name: Require AVX2 on the vector execution host
        if: runner.os == 'Linux'
        run: grep -qw avx2 /proc/cpuinfo
      - name: Prepare bounded kernel differential targets
        run: |
          scripts/fuzz_run.sh setup
          printf '%s\n' 'crates/coreav-kernels-hevc/fuzz horizontal' 'crates/coreav-kernels-hevc/fuzz vertical' 'crates/coreav-kernels-hevc/fuzz sao' 'crates/coreav-kernels-hevc/fuzz intra' 'crates/coreav-kernels-hevc/fuzz deblock' 'crates/coreav-kernels-hevc/fuzz combine' > "$RUNNER_TEMP/interpolation-plan.txt"
          scripts/fuzz_run.sh build "$RUNNER_TEMP/interpolation-plan.txt"
      - id: differential
        name: Compare automatic and scalar kernels for ten minutes per target
        env:
          ASAN_OPTIONS: quarantine_size_mb=64
        run: scripts/fuzz_run.sh run "$RUNNER_TEMP/interpolation-plan.txt" 600 "$RUNNER_TEMP/fuzz"
      - name: Keep differential findings private
        if: failure() && steps.differential.outcome == 'failure'
        env:
          R2_ENDPOINT: ${{ secrets.COREAV_CORPUS_R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.COREAV_CORPUS_R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.COREAV_CORPUS_R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ vars.COREAV_CORPUS_R2_BUCKET }}
          HOST: ${{ matrix.os }}
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet 'boto3==1.35.36'
          "$RUNNER_TEMP/venv/bin/python" -I scripts/fuzz_upload.py "$RUNNER_TEMP/fuzz/findings" \
            "hevc-differential/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT/$HOST"
