      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # isobmff-fixtures' cache, restored only: that job builds every
          # crate and feature this one does, and one entry instead of three
          # keeps the repository's caches under GitHub's limit
          # (docs/design/ci-checks.md, "Caches").
          shared-key: isobmff-fixtures
          save-if: false
      - name: Cache pinned black-box binaries
        id: bin-cache
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ runner.temp }}/coreav-oracle-bin
          key: linux-x64-oracle-mediainfo-26.10-${{ hashFiles('scripts/oracle-ffmpeg.env', 'scripts/install-oracle-ffmpeg.sh', 'scripts/install-oracle-mediainfo.sh') }}
      - name: Install pinned FFmpeg and ffprobe
        if: steps.bin-cache.outputs.cache-hit != 'true'
        run: |
          scripts/install-oracle-ffmpeg.sh "$RUNNER_TEMP/coreav-oracle-bin"
          scripts/install-oracle-mediainfo.sh "$RUNNER_TEMP/coreav-oracle-bin"
      - name: Use pinned binaries
        run: |
          python3 -I scripts/oracle_pin.py --verify-bin "$RUNNER_TEMP/coreav-oracle-bin"
          echo "$RUNNER_TEMP/coreav-oracle-bin" >> "$GITHUB_PATH"
      # Generated on every run; required fixtures cannot be skipped.
      - name: Generate the transport stream fixtures
        env:
          COREAV_REQUIRE_ALL_FIXTURES: '1'
          PYTHONDONTWRITEBYTECODE: '1'
        run: scripts/gen-fixtures-ts.sh "$RUNNER_TEMP/ts-fixtures"
      - name: Test the known-divergence predicates
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 -m unittest tools/oracle/tests/test_kd_ts.py
      - name: Build the comparator, the adapters and the coreav binary
        run: |
          cargo build --locked --release -p coreav-oracle -p coreav-ts-adapter \
            -p coreav-isobmff-adapter -p coreav-mkv-adapter -p coreav-cli
      - name: Compare coreav-mpegts with ffprobe
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/ts-oracle"
          scripts/oracle-capture.sh --media "$RUNNER_TEMP/ts-fixtures" --out "$OUT/reference" --levels streams,packets
          scripts/oracle-capture.sh --media "$RUNNER_TEMP/ts-fixtures" --out "$OUT/candidate" \
            --adapter target/release/ts-adapter --levels streams,packets
          status=0
          target/release/coreav-oracle compare --reference "$OUT/reference" --candidate "$OUT/candidate" \
            --levels streams,packets --profile fixtures --max-diffs 1000000 --report "$OUT/report.json" \
            > "$OUT/compare.log" || status=$?
          # 1 means "not 100% before known divergences"; anything else is a harness error.
          [ "$status" -le 1 ]
          python3 -I scripts/oracle_kd_ts.py --report "$OUT/report.json" --reference "$OUT/reference" \
            --candidate "$OUT/candidate" --out "$OUT/known-divergences.json" --media "$RUNNER_TEMP/ts-fixtures"
      - name: Compare coreav probe --ffprobe-compat with ffprobe
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 -I scripts/compat_check.py --coreav target/release/coreav \
            --media "$RUNNER_TEMP/ts-fixtures" --in-scope .ts,.m2ts,.mts,.m2t \
            --report "$RUNNER_TEMP/ts-compat.json" \
            --kd-overlay "$RUNNER_TEMP/ts-oracle/known-divergences.json"
      # docs/design/compat-cli.md (B1, B2 and B3a on the fixtures, B6):
      # every ffprobe command of the coverage set through `coreav ffprobe`
      # on every fixture, against the pinned ffprobe, and every refusal; a
      # failure the committed baseline does not list fails the run.
      - name: Run the command-coverage set through coreav ffprobe
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 -I tools/compat-corpus/run.py commands --coreav target/release/coreav \
            --media "$RUNNER_TEMP/ts-fixtures" --baseline tools/compat-corpus/baseline-mpegts.json \
            --report "$RUNNER_TEMP/ts-compat-commands.json"
      - name: List frames through coreav ffprobe
        run: |
          cargo build --locked --release -p coreav-cli --features native-h264 --target-dir target/native
          python3 -I tools/compat-corpus/frames.py --coreav target/native/release/coreav \
            --media "$RUNNER_TEMP/ts-fixtures" --native-h264 \
            --baseline tools/compat-corpus/baseline-frames.json --report "$RUNNER_TEMP/ts-frames.json"
      # R1 of the 0.1.0 round (docs/measurements/compat-0.1.0/README.md): the
      # 0.1.0 ffprobe commands on these fixtures, with no baseline. The round
      # reads its verdict from the job summary; a miss or a void run does not
      # fail the job, so that a change of the oracle's output (FFmpeg 9 prints
      # keys 7.0.2 did not) is reported here rather than blocking unrelated
      # pull requests. A run that measured nothing fails it.
      - name: R1 of the 0.1.0 round
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          cargo build --locked --profile dist -p coreav-cli
          sha256sum target/dist/coreav > "$RUNNER_TEMP/ts-r1.sha256"
          code=0
          python3 -I tools/compat-corpus/run.py commands --set 0.1.0 --coreav target/dist/coreav \
            --media "$RUNNER_TEMP/ts-fixtures" --report "$RUNNER_TEMP/ts-r1.json" > "$RUNNER_TEMP/ts-r1.txt" || code=$?
          case "$code" in 0) verdict=met ;; 1) verdict=missed ;; 2) verdict=void ;; *) verdict="not measured (exit $code)" ;; esac
          [ -s "$RUNNER_TEMP/ts-r1.json" ] || { verdict='not measured (no report)'; code=3; }
          { echo "### R1 of the 0.1.0 round, MPEG-TS fixtures: $verdict"; echo '```'; cat "$RUNNER_TEMP/ts-r1.sha256"; tail -n 15 "$RUNNER_TEMP/ts-r1.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          [ "$code" -le 2 ]
      - name: Check the coreav binary against the library adapter
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/ts-oracle"
          scripts/oracle-capture.sh --media "$RUNNER_TEMP/ts-fixtures" --out "$OUT/cli" \
            --adapter scripts/oracle-coreav-cli.sh --levels streams
          scripts/oracle-capture.sh --media "$RUNNER_TEMP/ts-fixtures" --out "$OUT/library" \
            --adapter scripts/oracle-library-adapter.sh --levels streams
          target/release/coreav-oracle compare --reference "$OUT/library" --candidate "$OUT/cli" \
            --levels streams --profile fixtures --max-diffs 1000000 --report "$OUT/cli-report.json"
      - name: Validate coreav probe output against the schema
        env:
          COREAV_FIXTURES: ${{ runner.temp }}/ts-fixtures
        run: cargo test --locked -p coreav-cli --test cli -- --ignored fixtures_match_the_schema
      # docs/design/mpegts.md: the transport stream part of the hostile
      # suite through the binary, in both output modes and with the packet
      # listing: no crash, hang or unstructured failure.
      - name: Run the transport stream hostile cases through the coreav binary
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 -I tools/hostile/generate.py "$RUNNER_TEMP/ts-hostile" \
            "$RUNNER_TEMP/ts-fixtures" "$(command -v ffmpeg)" --parts mpegts
          python3 -I scripts/cli_hostile_check.py --coreav target/release/coreav \
            --suite "$RUNNER_TEMP/ts-hostile"
      # docs/design/mpegts.md: bug-shaped changes to CoreAV's captures of
      # every fixture; a change a known divergence covers fails the run.
      - name: Audit the known divergences
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          OUT="$RUNNER_TEMP/ts-oracle"
          python3 -I tools/oracle/kd_audit.py --overlay ts --reference "$OUT/reference" \
            --candidate "$OUT/candidate" --media "$RUNNER_TEMP/ts-fixtures" \
            --oracle target/release/coreav-oracle --out "$OUT/kd-audit.jsonl"
      - name: Preserve normalized output and diffs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ts-oracle-output
          path: |
            ${{ runner.temp }}/ts-oracle/known-divergences.json
            ${{ runner.temp }}/ts-oracle/compare.log
            ${{ runner.temp }}/ts-oracle/cli-report.json
            ${{ runner.temp }}/ts-compat.json
            ${{ runner.temp }}/ts-compat-commands.json
            ${{ runner.temp }}/ts-frames.json
            ${{ runner.temp }}/ts-r1.json
            ${{ runner.temp }}/ts-r1.sha256
          if-no-files-found: ignore

  # Bars C1 and C3 of docs/design/h264.md: every in-scope JVT conformance
  # bitstream decodes bit-exactly, and every SIMD kernel gives what the
  # scalar reference gives. The suite is fetched from the ITU-T site, one stream
  # at a time (scripts/h264_conformance.py), because the whole suite extracted
  # does not fit on a runner. The zips of the in-scope streams are about
  # 1.6 GB and are cached between runs.
  #
  # Runs only when the decoder, its kernels or their scripts change
  # (ci-changes' `h264-conformance`).
  conformance:
    # Draft pull requests skip it, as every other heavy job does.
    needs: ci-changes
    if: >-
      needs.ci-changes.outputs.h264-conformance == 'true' &&
      (github.event_name != 'pull_request' || !github.event.pull_request.draft)
    concurrency:
      group: ${{ github.workflow }}-conformance-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Cache the conformance zips
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/.cache/h264-conformance
          key: h264-conformance-${{ hashFiles('crates/coreav-h264/tests/data/conformance-streams.json') }}
      - name: Decode every in-scope stream
        run: |
          python3 -I scripts/h264_conformance.py \
            --zips ~/.cache/h264-conformance \
            --work "$RUNNER_TEMP/h264" \
            --threads 1,2,8 \
            --report "$RUNNER_TEMP/conformance.json"
      # The same suite in safe mode, a build without the
      # feature `fast`, which compiles no `unsafe` and runs the baseline
      # instance of the hot paths. The step above ran the default build,
      # and the x86-64-v3 instance where the runner's CPU has its features.
      - name: Decode every in-scope stream in safe mode
        if: ${{ !cancelled() }}
        run: |
          python3 -I scripts/h264_conformance.py \
            --zips ~/.cache/h264-conformance \
            --work "$RUNNER_TEMP/h264" \
            --threads 1,2,8 \
            --mode safe \
            --report "$RUNNER_TEMP/conformance-safe.json"
      - name: Lint and test safe mode
        if: ${{ !cancelled() }}
        run: |
          cargo clippy -p coreav-h264 --no-default-features --all-targets -- -D warnings
          cargo test -p coreav-h264 --no-default-features --release
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: h264-conformance
          path: |
            ${{ runner.temp }}/conformance.json
            ${{ runner.temp }}/conformance-safe.json
          if-no-files-found: ignore

  vector-width:
    # The AVX-512 tier keeps its vectors 256 bits wide (docs/design/h264.md,
    # "Kernel round: an AVX-512 tier", point 2), and nothing tunes the
    # compiler to: fail when a `zmm` register appears in the decoder as
    # measured (`dist`) or as built in `release`. Runs on drafts too, since
    # that is when a kernel's author times it.
    needs: ci-changes
    if: needs.ci-changes.outputs.h264-conformance == 'true'
    concurrency:
      group: ${{ github.workflow }}-vector-width-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build the decoder
        run: |
          cargo build --locked --profile dist -p coreav-h264 --example decode
          cargo build --locked --release -p coreav-h264 --example decode
      - name: No zmm register
        run: |
          set -euo pipefail
          status=0
          for bin in target/dist/examples/decode target/release/examples/decode; do
            # The functions that use a zmm register, with a count of the
            # instructions in each.
            found=$(objdump -d -C --no-show-raw-insn "$bin" \
              | awk '/^[0-9a-f]+ <.*>:$/ { f = substr($0, index($0, "<")) } /%zmm/ { print f }' \
              | sort | uniq -c)
            if [ -n "$found" ]; then
              echo "::error::$bin uses 512-bit registers (docs/design/h264.md, \"Kernel round: an AVX-512 tier\", point 2):"
              echo "$found"
              status=1
            else
              echo "$bin: no zmm register"
            fi
          done
          exit $status

  modes-identity:
    # The decoder's two modes give the same output, on a
    # synthetic set the pinned FFmpeg encodes here (a black-box tool) and,
    # in the next job, on the training set. The default build runs its
    # x86-64-v3 instance where the runner's CPU has the features, which
    # the step summary reports.
    needs: ci-changes
    if: >-
      needs.ci-changes.outputs.h264-conformance == 'true' &&
      (github.event_name != 'pull_request' || !github.event.pull_request.draft)
    concurrency:
      group: ${{ github.workflow }}-modes-identity-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Cache the pinned FFmpeg
        id: ffmpeg-cache
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ runner.temp }}/coreav-oracle-bin
          key: linux-x64-oracle-${{ hashFiles('scripts/oracle-ffmpeg.env', 'scripts/install-oracle-ffmpeg.sh') }}
      - name: Install the pinned FFmpeg
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        run: scripts/install-oracle-ffmpeg.sh "$RUNNER_TEMP/coreav-oracle-bin"
      - name: Decode the synthetic set in both modes
        run: |
          python3 -I scripts/oracle_pin.py --verify-bin "$RUNNER_TEMP/coreav-oracle-bin"
          python3 -I scripts/h264_modes_identity.py \
            --generate "$RUNNER_TEMP/coreav-oracle-bin/ffmpeg" \
            --streams "$RUNNER_TEMP/synthetic" \
            --threads 1,8 \
            --report "$RUNNER_TEMP/modes-synthetic.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: h264-modes-synthetic
          path: ${{ runner.temp }}/modes-synthetic.json
          if-no-files-found: ignore

  training-identity:
    # The 32 training streams (docs/measurements/h264-training/) decoded in
    # both modes, at 1 and 8 threads. They are corpus v1's, read with read-only credentials that
    # only this repository's own runs receive; where they are not set (a
    # fork's pull request, or before they exist) the job says so in its
    # summary and decodes nothing. Only the two steps that read the
    # credentials see them, not the actions, builds or installs in between.
    # The streams are not redistributed, so they are cached only in a
    # private repository: a public one's cache can be restored by an
    # approved pull-request run (docs/design/ci-checks.md).
    needs: ci-changes
    if: >-
      needs.ci-changes.outputs.h264-conformance == 'true' &&
      (github.event_name != 'pull_request' ||
       (!github.event.pull_request.draft &&
        github.event.pull_request.head.repo.full_name == github.repository))
    concurrency:
      group: ${{ github.workflow }}-training-identity-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check for the corpus credentials
        id: creds
        env:
          R2_ENDPOINT: ${{ secrets.COREAV_CORPUS_R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.COREAV_CORPUS_R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.COREAV_CORPUS_R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ vars.COREAV_CORPUS_R2_BUCKET }}
        run: |
          if [ -n "$R2_ENDPOINT" ] && [ -n "$R2_ACCESS_KEY_ID" ] && [ -n "$R2_SECRET_ACCESS_KEY" ] && [ -z "$R2_BUCKET" ]; then
            # Credentials without a bucket is a setting left undone, not a
            # fork: fail rather than skip the check in silence.
            echo "::error::the corpus credentials are set but the variable COREAV_CORPUS_R2_BUCKET is not"
            exit 1
          fi
          if [ -n "$R2_ENDPOINT" ] && [ -n "$R2_ACCESS_KEY_ID" ] && [ -n "$R2_SECRET_ACCESS_KEY" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "### H.264 training-set identity: not run, no corpus credentials" >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        if: steps.creds.outputs.present == 'true'
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        if: steps.creds.outputs.present == 'true'
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: steps.creds.outputs.present == 'true'
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install the historical training extractor and boto3
        if: steps.creds.outputs.present == 'true'
        run: |
          bash docs/measurements/h264-training/tools/install-extractor.sh
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet 'boto3==1.35.36'
      - name: Cache the training set's elementary streams
        if: steps.creds.outputs.present == 'true' && github.event.repository.private == true
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ runner.temp }}/training
          key: h264-training-es-${{ hashFiles('docs/measurements/h264-training/es.json') }}
      - name: Extract the training set and check its bytes
        if: steps.creds.outputs.present == 'true'
        env:
          R2_ENDPOINT: ${{ secrets.COREAV_CORPUS_R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.COREAV_CORPUS_R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.COREAV_CORPUS_R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ vars.COREAV_CORPUS_R2_BUCKET }}
        run: |
          cd docs/measurements/h264-training
          "$RUNNER_TEMP/venv/bin/python" -I tools/extract.py list.json "$RUNNER_TEMP/training" > "$RUNNER_TEMP/es.json"
          python3 -I - "$RUNNER_TEMP/es.json" es.json <<'PY'
          import json, sys
          got, want = (json.load(open(p)) for p in sys.argv[1:3])
          bad = [k for k in want if got.get(k, {}).get('es_sha256') != want[k].get('es_sha256')]
          if bad:
              raise SystemExit(f"elementary streams differ from es.json: {bad}")
          PY
      - name: Decode the training set in both modes
        if: steps.creds.outputs.present == 'true'
        run: |
          python3 -I scripts/h264_modes_identity.py \
            --streams "$RUNNER_TEMP/training" \
            --threads 1,8 \
            --report "$RUNNER_TEMP/modes-training.json"

  kernels-arm64:
    needs: ci-changes
    if: >-
      needs.ci-changes.outputs.h264-conformance == 'true' &&
      (github.event_name != 'pull_request' || !github.event.pull_request.draft)
    # Bar C3 on arm64: the NEON kernels against the reference, and the
    # per-kernel timings the dispatch rules come from. The conformance
    # suite follows on a push to main, where the arm64 runner's cost is
    # paid once rather than per push to a branch.
    concurrency:
      group: ${{ github.workflow }}-kernels-arm64-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo clippy -p coreav-kernels-h264 -p coreav-h264 --all-targets -- -D warnings
      - run: cargo test -p coreav-kernels-h264 -p coreav-h264 --release
      - name: Time each kernel
        run: |
          cargo run -p coreav-kernels-h264 --release --example bench | tee "$RUNNER_TEMP/bench.txt"
          {
            echo "### Kernel timings (arm64)"
            echo '```'
            cat "$RUNNER_TEMP/bench.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  conformance-arm64:
    # The whole suite on arm64, on a push to main.
    needs: ci-changes
    if: >-
      needs.ci-changes.outputs.h264-conformance == 'true' &&
      github.event_name == 'push'
    concurrency:
      group: ${{ github.workflow }}-conformance-arm64-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Cache the conformance zips
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/.cache/h264-conformance
          key: h264-conformance-${{ hashFiles('crates/coreav-h264/tests/data/conformance-streams.json') }}
      - name: Decode every in-scope stream
        run: |
          python3 -I scripts/h264_conformance.py \
            --zips ~/.cache/h264-conformance \
            --work "$RUNNER_TEMP/h264" \
            --threads 1,2,8 \
            --report "$RUNNER_TEMP/conformance-arm64.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: h264-conformance-arm64
          path: ${{ runner.temp }}/conformance-arm64.json
          if-no-files-found: ignore

  # The CI benchmark guard (docs/design/benchmarks.md):
  # instruction counts of the coreav command on generated fixtures.
  # - Pushes to main that change what the binary or the fixtures are built
  #   from, and manual runs: against bench/guard/baseline.json.
  # - Ready pull requests that change the crates or the lock file: the pull
  #   request's merge commit against its base commit, both built and counted
  #   in this job, so a regression shows before it merges. Drafts skip it.
  # A manual run with `update` keeps the counts as an artifact for a pull
  # request that replaces the baseline. ci-changes' `bench-guard` is the
  # filter, one list for both events: a pull request that changes the
  # fixture generator, the pinned FFmpeg installer or the web-upload policy
  # measures too, which is the safe direction.
  bench-guard:
    needs: ci-changes
    if: >-
      needs.ci-changes.outputs.bench-guard == 'true' &&
      (github.event_name != 'pull_request' || !github.event.pull_request.draft)
    concurrency:
      group: ${{ github.workflow }}-bench-guard-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # The compiler is pinned so that counts move only with the code; the
      # baseline records it, and updating it means a new baseline. It
      # overrides rust-toolchain.toml's `stable`.
      RUSTUP_TOOLCHAIN: 1.99.1
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # A pull request's merge commit and its first parent, the base.
          fetch-depth: 2
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: 1.99.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          # A count over the tolerance fails the job after its builds, and
          # those builds are still worth keeping for the next run.
          cache-on-failure: true
          # Since the decoder build moved to target/decoder: an entry saved
          # before has none, and rust-cache does not save over an exact hit.
          key: decoder
      - name: Cache the pinned FFmpeg
        id: ffmpeg-cache
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ runner.temp }}/coreav-oracle-bin
          key: linux-x64-oracle-${{ hashFiles('scripts/oracle-ffmpeg.env', 'scripts/install-oracle-ffmpeg.sh') }}
      - name: Install the pinned FFmpeg
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        run: scripts/install-oracle-ffmpeg.sh "$RUNNER_TEMP/coreav-oracle-bin"
      - name: Install Valgrind
        run: sudo apt-get update -q && sudo apt-get install -y --no-install-recommends valgrind
      - name: Generate the fixtures
        env:
          COREAV_REQUIRE_ALL_FIXTURES: '1'
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 -I scripts/oracle_pin.py --verify-bin "$RUNNER_TEMP/coreav-oracle-bin"
          echo "$RUNNER_TEMP/coreav-oracle-bin" >> "$GITHUB_PATH"
          export PATH="$RUNNER_TEMP/coreav-oracle-bin:$PATH"
          scripts/gen-fixtures.sh "$RUNNER_TEMP/fixtures"
      - name: Count the base commit's instructions (pull requests)
        if: github.event_name == 'pull_request'
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -o pipefail
          # The merge commit's first parent: what the pull request merges
          # into, as of this run.
          BASE=$(git rev-parse HEAD^1)
          git worktree add "$RUNNER_TEMP/base" "$BASE"
          # Its own target directories, seeded with the restored
          # dependencies: a shared one would let cargo take the base's build
          # for the head's. The head's decoder build is in target/decoder.
          mkdir -p target/decoder
          rsync -a --exclude=/decoder target/ "$RUNNER_TEMP/base-target/"
          cp -a target/decoder "$RUNNER_TEMP/base-decoder-target"
          # The shipped profile, or `release` for a base that predates it.
          PROFILE=release
          if grep -q '^\[profile\.dist\]' "$RUNNER_TEMP/base/Cargo.toml"; then PROFILE=dist; fi
          (cd "$RUNNER_TEMP/base" && cargo build --locked --profile "$PROFILE" -p coreav-cli --bin coreav \
            --target-dir "$RUNNER_TEMP/base-target")
          cp "$RUNNER_TEMP/base-target/$PROFILE/coreav" "$RUNNER_TEMP/coreav-base"
          # The cases that need a decoder (the thumbnail, the transcode) run on a second
          # build with the FFmpeg fallback, when the base has it
          # (docs/design/thumbnails.md, "Regression guard").
          DECODER=
          if grep -q '^ffmpeg-fallback' "$RUNNER_TEMP/base/crates/coreav-cli/Cargo.toml"; then
            # With the opt-in AAC decoder where the base has it.
            FEATURES=ffmpeg-fallback
            if grep -q '^aac' "$RUNNER_TEMP/base/crates/coreav-cli/Cargo.toml"; then FEATURES=ffmpeg-fallback,aac; fi
            (cd "$RUNNER_TEMP/base" && cargo build --locked --profile "$PROFILE" -p coreav-cli --bin coreav \
              --features "$FEATURES" --target-dir "$RUNNER_TEMP/base-decoder-target")
            cp "$RUNNER_TEMP/base-decoder-target/$PROFILE/coreav" "$RUNNER_TEMP/coreav-base-decoder"
            DECODER="--decoder-coreav $RUNNER_TEMP/coreav-base-decoder"
          fi
          echo "BASE=$BASE" >> "$GITHUB_ENV"
          {
            echo "### Base commit (${BASE::12})"
            python3 -I scripts/bench_guard.py --coreav "$RUNNER_TEMP/coreav-base" $DECODER \
              --fixtures "$RUNNER_TEMP/fixtures" --report-only --write "$RUNNER_TEMP/base.json"
            if ! git diff --quiet "$BASE" HEAD -- bench/guard/baseline.json; then
              echo
              echo "**This pull request changes bench/guard/baseline.json.** Its description must state the unavoidable cost that moves the baseline (docs/design/benchmarks.md)."
              echo "::warning file=bench/guard/baseline.json::This pull request moves the baseline; state the unavoidable cost in its description." >&2
            fi
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Build the coreav binary
        run: |
          cargo build --locked --profile dist -p coreav-cli --bin coreav \
            --message-format=json-render-diagnostics > "$RUNNER_TEMP/head-build.json"
          # Two builds of different code give two binaries, unless the change
          # does not reach the native binary (code for other targets or
          # features, comments): then cargo compiled the head's `coreav`
          # from the head's sources (not `fresh`) and still got the base's
          # bytes. A head binary cargo did not compile is the base's build
          # taken again, which would hide a regression.
          if [ "${{ github.event_name }}" = pull_request ] \
            && ! git diff --quiet "$BASE" HEAD -- crates Cargo.toml Cargo.lock rust-toolchain.toml \
            && cmp -s target/dist/coreav "$RUNNER_TEMP/coreav-base"; then
            if python3 -I -c 'import json, sys; sys.exit(0 if any(m.get("reason") == "compiler-artifact" and m["target"]["name"] == "coreav" and "bin" in m["target"]["kind"] and not m["fresh"] for m in map(json.loads, open(sys.argv[1]))) else 1)' "$RUNNER_TEMP/head-build.json"; then
              echo "::notice::the head's code changes do not reach the native coreav binary: it was rebuilt from the head and equals the base's"
            else
              echo "::error::the base and head builds are the same binary although the code differs"
              exit 1
            fi
          fi
      - name: Build the decoder binary
        # The cases that need a decoder (the thumbnail, the transcode, whose
        # encoder is the pinned ffmpeg on PATH, and AAC LC's decode-audio,
        # opt-in): a second build with the FFmpeg fallback and the feature
        # `aac`, in its own target directory, so that the shipped binary
        # above stays the one counted for every other case. It is under
        # target/, so rust-cache keeps its dependencies too.
        run: |
          if grep -q '^ffmpeg-fallback' crates/coreav-cli/Cargo.toml; then
            cargo build --locked --profile dist -p coreav-cli --bin coreav --features ffmpeg-fallback,aac \
              --target-dir target/decoder
            echo "DECODER=--decoder-coreav $GITHUB_WORKSPACE/target/decoder/dist/coreav" >> "$GITHUB_ENV"
          fi
      - name: Count instructions
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          AGAINST: ${{ github.event_name == 'pull_request' && format('{0}/base.json', runner.temp) || 'bench/guard/baseline.json' }}
        run: |
          set -o pipefail
          {
            if [ "${{ github.event_name }}" = pull_request ]; then
              echo "### This pull request against its base commit"
            fi
            python3 -I scripts/bench_guard.py --coreav target/dist/coreav $DECODER \
              --fixtures "$RUNNER_TEMP/fixtures" --baseline "$AGAINST" \
              --write "$RUNNER_TEMP/counts.json"
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - if: always() && inputs.update
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bench-guard-counts
          path: ${{ runner.temp }}/counts.json
          retention-days: 14

  ci-report:
    # Always runs, including when the filter above skipped every job, so
    # that the branch ruleset has one check name this workflow reports on
    # every pull request, a documentation-only one included
    # (docs/design/ci-checks.md). It waits for every job of the workflow,
    # and its summary names each job's result. It has no concurrency group:
    # it has to report on a cancelled run too.
    needs: [ci-changes, check, check-macos, check-windows, msrv, fuzz, isobmff-fixtures, isobmff-fixture-set, isobmff-writers, isobmff-decode, b9-shard, b9, mkv-fixtures, ts-fixtures, conformance, vector-width, modes-identity, training-identity, kernels-arm64, conformance-arm64, bench-guard]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Fail if a job above failed or was cancelled
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          { echo '| job | result |'
            echo '|---|---|'
            jq -r 'to_entries[] | "| \(.key) | \(.value.result) |"' <<< "$RESULTS"
          } >> "$GITHUB_STEP_SUMMARY"
          bad=$(jq -r '[to_entries[]
            | select(.value.result == "failure" or .value.result == "cancelled")
            | .key] | join(", ")' <<< "$RESULTS")
          if [ -n "$bad" ]; then
            echo "::error::failed or cancelled: $bad"
            exit 1
          fi
