name: ci

# Every required job of a pull request but `deny`, `python-report` and
# `npm-report`. One job, `ci-changes`, reads the event's changed files once
# and gives each group of jobs its own output:
#
# - `run`: the build, the tests and the fixture oracles. Documentation prose
#   skips them: none of them reads it, so a run would only spend Actions
#   minutes. Neither `docs/` nor markdown is ignored as a whole, because the
#   gates read some of both: `docs/schema/**` is compiled into the command's
#   tests, the oracle scripts load `docs/known-divergences*.json` and their
#   tests check each page against its twin, and
#   `scripts/unsafe_sites_check.py` reads `docs/unsafe-sites.md`. What is
#   left out of the list runs everything, which is the safe direction.
# - `h264-conformance` and `bench-guard`: the decoder's conformance suite
#   and the instruction-count guard, each on its own, narrower list.
# - `fuzz-plan`: the fuzz targets a ready pull request can affect, empty on
#   any other event.
#
# One report job, `ci-report`, waits for every job; the branch ruleset
# requires it.
# The licence, advisory and DCO checks are not filtered; they live in
# .github/workflows/deny.yml and run on every pull request. A manual run is
# never filtered.
#
# The filter sits on the jobs, not on the trigger: a workflow a trigger
# filter skips reports no check at all, and `ci-report` has to appear on
# every pull request for the branch ruleset to require it
# (docs/design/ci-checks.md).
#
# A new push to a pull request cancels the previous run job by job: every
# job but `ci-report` has its own concurrency group. A group on the whole
# workflow would keep the new run waiting until the old run's `ci-report`,
# which `always()` runs in a cancelled run too, had found a runner and
# ended. `ci-changes` has a group as well, so an old run's jobs enter their
# groups before the new run's and never cancel them. Pushes to main and
# manual runs each get their own groups, so none is dropped
# (docs/design/ci-checks.md, "Concurrency").
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      update:
        description: Keep the bench-guard counts as an artifact, for a pull request that replaces the baseline
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  ci-changes:
    # Whether this event's changed files need the jobs below at all. A
    # manual run, and anything whose changed files cannot be read, runs
    # them (docs/design/ci-checks.md).
    concurrency:
      group: ${{ github.workflow }}-ci-changes-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      run: ${{ steps.filter.outputs.run }}
      h264-conformance: ${{ steps.h264-conformance.outputs.run }}
      bench-guard: ${{ steps.bench-guard.outputs.run }}
      fuzz-plan: ${{ steps.fuzz-plan.outputs.plan }}
      # Whether `check-macos` and `check-windows` run: always on a push or
      # a manual run, and on a pull request when it changes a path below.
      platforms: ${{ github.event_name != 'pull_request' || steps.platforms.outputs.run == 'true' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # A pull request's merge commit and its first parent, the base.
          fetch-depth: 2
      - id: filter
        uses: ./.github/actions/changed-paths
        with:
          paths-ignore: |
            docs/design/**
            docs/measurements/**
            docs/release/**
            docs/schema/*.md
            *.md
            .context/**
            docs/spikes/**
      # The code that differs between Linux, macOS and Windows (the sandbox,
      # the processes it starts, positioned file reads, code that differs by
      # target architecture), the backends the
      # macOS job links against Homebrew's libraries, what the build depends
      # on, and these jobs themselves (docs/design/ci-checks.md, "The
      # platform jobs").
      - id: platforms
        if: github.event_name == 'pull_request'
        uses: ./.github/actions/changed-paths
        with:
          paths: |
            crates/coreav-worker/**
            crates/coreav-transcode/**
            crates/coreav-cli/**
            crates/coreav-backend-dav1d/**
            crates/coreav-backend-libvpx/**
            crates/coreav-isobmff/src/source.rs
            crates/coreav-h264/**
            crates/coreav-kernels-h264/**
            crates/coreav-kernels-audio/**
            Cargo.toml
            **/Cargo.toml
            Cargo.lock
            rust-toolchain.toml
            clippy.toml
            .github/workflows/ci.yml
            .github/actions/changed-paths/**
      - id: h264-conformance
        uses: ./.github/actions/changed-paths
        with:
          paths: |
            crates/coreav-h264/**
            crates/coreav-kernels-h264/**
            scripts/h264_conformance.py
            scripts/h264_modes_identity.py
            scripts/oracle-ffmpeg.env
            scripts/install-oracle-ffmpeg.sh
            docs/measurements/h264-training/**
            .github/workflows/ci.yml
            .github/actions/changed-paths/**
      - id: bench-guard
        uses: ./.github/actions/changed-paths
        with:
          paths: |
            crates/**
            Cargo.toml
            Cargo.lock
            rust-toolchain.toml
            scripts/gen-fixtures.sh
            scripts/install-oracle-ffmpeg.sh
            scripts/oracle-ffmpeg.env
            scripts/bench_guard.py
            scripts/ts_craft.py
            docs/schema/policy-examples/web-upload.json
            bench/guard/**
            .github/workflows/ci.yml
            .github/actions/changed-paths/**
      # The fuzz targets a ready pull request can affect: every target of
      # each fuzz project whose own directory, or a workspace crate it
      # depends on, the change touches (scripts/fuzz_plan.py). Pushes to
      # main and manual runs do not fuzz here; fuzz-nightly.yml runs every
      # target daily (docs/design/ci-checks.md, "The fuzz runs"). Draft PRs
      # skip it.
      - id: fuzz-plan
        if: >-
          steps.filter.outputs.run == 'true' &&
          github.event_name == 'pull_request' && !github.event.pull_request.draft
        run: |
          set -euo pipefail
          # Both sides of a rename, NUL-separated and unquoted.
          git -c core.quotePath=false diff --name-only --no-renames -z HEAD^1 HEAD > "$RUNNER_TEMP/changed.txt"
          python3 scripts/fuzz_plan.py --changed "$RUNNER_TEMP/changed.txt" > "$RUNNER_TEMP/fuzz-plan.txt"
          { echo 'plan<<PLAN'; cat "$RUNNER_TEMP/fuzz-plan.txt"; echo PLAN; } >> "$GITHUB_OUTPUT"
          echo "### Fuzz targets" >> "$GITHUB_STEP_SUMMARY"
          if [ -s "$RUNNER_TEMP/fuzz-plan.txt" ]; then
            sed 's/^/- /' "$RUNNER_TEMP/fuzz-plan.txt" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "None: the change affects no fuzz project." >> "$GITHUB_STEP_SUMMARY"
          fi

  check:
    needs: ci-changes
    if: needs.ci-changes.outputs.run == 'true'
    concurrency:
      group: ${{ github.workflow }}-check-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-24.04
    # About 6 minutes with a warm cache; a cold one rebuilds every clippy
    # configuration and the release tests.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo fmt --all --check
      # docs/unsafe-sites.md lists every unsafe site.
      - run: python3 -I scripts/unsafe_sites_check.py
      # pr-redirect.yml's script, run under Node against a stand-in for the
      # GitHub API: who is redirected, and what the issue quotes.
      - run: python3 -I -m unittest discover -s .github/workflows/tests -p 'test_*.py'
        env:
          PYTHONDONTWRITEBYTECODE: '1'
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # The H.264 decoder's safe mode, without its default feature `fast`
      # (docs/design/h264.md).
      - run: cargo clippy -p coreav-h264 --no-default-features --all-targets -- -D warnings
      # The FFmpeg fallback of `coreav thumbnail`, a non-default feature
      # (docs/design/decode.md).
      - run: cargo clippy -p coreav-cli --features ffmpeg-fallback --all-targets -- -D warnings
      # AAC LC, an opt-in feature that no default build has
      # (docs/design/audio-decode.md, "AAC-LC").
      - run: cargo clippy -p coreav-audio -p coreav-cli --features coreav-audio/aac,coreav-cli/aac --all-targets -- -D warnings
      # main.rs's thumbnail subcommand, compiled into coreav-py as a module.
      - run: cargo clippy -p coreav-py --features thumbnail --all-targets -- -D warnings
      # dav1d for AV1, a non-default feature that links the system's
      # libdav1d (docs/design/decode.md, "dav1d"): alone and with the
      # fallback.
      - run: sudo apt-get update -q && sudo apt-get install -y --no-install-recommends libdav1d-dev
      - run: |
          cargo clippy -p coreav-cli -p coreav-backend-dav1d -p coreav-worker -p coreav-decode-oracle \
            --features coreav-cli/dav1d,coreav-backend-dav1d/dav1d,coreav-worker/dav1d,coreav-decode-oracle/dav1d,coreav-decode-oracle/native-h264 \
            --all-targets -- -D warnings
          cargo clippy -p coreav-cli --features dav1d,ffmpeg-fallback --all-targets -- -D warnings
          cargo test -p coreav-backend-dav1d --features dav1d
      # libvpx for VP8 and VP9, a non-default feature that links the system's libvpx
      # (docs/design/decode.md, "libvpx"): alone and with the other backends.
      - run: sudo apt-get install -y --no-install-recommends libvpx-dev
      - run: |
          cargo clippy -p coreav-cli -p coreav-backend-libvpx -p coreav-worker -p coreav-decode-oracle \
            --features coreav-cli/libvpx,coreav-backend-libvpx/libvpx,coreav-worker/libvpx,coreav-decode-oracle/libvpx \
            --all-targets -- -D warnings
          cargo clippy -p coreav-cli --features libvpx,dav1d,ffmpeg-fallback --all-targets -- -D warnings
          cargo test -p coreav-backend-libvpx --features libvpx
      # libopus for the Opus encoder of `coreav transcode --audio opus`, a
      # non-default feature that links the system's libopus
      # (docs/design/transcode.md, "Opus audio"); with `aac` too, whose
      # decoder the Opus encode passes over.
      - run: sudo apt-get install -y --no-install-recommends libopus-dev
      - run: |
          cargo clippy -p coreav-cli -p coreav-backend-libopus -p coreav-worker \
            --features coreav-cli/libopus,coreav-cli/native-h264,coreav-backend-libopus/libopus,coreav-worker/libopus \
            --all-targets -- -D warnings
          cargo clippy -p coreav-cli --features libopus,ffmpeg-fallback --all-targets -- -D warnings
          cargo clippy -p coreav-cli --features aac,libopus,native-h264 --all-targets -- -D warnings
          cargo test -p coreav-backend-libopus --features libopus
          cargo test -p coreav-worker --features libopus
      # The encoder programs of `coreav transcode`, black boxes for
      # coreav-transcode's tests (docs/design/transcode.md): the pinned
      # FFmpeg and an x264 program built from the commit of its libx264
      # (scripts/oracle-ffmpeg.env), its source deleted after the build.
      # With `CI` set the tests
      # fail instead of skipping when either is missing.
      - name: Cache the encoder programs
        id: encoders-cache
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ runner.temp }}/coreav-encoders
          key: linux-x64-encoders-${{ hashFiles('scripts/oracle-ffmpeg.env', 'scripts/install-oracle-ffmpeg.sh', 'scripts/install-x264.sh') }}
      - name: Install the pinned FFmpeg and build x264
        if: steps.encoders-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get install -y --no-install-recommends nasm
          scripts/install-oracle-ffmpeg.sh "$RUNNER_TEMP/coreav-encoders"
          scripts/install-x264.sh "$RUNNER_TEMP/coreav-encoders"
      - name: Verify the pinned encoder oracle
        run: python3 -I scripts/oracle_pin.py --verify-bin "$RUNNER_TEMP/coreav-encoders"
      # The Opus and AAC bars' source set, made by the pinned FFmpeg at a
      # second each, so a source its filter parser refuses fails here and
      # not in a judged run (docs/design/transcode.md, "Opus bars").
      - name: Make the bars' source set
        run: python3 -I -m unittest discover -s scripts/tests -p 'test_bar_sources.py'
        env:
          COREAV_FFMPEG: ${{ runner.temp }}/coreav-encoders/ffmpeg
      - run: cargo test --workspace
        env:
          COREAV_FFMPEG: ${{ runner.temp }}/coreav-encoders/ffmpeg
          COREAV_X264: ${{ runner.temp }}/coreav-encoders/x264
      # Strict-safe mode runs no ffmpeg program, as the decoder, the encoder
      # or in place of a command (docs/design/compat-cli.md, "Strict-safe
      # mode"): in a build with the FFmpeg fallback, in one with dav1d too,
      # and in one with CoreAV's own H.264 decoder alone. The pinned FFmpeg
      # only makes the source.
      - run: |
          cargo test -p coreav-cli --features ffmpeg-fallback --test strict_safe --test strict_safe_limit
          cargo test -p coreav-cli --features dav1d,ffmpeg-fallback --test strict_safe --test strict_safe_limit
          cargo test -p coreav-cli --features native-h264 --test strict_safe --test strict_safe_limit
          cargo test -p coreav-cli --features native-h264,libopus --test strict_safe
        env:
          COREAV_FFMPEG: ${{ runner.temp }}/coreav-encoders/ffmpeg
      # Checks the documentation site's help text of `coreav thumbnail` and
      # `coreav transcode`, which only builds with a decoder backend include
      # (docs/design/docs-site.md); `cargo test --workspace` checks the rest.
      - run: cargo test -p coreav-cli --features ffmpeg-fallback --test docs_site
      # The unit tests of what only a build with a decoder backend has
      # (`coreav ffmpeg`'s encode, `coreav transcode`), which
      # `cargo test --workspace` does not build.
      - run: cargo test -p coreav-cli --features ffmpeg-fallback --lib
      # The AAC LC pipeline and command, with the opt-in feature
      # (docs/design/audio-decode.md, "AAC-LC").
      - run: |
          cargo test -p coreav-audio --features aac
          cargo test -p coreav-cli --features aac --test decode_audio
        env:
          COREAV_FFMPEG: ${{ runner.temp }}/coreav-encoders/ffmpeg
      # Pinned limit test: 2.2 GB virtual fragmented
      # file with 20,000 fragments, reads bounded to 1 MiB.
      - run: cargo test --release -p coreav-isobmff --test hostile -- --ignored
      # An output above 4 GiB (co64, 64-bit mdat size), copied from a 4.4 GB
      # virtual file.
      - run: cargo test --release -p coreav-isobmff-write --test extract outputs_above_4_gib -- --ignored
      # The other two pinned limit tests (docs/design/limits.md), measured with the test-only counting
      # allocator: peak memory growth under 32 MiB while a 2.2 GB
      # fragmented file is demuxed and stream-copied, and huge declared
      # counts rejected without allocating. One thread and --nocapture so
      # that every bar's measured numbers reach the log unmixed.
      - run: cargo test --release -p coreav-isobmff -p coreav-isobmff-write --test memory -- --include-ignored --nocapture --test-threads=1
      # A transport stream's probe and listing, run again and again, hold
      # nothing between runs (docs/design/fuzz-campaign.md).
      - run: cargo test --release -p coreav-mpegts --test memory -- --nocapture --test-threads=1
      # docs/design/mkv.md: a 2.2 GB virtual live recording, reads bounded
      # to 1 MiB.
      - run: cargo test --release -p coreav-mkv --test hostile -- --ignored
      # docs/design/audio-decode.md ("Threads"): large packets stay within
      # the decoding pool's byte bound. One test at a time: each reads the
      # process's peak memory.
      - run: cargo test --release -p coreav-audio --test pool_memory -- --ignored --test-threads=1

  check-macos:
    # The tests and clippy configurations of `check`, on Apple Silicon,
    # where the sandbox's limits, process control and frame transfer differ
    # from Linux (docs/design/decode.md, "Memory"). Left out: `cargo fmt`
    # and the Python checks, which do not depend on the platform, and
    # `coreav-audio`'s pool test, which reads /proc. The pinned FFmpeg and
    # x264 are Linux x86-64 programs, so the tests run with `CI` unset and
    # those that need them skip, as on a developer's Mac.
    needs: ci-changes
    if: needs.ci-changes.outputs.run == 'true' && needs.ci-changes.outputs.platforms == 'true'
    concurrency:
      group: ${{ github.workflow }}-check-macos-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    runs-on: macos-15
    timeout-minutes: 45
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_INSTALL_CLEANUP: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # Code the build and the tests run could read the job token
          # from the git config otherwise.
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo clippy -p coreav-h264 --no-default-features --all-targets -- -D warnings
      - run: cargo clippy -p coreav-cli --features ffmpeg-fallback --all-targets -- -D warnings
      - run: cargo clippy -p coreav-py --features thumbnail --all-targets -- -D warnings
      # libdav1d and libvpx for the non-default backends, as `check`
      # installs them with apt.
      - run: brew install dav1d libvpx pkgconf
      - run: |
          cargo clippy -p coreav-cli -p coreav-backend-dav1d -p coreav-worker -p coreav-decode-oracle \
            --features coreav-cli/dav1d,coreav-backend-dav1d/dav1d,coreav-worker/dav1d,coreav-decode-oracle/dav1d,coreav-decode-oracle/native-h264 \
            --all-targets -- -D warnings
          cargo clippy -p coreav-cli -p coreav-backend-libvpx -p coreav-worker -p coreav-decode-oracle \
            --features coreav-cli/libvpx,coreav-backend-libvpx/libvpx,coreav-worker/libvpx,coreav-decode-oracle/libvpx \
            --all-targets -- -D warnings
          cargo clippy -p coreav-cli --features libvpx,dav1d,ffmpeg-fallback --all-targets -- -D warnings
          env -u CI cargo test -p coreav-backend-dav1d --features dav1d
          env -u CI cargo test -p coreav-backend-libvpx --features libvpx
      - run: env -u CI cargo test --workspace
      - run: |
          env -u CI cargo test -p coreav-cli --features ffmpeg-fallback --test strict_safe --test strict_safe_limit
          env -u CI cargo test -p coreav-cli --features native-h264 --test strict_safe --test strict_safe_limit
      - run: cargo test -p coreav-cli --features ffmpeg-fallback --test docs_site
      - run: |
          cargo test --release -p coreav-isobmff --test hostile -- --ignored
          cargo test --release -p coreav-isobmff-write --test extract outputs_above_4_gib -- --ignored
          cargo test --release -p coreav-isobmff -p coreav-isobmff-write --test memory -- --include-ignored --nocapture --test-threads=1
          cargo test --release -p coreav-mpegts --test memory -- --nocapture --test-threads=1
          cargo test --release -p coreav-mkv --test hostile -- --ignored

  check-windows:
    # The tests and clippy configurations of `check` that build on Windows
    # (x86-64, MSVC), where the sandbox sets no resource limits and has no
    # process groups (docs/design/decode.md, "Memory"). Left out, besides
    # what `check-macos` leaves out: the dav1d and libvpx backends, which
    # link libraries this runner does not have. The tests run with `CI`
    # unset, as on macOS.
    needs: ci-changes
    if: needs.ci-changes.outputs.run == 'true' && needs.ci-changes.outputs.platforms == 'true'
    concurrency:
      group: ${{ github.workflow }}-check-windows-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    runs-on: windows-2025
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      # Fixtures and help texts are compared byte for byte.
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # Code the build and the tests run could read the job token
          # from the git config otherwise.
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Each step runs even after one above failed, so one run lists every
      # failure on this platform.
      - if: ${{ !cancelled() }}
        run: cargo clippy --workspace --all-targets -- -D warnings
      - if: ${{ !cancelled() }}
        run: cargo clippy -p coreav-h264 --no-default-features --all-targets -- -D warnings
      - if: ${{ !cancelled() }}
        run: cargo clippy -p coreav-cli --features ffmpeg-fallback --all-targets -- -D warnings
      - if: ${{ !cancelled() }}
        run: cargo clippy -p coreav-py --features thumbnail --all-targets -- -D warnings
      - if: ${{ !cancelled() }}
        run: env -u CI cargo test --workspace --no-fail-fast
      - if: ${{ !cancelled() }}
        run: |
          env -u CI cargo test -p coreav-cli --features ffmpeg-fallback --test strict_safe --test strict_safe_limit
          env -u CI cargo test -p coreav-cli --features native-h264 --test strict_safe --test strict_safe_limit
      - if: ${{ !cancelled() }}
        run: cargo test -p coreav-cli --features ffmpeg-fallback --test docs_site
      - if: ${{ !cancelled() }}
        run: |
          cargo test --release -p coreav-isobmff --test hostile -- --ignored
          cargo test --release -p coreav-isobmff-write --test extract outputs_above_4_gib -- --ignored
          cargo test --release -p coreav-isobmff -p coreav-isobmff-write --test memory -- --include-ignored --nocapture --test-threads=1
          cargo test --release -p coreav-mpegts --test memory -- --nocapture --test-threads=1
          cargo test --release -p coreav-mkv --test hostile -- --ignored

  msrv:
    # The workspace's declared rust-version (root Cargo.toml) must build: a
    # newer language feature or std API raises it in the same PR.
    needs: ci-changes
    if: needs.ci-changes.outputs.run == 'true'
    concurrency:
      group: ${{ github.workflow }}-msrv-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-24.04
    # Under a minute with a warm cache; `cargo check` only.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - id: msrv
        run: python3 -I -c "import tomllib; print('version=' + tomllib.load(open('Cargo.toml', 'rb'))['workspace']['package']['rust-version'])" >> "$GITHUB_OUTPUT"
      # The same pinned action as the stable jobs; the toolchain is an input.
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
          targets: wasm32-unknown-unknown
      # rust-toolchain.toml selects stable; this makes the cache key and
      # cargo use the declared version instead.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        env:
          RUSTUP_TOOLCHAIN: ${{ steps.msrv.outputs.version }}
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo check --workspace --all-targets --locked
        env:
          RUSTUP_TOOLCHAIN: ${{ steps.msrv.outputs.version }}
      # The WebAssembly build's own code (cfg(target_arch = "wasm32")).
      - run: cargo check --locked -p coreav-wasm --target wasm32-unknown-unknown
        env:
          RUSTUP_TOOLCHAIN: ${{ steps.msrv.outputs.version }}
      # The H.264 decoder builds for WebAssembly too (docs/design/h264.md), so
      # it stays free of threads and I/O.
      - run: cargo check --locked -p coreav-h264 -p coreav-kernels-h264 --target wasm32-unknown-unknown
        env:
          RUSTUP_TOOLCHAIN: ${{ steps.msrv.outputs.version }}


  fuzz:
    # The targets above share a budget of FUZZ_BUDGET seconds, 5 to 30 each:
    # 30 when few are affected, and a short pass over every target when a
    # change reaches every project (the lock file, this workflow). A finding
    # fails the job; its input and output stay off the log and off the
    # artifacts (scripts/fuzz_run.sh), and are found again locally.
    # Two shards of whole projects (scripts/fuzz_run.sh shard), each target
    # for the seconds the whole plan gives it.
    needs: ci-changes
    if: needs.ci-changes.outputs.fuzz-plan != ''
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    concurrency:
      group: ${{ github.workflow }}-fuzz-${{ strategy.job-index }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: scripts/fuzz_run.sh setup
      # The build fuzz-nightly.yml cached on main.
      - uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: target/fuzz
          key: fuzz-target-${{ hashFiles('scripts/fuzz_run.sh', 'Cargo.lock', 'crates/*/fuzz/Cargo.lock') }}
          restore-keys: fuzz-target-
      - name: Build the fuzz projects of this shard
        env:
          PLAN: ${{ needs.ci-changes.outputs.fuzz-plan }}
          SHARD: ${{ matrix.shard }}
        run: |
          printf '%s\n' "$PLAN" > "$RUNNER_TEMP/fuzz-plan.txt"
          scripts/fuzz_run.sh shard "$RUNNER_TEMP/fuzz-plan.txt" "$SHARD" 2 > "$RUNNER_TEMP/fuzz-shard.txt"
          if [ -s "$RUNNER_TEMP/fuzz-shard.txt" ]; then
            scripts/fuzz_run.sh build "$RUNNER_TEMP/fuzz-shard.txt"
          fi
      - name: Run each target
        env:
          FUZZ_BUDGET: 480
          # The fuzz campaign's AddressSanitizer options
          # (docs/design/fuzz-campaign.md, tools/fuzz-campaign/campaign.py).
          ASAN_OPTIONS: quarantine_size_mb=64
          SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          n=$(wc -l < "$RUNNER_TEMP/fuzz-plan.txt")
          seconds=$(( FUZZ_BUDGET / n ))
          seconds=$(( seconds > 30 ? 30 : seconds < 5 ? 5 : seconds ))
          echo "Each of the $n targets runs for $seconds seconds; this shard runs $(wc -l < "$RUNNER_TEMP/fuzz-shard.txt") of them." >> "$GITHUB_STEP_SUMMARY"
          if [ ! -s "$RUNNER_TEMP/fuzz-shard.txt" ]; then exit 0; fi
          if ! scripts/fuzz_run.sh run "$RUNNER_TEMP/fuzz-shard.txt" "$seconds" "$RUNNER_TEMP/fuzz"; then
            echo "A target failed. Run it locally: scripts/fuzz_run.sh shard PLAN $SHARD 2 > SHARD, then scripts/fuzz_run.sh run SHARD $seconds OUT, with the plan above; the input and output are in OUT/findings." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

  # The ISO base media oracle: ffprobe, MediaInfo, the command and the
  # writers. It follows ci-changes' `run`, as the jobs above do.
  isobmff-fixtures:
    # Draft PRs skip it (workflow_dispatch still runs it on demand).
    needs: ci-changes
    if: >-
      needs.ci-changes.outputs.run == 'true' &&
      (github.event_name != 'pull_request' || !github.event.pull_request.draft)
    concurrency:
      group: ${{ github.workflow }}-isobmff-fixtures-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Cache pinned black-box binaries
        id: ffmpeg-cache
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ runner.temp }}/coreav-oracle-bin
          key: linux-x64-oracle-mediainfo-26.10-${{ hashFiles('scripts/oracle-ffmpeg.env', 'scripts/install-oracle-ffmpeg.sh', 'scripts/install-oracle-mediainfo.sh') }}
      # MediaInfo is a gating oracle for extracted M4A files only; elsewhere it stays informational.
      - name: Install pinned FFmpeg, ffprobe and MediaInfo
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        run: |
          scripts/install-oracle-ffmpeg.sh "$RUNNER_TEMP/coreav-oracle-bin"
          scripts/install-oracle-mediainfo.sh "$RUNNER_TEMP/coreav-oracle-bin"
      - name: Use pinned binaries
        run: |
          python3 -I scripts/oracle_pin.py --verify-bin "$RUNNER_TEMP/coreav-oracle-bin"
          echo "$RUNNER_TEMP/coreav-oracle-bin" >> "$GITHUB_PATH"
      # Generated on every run: every run must exercise generation, and
      # required cases must never silently disappear.
      - name: Generate all required fixtures
        env:
          COREAV_REQUIRE_ALL_FIXTURES: '1'
        run: scripts/gen-fixtures.sh "$RUNNER_TEMP/coreav-fixtures"
      - name: Check oracle audio input threading
        env:
          COREAV_FIXTURES: ${{ runner.temp }}/coreav-fixtures
          COREAV_FFMPEG: ${{ runner.temp }}/coreav-oracle-bin/ffmpeg
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 -I -m unittest discover -s scripts/tests -p 'test_oracle_audio.py'
      - name: Build test-only comparator
        run: cargo build --locked -p coreav-oracle
      - name: Test capture normalization
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 -m unittest discover -s tools/oracle/tests -p 'test_*.py'
      - name: Test the hostile suite's reproducer fetcher
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 -I -m unittest discover -s tools/hostile/tests -p 'test_*.py'
      - name: Check independent captures and reject perturbations
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: scripts/oracle.py self-check "$RUNNER_TEMP/coreav-fixtures" "$RUNNER_TEMP/coreav-oracle-check"
      - name: Check executable candidate adapter
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          scripts/oracle.py run "$RUNNER_TEMP/coreav-fixtures" "$RUNNER_TEMP/coreav-oracle-executable" \
            --candidate-exe tools/oracle/ffprobe-candidate.py
      - name: Build the coreav-isobmff oracle adapter
        run: cargo build --locked --release -p coreav-oracle -p coreav-isobmff-adapter -p coreav-mkv-adapter
      # Streams and packets against the pinned ffprobe on every change; known divergences (docs/known-divergences.md) are applied by
      # scripts/oracle_kd.py, which gates on the MP4/MOV fixtures.
      - name: Compare coreav-isobmff with ffprobe
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/coreav-isobmff-oracle"
          scripts/oracle-capture.sh --media "$RUNNER_TEMP/coreav-fixtures" --out "$OUT/reference" --levels streams,packets
          scripts/oracle-capture.sh --media "$RUNNER_TEMP/coreav-fixtures" --out "$OUT/candidate" \
            --adapter target/release/isobmff-adapter --levels streams,packets
          status=0
          target/release/coreav-oracle compare --reference "$OUT/reference" --candidate "$OUT/candidate" \
            --levels streams,packets --profile fixtures --max-diffs 1000000 --report "$OUT/report.json" \
            > "$OUT/compare.log" || status=$?
          # 1 means "not 100% before known divergences"; anything else is a harness error.
          [ "$status" -le 1 ]
          python3 scripts/oracle_kd.py --report "$OUT/report.json" --reference "$OUT/reference" \
            --candidate "$OUT/candidate" --media "$RUNNER_TEMP/coreav-fixtures" --out "$OUT/known-divergences.json"
      # docs/measurements/kd-audit.md: every bug-shaped change to CoreAV's
      # captures of a file a known divergence covers must stay visible.
      - name: Audit the known divergences
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          OUT="$RUNNER_TEMP/coreav-isobmff-oracle"
          python3 tools/oracle/kd_audit.py --reference "$OUT/reference" --candidate "$OUT/candidate" \
            --media "$RUNNER_TEMP/coreav-fixtures" --oracle target/release/coreav-oracle
      # The coreav binary. Every key --ffprobe-compat prints is
      # compared with ffprobe (known divergences from the overlay above apply),
      # native output is validated against docs/schema/probe-v1.schema.json, and
      # the hostile-input suite runs through the binary in both output modes.
      - name: Build the coreav binary
        run: cargo build --locked --release -p coreav-cli
      - name: Compare coreav probe --ffprobe-compat with ffprobe
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 scripts/compat_check.py --coreav target/release/coreav \
            --media "$RUNNER_TEMP/coreav-fixtures" \
            --kd-overlay "$RUNNER_TEMP/coreav-isobmff-oracle/known-divergences.json" \
            --report "$RUNNER_TEMP/coreav-compat.json"
      # docs/design/compat-cli.md (B1, B2 and B3a on the fixtures, B6):
      # every ffprobe command of the coverage set through `coreav ffprobe`
      # on every fixture, against the pinned ffprobe, and every refusal; a
      # failure the committed baseline does not list fails the run.
      - name: Run the command-coverage set through coreav ffprobe
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 -I tools/compat-corpus/run.py commands --coreav target/release/coreav \
            --media "$RUNNER_TEMP/coreav-fixtures" --baseline tools/compat-corpus/baseline-isobmff.json \
            --report "$RUNNER_TEMP/coreav-compat-commands.json"
      - name: List frames through coreav ffprobe
        run: |
          cargo build --locked --release -p coreav-cli --features native-h264 --target-dir target/native
          python3 -I tools/compat-corpus/frames.py --coreav target/native/release/coreav \
            --media "$RUNNER_TEMP/coreav-fixtures" --native-h264 \
            --baseline tools/compat-corpus/baseline-frames.json --report "$RUNNER_TEMP/coreav-frames.json"
      # R1 of the 0.1.0 round (docs/measurements/compat-0.1.0/README.md): the
      # 0.1.0 ffprobe commands on these fixtures, with no baseline. The round
      # reads its verdict from the job summary; a miss or a void run does not
      # fail the job, so that a change of the oracle's output (FFmpeg 9 prints
      # keys 7.0.2 did not) is reported here rather than blocking unrelated
      # pull requests. A run that measured nothing fails it.
      - name: R1 of the 0.1.0 round
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          cargo build --locked --profile dist -p coreav-cli
          sha256sum target/dist/coreav > "$RUNNER_TEMP/coreav-r1.sha256"
          code=0
          python3 -I tools/compat-corpus/run.py commands --set 0.1.0 --coreav target/dist/coreav \
            --media "$RUNNER_TEMP/coreav-fixtures" --report "$RUNNER_TEMP/coreav-r1.json" > "$RUNNER_TEMP/coreav-r1.txt" || code=$?
          case "$code" in 0) verdict=met ;; 1) verdict=missed ;; 2) verdict=void ;; *) verdict="not measured (exit $code)" ;; esac
          [ -s "$RUNNER_TEMP/coreav-r1.json" ] || { verdict='not measured (no report)'; code=3; }
          { echo "### R1 of the 0.1.0 round, ISO base media fixtures: $verdict"; echo '```'; cat "$RUNNER_TEMP/coreav-r1.sha256"; tail -n 15 "$RUNNER_TEMP/coreav-r1.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          [ "$code" -le 2 ]
      - name: Check the coreav binary against the library adapter
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/coreav-isobmff-oracle"
          scripts/oracle-capture.sh --media "$RUNNER_TEMP/coreav-fixtures" --out "$OUT/cli" \
            --adapter scripts/oracle-coreav-cli.sh --levels streams
          # The library adapter for each file's container (coreav-mkv for the
          # WebM fixture) is the reference: every gating field, probe status
          # and stream count must agree through the binary.
          scripts/oracle-capture.sh --media "$RUNNER_TEMP/coreav-fixtures" --out "$OUT/library" \
            --adapter scripts/oracle-library-adapter.sh --levels streams
          target/release/coreav-oracle compare --reference "$OUT/library" --candidate "$OUT/cli" \
            --levels streams --profile fixtures --max-diffs 1000000 --report "$OUT/cli-report.json"
      # The extract-audio outputs are kept for the extraction oracles below.
      - name: Validate coreav probe, clip, split, join, remux, extract-audio, extract-subtitles and chapters output against their schemas
        env:
          COREAV_FIXTURES: ${{ runner.temp }}/coreav-fixtures
          COREAV_EXTRACT_CLI_OUT: ${{ runner.temp }}/coreav-extract-cli
        run: cargo test --locked -p coreav-cli --test cli -- --ignored
      - name: Run the hostile-input suite through the coreav binary
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 -I tools/hostile/generate.py "$RUNNER_TEMP/coreav-hostile" \
            "$RUNNER_TEMP/coreav-fixtures" ffmpeg
          python3 scripts/cli_hostile_check.py --coreav target/release/coreav \
            --suite "$RUNNER_TEMP/coreav-hostile"
      # docs/design/policy-check.md: `coreav check` with the example policies
      # and a tight test policy on every fixture and every hostile file. Each
      # verdict is checked for crashes, determinism (two runs, same bytes),
      # agreement with scripts/policy_ref.py over the probe output (spec) and
      # precision (each reason's value is the probe value at its path); on
      # the fixtures, also against the verdict ffprobe's output implies.
      # Threshold: 100% of cases.
      - name: Check coreav check on the fixtures and the hostile suite
        env:
          COREAV_FIXTURES: ${{ runner.temp }}/coreav-fixtures
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          # The Matroska fixture tests run in the mkv-fixtures job.
          cargo test --locked -p coreav-cli --test check -- --ignored --skip matroska_
          policies=(--policy scripts/policy_fixtures.json)
          for p in docs/schema/policy-examples/*.json; do policies+=(--policy "$p"); done
          python3 -I scripts/policy_check.py --coreav target/release/coreav "${policies[@]}" \
            --media "$COREAV_FIXTURES" --ffprobe ffprobe --oracle-frames \
            --report "$RUNNER_TEMP/coreav-policy-fixtures.json"
          python3 -I scripts/policy_check.py --coreav target/release/coreav "${policies[@]}" \
            --media "$RUNNER_TEMP/coreav-hostile" --report "$RUNNER_TEMP/coreav-policy-hostile.json"
      # Every AAC track of every MP4, MOV and M4A fixture is extracted to M4A. Each output round-trips through coreav-isobmff
      # (stream metadata, packet bytes and times) and is checked against its
      # source with ffprobe (stream, packet hashes), ffmpeg framemd5 and
      # MediaInfo. Threshold: 100% of the fixtures; every AAC stream ffprobe
      # reads must be extracted unless KD-STRICT covers the file.
      - name: Extract audio from the fixtures and check the outputs
        env:
          COREAV_FIXTURES: ${{ runner.temp }}/coreav-fixtures
          COREAV_EXTRACT_OUT: ${{ runner.temp }}/coreav-extract
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          cargo test --locked --release -p coreav-isobmff-write --test extract fixtures_round_trip -- --ignored
          python3 -I scripts/extract_check.py --manifest "$COREAV_EXTRACT_OUT/manifest.json" \
            --mediainfo "$RUNNER_TEMP/coreav-oracle-bin/mediainfo" \
            --media "$COREAV_FIXTURES" \
            --kd-overlay "$RUNNER_TEMP/coreav-isobmff-oracle/known-divergences.json" \
            --report "$RUNNER_TEMP/coreav-extract.json"
      # `coreav extract-audio` writes the library's bytes (checked by the cli
      # test above); its outputs pass the same oracles.
      - name: Check coreav extract-audio outputs with the extraction oracles
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 -I scripts/extract_check.py --manifest "$RUNNER_TEMP/coreav-extract-cli/manifest.json" \
            --mediainfo "$RUNNER_TEMP/coreav-oracle-bin/mediainfo" \
            --media "$RUNNER_TEMP/coreav-fixtures" \
            --kd-overlay "$RUNNER_TEMP/coreav-isobmff-oracle/known-divergences.json" \
            --report "$RUNNER_TEMP/coreav-extract-cli.json"
      # docs/design/text.md: every mov_text stream of every MP4, MOV and M4A
      # fixture through `coreav extract-subtitles`, checked with ffprobe and
      # MediaInfo (the output re-probed) and against `ffmpeg -c:s webvtt`; and
      # every file with chapters through `coreav chapters`, checked against
      # `ffprobe -show_chapters`; docs/known-divergences-text.md applies.
      # Threshold: 100% of the fixtures.
      - name: Extract subtitles and chapters from the fixtures and check them
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 -I scripts/text_check.py --coreav target/release/coreav \
            --media "$RUNNER_TEMP/coreav-fixtures" --require-several-edits \
            --mediainfo "$RUNNER_TEMP/coreav-oracle-bin/mediainfo" \
            --kd-overlay "$RUNNER_TEMP/coreav-isobmff-oracle/known-divergences.json" \
            --report "$RUNNER_TEMP/coreav-text.json"
      # docs/measurements/kd-audit-writers.md: every bug-shaped change to a
      # WebVTT or chapters output must stay visible, never covered by a
      # docs/known-divergences-text.md entry. The other writers' audits take
      # an hour each and run on demand.
      - name: Audit the text known divergences
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 -I tools/oracle/writer_kd_audit_cli.py --oracle text --coreav target/release/coreav \
            --media "$RUNNER_TEMP/coreav-fixtures" --mediainfo "$RUNNER_TEMP/coreav-oracle-bin/mediainfo"
      # Built on main for the cache only: isobmff-writers, isobmff-decode
      # and b9-shard restore this job's Rust cache entry, and isobmff-decode and
      # b9-shard run this build (docs/design/ci-checks.md, "Caches").
      - name: Install libdav1d, libvpx and libopus for the cache
        if: github.ref == 'refs/heads/main'
        run: sudo apt-get update -q && sudo apt-get install -y --no-install-recommends libdav1d-dev libvpx-dev libopus-dev
      - name: Build coreav with the FFmpeg fallback, dav1d and libvpx, and the decode oracle, for the cache
        if: github.ref == 'refs/heads/main'
        run: |
          cargo build --locked --release -p coreav-cli -p coreav-decode-oracle \
            --features coreav-cli/ffmpeg-fallback,coreav-cli/dav1d,coreav-cli/libvpx,coreav-decode-oracle/dav1d,coreav-decode-oracle/libvpx \
            --target-dir target/fallback
          cargo test --no-run --locked --release -p coreav-cli --features ffmpeg-fallback,dav1d,libvpx \
            --test thumbnail --target-dir target/fallback
          cargo test --no-run --locked --release -p coreav-cli --features ffmpeg-fallback,dav1d,libvpx,libopus \
            --test transcode --target-dir target/fallback
      - name: Preserve normalized output and diffs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: oracle-output
          path: |
            ${{ runner.temp }}/coreav-oracle-check
            ${{ runner.temp }}/coreav-oracle-executable
            ${{ runner.temp }}/coreav-isobmff-oracle/known-divergences.json
            ${{ runner.temp }}/coreav-isobmff-oracle/compare.log
            ${{ runner.temp }}/coreav-compat.json
            ${{ runner.temp }}/coreav-compat-commands.json
            ${{ runner.temp }}/coreav-frames.json
            ${{ runner.temp }}/coreav-r1.json
            ${{ runner.temp }}/coreav-r1.sha256
            ${{ runner.temp }}/coreav-extract.json
            ${{ runner.temp }}/coreav-extract-cli.json
            ${{ runner.temp }}/coreav-text.json
          if-no-files-found: ignore


  # The ISO base media fixtures that isobmff-writers, isobmff-decode and
  # b9-shard check, generated once a run so that they all, and every B9
  # shard, check the same bytes: generation is not byte for byte
  # reproducible. Kept between runs under a key of the generator, every
  # file it runs from scripts/, and the FFmpeg install; isobmff-fixtures
  # generates its own on every run (docs/design/ci-checks.md, "The fixture
  # jobs").
  isobmff-fixture-set:
    needs: ci-changes
    if: >-
      needs.ci-changes.outputs.run == 'true' &&
      (github.event_name != 'pull_request' || !github.event.pull_request.draft)
    concurrency:
      group: ${{ github.workflow }}-isobmff-fixture-set-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Key the fixtures by what generates them
        id: key
        run: |
          set -euo pipefail
          helpers=$(grep -o '\$SCRIPTS/[A-Za-z0-9_.-]*' scripts/gen-fixtures.sh | sed 's|^\$SCRIPTS/|scripts/|' | sort -u)
          echo "key=linux-x64-fixtures-$(cat scripts/gen-fixtures.sh scripts/install-oracle-ffmpeg.sh scripts/oracle-ffmpeg.env $helpers | sha256sum | cut -c1-32)" >> "$GITHUB_OUTPUT"
      - name: Restore the fixtures
        id: fixtures
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ runner.temp }}/coreav-fixtures
          key: ${{ steps.key.outputs.key }}
      - name: Cache pinned black-box binaries
        if: steps.fixtures.outputs.cache-hit != 'true'
        id: ffmpeg-cache
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ runner.temp }}/coreav-oracle-bin
          key: linux-x64-oracle-mediainfo-26.10-${{ hashFiles('scripts/oracle-ffmpeg.env', 'scripts/install-oracle-ffmpeg.sh', 'scripts/install-oracle-mediainfo.sh') }}
      - name: Install pinned FFmpeg, ffprobe and MediaInfo
        if: steps.fixtures.outputs.cache-hit != 'true' && steps.ffmpeg-cache.outputs.cache-hit != 'true'
        run: |
          scripts/install-oracle-ffmpeg.sh "$RUNNER_TEMP/coreav-oracle-bin"
          scripts/install-oracle-mediainfo.sh "$RUNNER_TEMP/coreav-oracle-bin"
      - name: Generate all required fixtures
        if: steps.fixtures.outputs.cache-hit != 'true'
        env:
          COREAV_REQUIRE_ALL_FIXTURES: '1'
        run: |
          python3 -I scripts/oracle_pin.py --verify-bin "$RUNNER_TEMP/coreav-oracle-bin"
          export PATH="$RUNNER_TEMP/coreav-oracle-bin:$PATH"
          scripts/gen-fixtures.sh "$RUNNER_TEMP/coreav-fixtures"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: isobmff-fixture-set
          path: ${{ runner.temp }}/coreav-fixtures
          if-no-files-found: error
          retention-days: 1
      - name: Save the fixtures
        if: steps.fixtures.outputs.cache-hit != 'true' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ runner.temp }}/coreav-fixtures
          key: ${{ steps.key.outputs.key }}

  # The writers' oracles of the ISO base media fixtures, beside
  # isobmff-fixtures (docs/design/ci-checks.md, "The fixture jobs").
  isobmff-writers:
    needs: [ci-changes, isobmff-fixture-set]
    if: >-
      needs.ci-changes.outputs.run == 'true' &&
      (github.event_name != 'pull_request' || !github.event.pull_request.draft)
    concurrency:
      group: ${{ github.workflow }}-isobmff-writers-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: isobmff-fixtures
          save-if: false
      - name: Cache pinned black-box binaries
        id: ffmpeg-cache
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ runner.temp }}/coreav-oracle-bin
          key: linux-x64-oracle-mediainfo-26.10-${{ hashFiles('scripts/oracle-ffmpeg.env', 'scripts/install-oracle-ffmpeg.sh', 'scripts/install-oracle-mediainfo.sh') }}
      # MediaInfo is a gating oracle for extracted M4A files only; elsewhere it stays informational.
      - name: Install pinned FFmpeg, ffprobe and MediaInfo
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        run: |
          scripts/install-oracle-ffmpeg.sh "$RUNNER_TEMP/coreav-oracle-bin"
          scripts/install-oracle-mediainfo.sh "$RUNNER_TEMP/coreav-oracle-bin"
      - name: Use pinned binaries
        run: |
          python3 -I scripts/oracle_pin.py --verify-bin "$RUNNER_TEMP/coreav-oracle-bin"
          echo "$RUNNER_TEMP/coreav-oracle-bin" >> "$GITHUB_PATH"
      # The one fixture set of this run (isobmff-fixture-set).
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: isobmff-fixture-set
          path: ${{ runner.temp }}/coreav-fixtures
      # The coreav binary. Every key --ffprobe-compat prints is
      # compared with ffprobe (known divergences from the overlay above apply),
      # native output is validated against docs/schema/probe-v1.schema.json, and
      # the hostile-input suite runs through the binary in both output modes.
      - name: Build the coreav binary
        run: cargo build --locked --release -p coreav-cli
      # Every MP4 and MOV fixture with a video track the clip writer accepts is
      # clipped at five ranges, and every MP4, MOV and M4A fixture without
      # video whose audio is AAC is clipped alone at five. Each output round-trips
      # through coreav-isobmff (samples, times, no missing frame) and is checked
      # against its source with ffprobe (streams, durations, packet hashes),
      # ffmpeg (framemd5 of the video, decoded audio) and MediaInfo, with
      # docs/known-divergences-clip.md applied. Threshold: 100% of the clips.
      - name: Clip the fixtures and check the outputs
        env:
          COREAV_FIXTURES: ${{ runner.temp }}/coreav-fixtures
          COREAV_CLIP_OUT: ${{ runner.temp }}/coreav-clip
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          cargo test --locked --release -p coreav-isobmff-write --test clip fixtures_round_trip -- --ignored
          python3 -I scripts/clip_check.py --manifest "$COREAV_CLIP_OUT/manifest.json" \
            --mediainfo "$RUNNER_TEMP/coreav-oracle-bin/mediainfo" \
            --report "$RUNNER_TEMP/coreav-clip.json"
      # docs/design/remux.md: every MP4, MOV and M4A fixture is remuxed. Each
      # output round-trips through coreav-isobmff (every sample, times, edit
      # list, the movie box first) and is checked against its source with
      # ffprobe (streams, tags), ffmpeg framemd5 of every copied packet and
      # MediaInfo, with docs/known-divergences-remux.md applied. Threshold:
      # 100% of the outputs.
      - name: Remux the fixtures and check the outputs
        env:
          COREAV_FIXTURES: ${{ runner.temp }}/coreav-fixtures
          COREAV_REMUX_OUT: ${{ runner.temp }}/coreav-remux
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          cargo test --locked --release -p coreav-isobmff-write --test remux fixtures_round_trip -- --ignored
          python3 -I scripts/remux_check.py --manifest "$COREAV_REMUX_OUT/manifest.json" \
            --mediainfo "$RUNNER_TEMP/coreav-oracle-bin/mediainfo" \
            --report "$RUNNER_TEMP/coreav-remux.json"
      # docs/design/remux.md, "One video stream replaced": the H.264 video of
      # ten fixtures (and of a Matroska file the pinned ffmpeg makes) replaced
      # by its own samples, then by them decoded two frames earlier, presents
      # the same frames as the plain remux (ffprobe -show_frames) with the
      # same audio packets (-show_packets -show_data_hash). Threshold: 100%.
      - name: Replace the fixtures' video streams and check the outputs
        env:
          COREAV_FIXTURES: ${{ runner.temp }}/coreav-fixtures
        run: cargo test --locked --release -p coreav-isobmff-write --test replace fixtures_present_as_the_plain_remux -- --ignored
      # docs/design/split.md: every MP4 and MOV fixture with a video track the
      # clip writer accepts is split every second and at 0.5 s and 1.3 s. The
      # segments round-trip through coreav-isobmff (every sample of each kept
      # track exactly once, in order, at its source time) and are checked
      # against their source with ffprobe (packet coverage, streams,
      # durations), ffmpeg (framemd5 of the video, decoded audio) and
      # MediaInfo, with docs/known-divergences-split.md applied. Threshold:
      # 100% of the splits.
      - name: Split the fixtures and check the segments
        env:
          COREAV_FIXTURES: ${{ runner.temp }}/coreav-fixtures
          COREAV_SPLIT_OUT: ${{ runner.temp }}/coreav-split
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          cargo test --locked --release -p coreav-isobmff-write --test split fixtures_round_trip -- --ignored
          python3 -I scripts/split_check.py --manifest "$COREAV_SPLIT_OUT/manifest.json" \
            --mediainfo "$RUNNER_TEMP/coreav-oracle-bin/mediainfo" \
            --report "$RUNNER_TEMP/coreav-split.json"
      # docs/design/sanitize.md: every MP4, MOV and M4A fixture is sanitized
      # keeping what it keeps by default. The media checks of the remux, plus:
      # no metadata box in the box tree but the kept ones, no ffprobe tag but the brands and
      # stream basics, no MediaInfo metadata key. Threshold: 100%.
      - name: Sanitize the fixtures and check the outputs
        env:
          COREAV_FIXTURES: ${{ runner.temp }}/coreav-fixtures
          COREAV_SANITIZE_OUT: ${{ runner.temp }}/coreav-sanitize
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          cargo test --locked --release -p coreav-isobmff-write --test remux fixtures_sanitize_round_trip -- --ignored
          python3 -I scripts/remux_check.py --manifest "$COREAV_SANITIZE_OUT/manifest.json" \
            --mediainfo "$RUNNER_TEMP/coreav-oracle-bin/mediainfo" \
            --report "$RUNNER_TEMP/coreav-sanitize.json"
      # docs/design/hls.md: every MP4, MOV and M4A fixture the packager
      # accepts round-trips through coreav-isobmff at targets of 1 s and 6 s,
      # and is checked with ffprobe (streams, packet hashes, the master
      # playlist through the HLS demuxer), ffmpeg (framemd5 of every
      # rendition and of the master playlist), each segment on its own and
      # MediaInfo, with docs/known-divergences-hls.md applied. Threshold: 100%.
      - name: Package the fixtures as HLS and check the outputs
        env:
          COREAV_FIXTURES: ${{ runner.temp }}/coreav-fixtures
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          cargo test --locked --release -p coreav-isobmff-write --test hls fixtures_round_trip -- --ignored
          python3 -I scripts/hls_check.py --coreav target/release/coreav --media "$COREAV_FIXTURES" \
            --mediainfo "$RUNNER_TEMP/coreav-oracle-bin/mediainfo" --master-decode \
            --expect-refused "audio_mp3.mp4,audio_mp3.mov,audio_opus.mp4,edit_multi_*,h264_avc3.mp4,hevc_hev1.mp4,nested_10000.mp4,pcm_*,prores_*,truncated.mp4,size_prores_understated.mov,ambient*.mov,chapter_pictures_src.mov,av_ac3.mp4,av_alac.mp4,av_eac3.mp4,av_flac.mp4,codec_ac3_*,codec_alac*,codec_amr_*,codec_flac*,codec_dv*,codec_eac3_*,codec_h263.*,codec_mjpeg*,codec_mpeg4_color.mp4,codec_png*,codec_qtrle*,codec_vorbis.mp4,entry_stereo_*,matrix_*.mov,movie_matrix_*.mov,nopasp_*,size_hevc_window.mp4,size_hevc_mixed_window.mp4" \
            --report "$RUNNER_TEMP/coreav-hls.json"
      # docs/design/join.md: every fixture with a video track the clip writer
      # accepts is split every second and joined back (which must give back
      # the source), two of its clips are joined, and every pair of fixtures is
      # joined or refused with a mismatch. Each output round-trips through
      # coreav-isobmff and its own edit lists, and is checked with ffprobe
      # (packet coverage, streams), ffmpeg (framemd5 of the video, decoded
      # audio) and MediaInfo, with docs/known-divergences-join.md applied.
      # Threshold: 100% of the joins.
      - name: Join the fixtures and check the outputs
        env:
          COREAV_FIXTURES: ${{ runner.temp }}/coreav-fixtures
          COREAV_JOIN_OUT: ${{ runner.temp }}/coreav-join
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          cargo test --locked --release -p coreav-isobmff-write --test join fixtures_round_trip -- --ignored
          python3 -I scripts/join_check.py --manifest "$COREAV_JOIN_OUT/manifest.json" \
            --mediainfo "$RUNNER_TEMP/coreav-oracle-bin/mediainfo" --ffmpeg-concat \
            --report "$RUNNER_TEMP/coreav-join.json"
      # docs/design/compat-cli.md, "coreav ffmpeg" (R3 on the fixtures):
      # every ffmpeg command of commands-0.1.0 on every fixture it can take,
      # through coreav ffmpeg. Each output must select the streams the pinned
      # ffmpeg selects and pass the oracle of its job, with that oracle's
      # known divergences. Threshold: 100% of the outputs.
      - name: Run the 0.1.0 ffmpeg commands on the fixtures and check the outputs
        env:
          COREAV_FIXTURES: ${{ runner.temp }}/coreav-fixtures
          COREAV_FFMPEG_OUT: ${{ runner.temp }}/coreav-ffmpeg
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          cargo test --locked --release -p coreav-cli --test ffmpeg the_0_1_0_commands_on_the_fixtures -- --ignored
          python3 -I tools/compat-corpus/copy_check.py --records "$COREAV_FFMPEG_OUT/records.json" \
            --mediainfo "$RUNNER_TEMP/coreav-oracle-bin/mediainfo" \
            --report "$RUNNER_TEMP/coreav-ffmpeg.json"
      - name: Preserve the writers' reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: writer-output
          path: |
            ${{ runner.temp }}/coreav-clip.json
            ${{ runner.temp }}/coreav-remux.json
            ${{ runner.temp }}/coreav-split.json
            ${{ runner.temp }}/coreav-sanitize.json
            ${{ runner.temp }}/coreav-hls.json
            ${{ runner.temp }}/coreav-join.json
          if-no-files-found: ignore

  # The decoders, thumbnails and `coreav transcode` on the ISO base media
  # fixtures: the build with the FFmpeg fallback, dav1d and libvpx.
  isobmff-decode:
    needs: [ci-changes, isobmff-fixture-set]
    if: >-
      needs.ci-changes.outputs.run == 'true' &&
      (github.event_name != 'pull_request' || !github.event.pull_request.draft)
    concurrency:
      group: ${{ github.workflow }}-isobmff-decode-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: isobmff-fixtures
          save-if: false
      - name: Cache pinned black-box binaries
        id: ffmpeg-cache
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ runner.temp }}/coreav-oracle-bin
          key: linux-x64-oracle-mediainfo-26.10-${{ hashFiles('scripts/oracle-ffmpeg.env', 'scripts/install-oracle-ffmpeg.sh', 'scripts/install-oracle-mediainfo.sh') }}
      # MediaInfo is a gating oracle for extracted M4A files only; elsewhere it stays informational.
      - name: Install pinned FFmpeg, ffprobe and MediaInfo
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        run: |
          scripts/install-oracle-ffmpeg.sh "$RUNNER_TEMP/coreav-oracle-bin"
          scripts/install-oracle-mediainfo.sh "$RUNNER_TEMP/coreav-oracle-bin"
      - name: Use pinned binaries
        run: |
          python3 -I scripts/oracle_pin.py --verify-bin "$RUNNER_TEMP/coreav-oracle-bin"
          echo "$RUNNER_TEMP/coreav-oracle-bin" >> "$GITHUB_PATH"
      # The one fixture set of this run (isobmff-fixture-set).
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: isobmff-fixture-set
          path: ${{ runner.temp }}/coreav-fixtures
      # docs/design/decode.md and docs/design/thumbnails.md: the sandboxed
      # FFmpeg fallback (a non-default feature) and thumbnails. Bars on the
      # fixtures: every frame of every allowlisted video fixture equal to
      # FFmpeg's framemd5 through CoreAV's decoder, every thumbnail at least
      # 30 dB against FFmpeg's of the same frame and size (gross errors; the
      # corpus bars are in docs/design/thumbnails.md); the hostile suite
      # and flipped-byte copies of the fixtures through `coreav thumbnail`
      # with no crash, signal, hang or out-of-memory.
      # dav1d for AV1 (docs/design/decode.md, "dav1d") links the system's
      # libdav1d; the pinned FFmpeg's libdav1d is the reference. libvpx for
      # VP8 and VP9 ("libvpx") links the system's libvpx; the pinned FFmpeg's
      # own VP8 and VP9 decoders are the reference. libopus is the Opus
      # encoder of `coreav transcode --audio opus` (docs/design/transcode.md,
      # "Opus audio"), tested with the transcode suite below.
      - name: Install libdav1d, libvpx and libopus
        run: sudo apt-get update -q && sudo apt-get install -y --no-install-recommends libdav1d-dev libvpx-dev libopus-dev
      - name: Build coreav with the FFmpeg fallback, dav1d and libvpx, and the decode oracle
        run: |
          cargo build --locked --release -p coreav-cli -p coreav-decode-oracle \
            --features coreav-cli/ffmpeg-fallback,coreav-cli/dav1d,coreav-cli/libvpx,coreav-decode-oracle/dav1d,coreav-decode-oracle/libvpx \
            --target-dir target/fallback
      - name: Decode boundary and thumbnail tests against the pinned FFmpeg
        run: |
          set -euo pipefail
          cargo test --locked --release -p coreav-backend-ffmpeg --test decode -- --ignored
          cargo test --locked --release -p coreav-backend-h264 --test decode -- --ignored
          # The memory budget bounds the decoder's allocation on every thread
          # (docs/design/limits.md, bar 5); --nocapture puts the numbers in the log.
          cargo test --locked --release -p coreav-backend-h264 --test memory -- --ignored --nocapture
          cargo test --locked --release -p coreav-worker --features ffmpeg --test ffmpeg -- --ignored
          cargo test --locked --release -p coreav-backend-dav1d --features dav1d --test decode \
            -- --include-ignored
          cargo test --locked --release -p coreav-backend-libvpx --features libvpx --test decode \
            -- --include-ignored
          cargo test --locked --release -p coreav-cli --features ffmpeg-fallback,dav1d,libvpx --test thumbnail \
            --target-dir target/fallback -- --include-ignored
      # docs/design/transcode.md: the Annex B reader on the pinned FFmpeg's
      # libx264 output (and an x264 program's, when the runner has one),
      # checked by FFmpeg decoding every prefix of the samples. A missing
      # ffmpeg fails here instead of skipping.
      - name: The transcode Annex B reader against the pinned FFmpeg
        env:
          COREAV_REQUIRE_FFMPEG: '1'
        run: cargo test --locked --release -p coreav-transcode --test encoders
      # The FFmpeg-compatible Y'CbCr resize against the pinned FFmpeg's
      # `scale` (docs/design/thumbnails.md, "Y'CbCr to Y'CbCr"), on
      # generated pictures and size_vp9_resize.mp4; a missing ffmpeg or
      # fixture fails here instead of skipping.
      - name: The Y'CbCr resize against FFmpeg's scale
        env:
          COREAV_REQUIRE_FFMPEG: '1'
          COREAV_FIXTURES: ${{ runner.temp }}/coreav-fixtures
        run: cargo test --locked --release -p coreav-frame --test ffmpeg_scale
      # `coreav transcode` end to end (docs/design/transcode.md): the
      # fixtures with both encoders (the pinned FFmpeg's libx264 and an x264
      # program built from the same commit, its source deleted after the
      # build), checked against ffprobe of the source and FFmpeg's own
      # encode, hostile encoder scripts, and Opus audio from sources the
      # pinned FFmpeg makes. A missing program or fixture
      # fails here instead of skipping.
      - name: Cache the x264 program
        id: x264-cache
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ runner.temp }}/coreav-x264
          key: linux-x64-x264-${{ hashFiles('scripts/oracle-ffmpeg.env', 'scripts/install-x264.sh') }}
      - name: Build x264
        if: steps.x264-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get install -y --no-install-recommends nasm
          scripts/install-x264.sh "$RUNNER_TEMP/coreav-x264"
      - name: coreav transcode on the fixtures, with both encoders
        env:
          COREAV_REQUIRE_FFMPEG: '1'
          COREAV_FFMPEG: ${{ runner.temp }}/coreav-oracle-bin/ffmpeg
          COREAV_X264: ${{ runner.temp }}/coreav-x264/x264
          COREAV_FIXTURES: ${{ runner.temp }}/coreav-fixtures
        run: |
          cargo test --locked --release -p coreav-cli --features ffmpeg-fallback,dav1d,libvpx,libopus --test transcode \
            --target-dir target/fallback
          # The Opus encode passes over AAC in a build that decodes it.
          cargo test --locked --release -p coreav-cli --features ffmpeg-fallback,libopus,aac --test transcode \
            --target-dir target/fallback -- opus_encode
      - name: Frames and thumbnails of the fixtures against FFmpeg
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 -I scripts/thumbnail_oracle.py --coreav target/fallback/release/coreav \
            --decode-oracle target/fallback/release/decode-oracle \
            --fixtures "$RUNNER_TEMP/coreav-fixtures" --report "$RUNNER_TEMP/coreav-thumbnail-oracle.json"
          python3 -I scripts/thumbnail_oracle.py --coreav target/fallback/release/coreav \
            --decode-oracle target/fallback/release/decode-oracle --backend dav1d \
            --fixtures "$RUNNER_TEMP/coreav-fixtures" --report "$RUNNER_TEMP/coreav-thumbnail-oracle-dav1d.json"
          python3 -I scripts/thumbnail_oracle.py --coreav target/fallback/release/coreav \
            --decode-oracle target/fallback/release/decode-oracle --backend libvpx \
            --fixtures "$RUNNER_TEMP/coreav-fixtures" --report "$RUNNER_TEMP/coreav-thumbnail-oracle-libvpx.json"
      # docs/design/thumbnails.md, "Frames nothing depends on": --exact gives
      # the same image whether disposable packets are skipped or not.
      - name: Exact thumbnails with skipped packets against decoding every packet
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 -I scripts/exact_skip_check.py --decode-oracle target/fallback/release/decode-oracle \
            --times 4 --matroska --fixtures "$RUNNER_TEMP/coreav-fixtures"
      # docs/design/seek.md: a thumbnail planned from a window of the packets
      # decodes what one planned from every packet decodes (bar 1), and
      # packets_from(i) lists what packets() lists after i packets (bar 2).
      - name: Thumbnails planned from a window against planned from every packet
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          COREAV_FIXTURES: ${{ runner.temp }}/coreav-fixtures
        run: |
          python3 -I scripts/seek_check.py --decode-oracle target/fallback/release/decode-oracle \
            --times 64 --fixtures "$RUNNER_TEMP/coreav-fixtures"
          cargo test --locked --release -p coreav-isobmff --test seek
      - name: Generate the hostile-input suite
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 -I tools/hostile/generate.py "$RUNNER_TEMP/coreav-hostile" "$RUNNER_TEMP/coreav-fixtures" ffmpeg
      - name: The hostile-input suite through coreav thumbnail
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 -I scripts/cli_hostile_check.py --coreav target/fallback/release/coreav \
            --suite "$RUNNER_TEMP/coreav-hostile" --thumbnail --mutate "$RUNNER_TEMP/coreav-fixtures"
      # docs/design/transcode.md, bar B6: every hostile file, and flipped-byte
      # copies of the fixtures, through `coreav transcode` with the x264
      # program: an output or an error object, nothing left behind.
      - name: The hostile-input suite through coreav transcode
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 -I scripts/cli_hostile_check.py --coreav target/fallback/release/coreav \
            --suite "$RUNNER_TEMP/coreav-hostile" --mutate "$RUNNER_TEMP/coreav-fixtures" \
            --transcode "--encoder x264 --x264 $RUNNER_TEMP/coreav-x264/x264"

  # Bar B9, the longest check of the fixtures: each command line encodes
  # every fixture three times, one line scaling it to 1920 columns. A third
  # of the fixtures a job; `b9` judges the bars once over all three
  # (docs/design/ci-checks.md, "The fixture jobs").
  b9-shard:
    needs: [ci-changes, isobmff-fixture-set]
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    if: >-
      needs.ci-changes.outputs.run == 'true' &&
      (github.event_name != 'pull_request' || !github.event.pull_request.draft)
    concurrency:
      group: ${{ github.workflow }}-b9-shard-${{ strategy.job-index }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: isobmff-fixtures
          save-if: false
      - name: Cache pinned black-box binaries
        id: ffmpeg-cache
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ runner.temp }}/coreav-oracle-bin
          key: linux-x64-oracle-mediainfo-26.10-${{ hashFiles('scripts/oracle-ffmpeg.env', 'scripts/install-oracle-ffmpeg.sh', 'scripts/install-oracle-mediainfo.sh') }}
      # MediaInfo is a gating oracle for extracted M4A files only; elsewhere it stays informational.
      - name: Install pinned FFmpeg, ffprobe and MediaInfo
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        run: |
          scripts/install-oracle-ffmpeg.sh "$RUNNER_TEMP/coreav-oracle-bin"
          scripts/install-oracle-mediainfo.sh "$RUNNER_TEMP/coreav-oracle-bin"
      - name: Use pinned binaries
        run: |
          python3 -I scripts/oracle_pin.py --verify-bin "$RUNNER_TEMP/coreav-oracle-bin"
          echo "$RUNNER_TEMP/coreav-oracle-bin" >> "$GITHUB_PATH"
      # The one fixture set of this run (isobmff-fixture-set).
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: isobmff-fixture-set
          path: ${{ runner.temp }}/coreav-fixtures
      # The same build as isobmff-decode's.
      - name: Install libdav1d and libvpx
        run: sudo apt-get update -q && sudo apt-get install -y --no-install-recommends libdav1d-dev libvpx-dev
      - name: Build coreav with the FFmpeg fallback, dav1d and libvpx, and the decode oracle
        run: |
          cargo build --locked --release -p coreav-cli -p coreav-decode-oracle \
            --features coreav-cli/ffmpeg-fallback,coreav-cli/dav1d,coreav-cli/libvpx,coreav-decode-oracle/dav1d,coreav-decode-oracle/libvpx \
            --target-dir target/fallback
      - name: Cache the x264 program
        id: x264-cache
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ runner.temp }}/coreav-x264
          key: linux-x64-x264-${{ hashFiles('scripts/oracle-ffmpeg.env', 'scripts/install-x264.sh') }}
      - name: Build x264
        if: steps.x264-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get install -y --no-install-recommends nasm
          scripts/install-x264.sh "$RUNNER_TEMP/coreav-x264"
      # docs/design/transcode.md, bar B9: the coreav ffmpeg command lines that
      # encode with libx264, on the fixtures, each arm against FFmpeg running
      # the same command line. The ffmpeg arm names no x264 program, so the
      # pipeline falls back to the pinned FFmpeg's libx264.
      - name: coreav ffmpeg with libx264 on a third of the fixtures (B9)
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          SHARD: ${{ matrix.shard }}
        run: |
          python3 -I scripts/transcode_check.py --compat --coreav target/fallback/release/coreav \
            --ffmpeg "$RUNNER_TEMP/coreav-oracle-bin/ffmpeg" --ffprobe "$RUNNER_TEMP/coreav-oracle-bin/ffprobe" \
            --preflight "$RUNNER_TEMP/coreav-fixtures/basic.mp4" --fixtures "$RUNNER_TEMP/coreav-fixtures" \
            --arm "x264=COREAV_X264=$RUNNER_TEMP/coreav-x264/x264" --arm ffmpeg=COREAV_X264=none \
            --jobs 4 --shard "$SHARD/3" --out "$RUNNER_TEMP/coreav-b9"
      - name: Keep the shard's evidence for b9
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: b9-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/coreav-b9/evidence
          retention-days: 1

  # B9's bars over the three shards' results, judged as one run judges
  # them (scripts/transcode_check.py --merge).
  b9:
    needs: [ci-changes, b9-shard]
    if: >-
      needs.ci-changes.outputs.run == 'true' &&
      (github.event_name != 'pull_request' || !github.event.pull_request.draft)
    concurrency:
      group: ${{ github.workflow }}-b9-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Cache the pinned oracle
        id: ffmpeg-cache
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ runner.temp }}/coreav-oracle-bin
          key: linux-x64-oracle-mediainfo-26.10-${{ hashFiles('scripts/oracle-ffmpeg.env', 'scripts/install-oracle-ffmpeg.sh', 'scripts/install-oracle-mediainfo.sh') }}
      - name: Install the pinned oracle
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        run: |
          scripts/install-oracle-ffmpeg.sh "$RUNNER_TEMP/coreav-oracle-bin"
          scripts/install-oracle-mediainfo.sh "$RUNNER_TEMP/coreav-oracle-bin"
      - name: Use pinned binaries
        run: |
          python3 -I scripts/oracle_pin.py --verify-bin "$RUNNER_TEMP/coreav-oracle-bin"
          echo "$RUNNER_TEMP/coreav-oracle-bin" >> "$GITHUB_PATH"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: b9-shard-*
          path: ${{ runner.temp }}/b9-shards
      - name: Judge B9 over every shard
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 -I scripts/transcode_check.py --out "$RUNNER_TEMP/coreav-b9" --merge \
            "$RUNNER_TEMP/b9-shards/b9-shard-1" "$RUNNER_TEMP/b9-shards/b9-shard-2" "$RUNNER_TEMP/b9-shards/b9-shard-3"
      - name: Check that B9 judged the pinned oracle
        run: |
          python3 -I - <<'PY'
          import hashlib
          import json
          import os
          import pathlib
          import subprocess
          root = pathlib.Path(os.environ['RUNNER_TEMP'])
          run = json.loads((root / 'coreav-b9/run.json').read_text())
          tools = run['tools'] if isinstance(run['tools'], list) else [run['tools']]
          for name in ('ffmpeg', 'ffprobe'):
              binary = root / 'coreav-oracle-bin' / name
              digest = hashlib.sha256(binary.read_bytes()).hexdigest()
              if not tools or any(t[name]['sha256'] != digest for t in tools):
                  raise SystemExit(f'B9 did not use the pinned {name}')
          version = subprocess.check_output([str(root / 'coreav-oracle-bin/ffmpeg'), '-version']).decode().splitlines()[:1]
          if run['ffmpeg_version'] != version:
              raise SystemExit('B9 did not record the pinned FFmpeg version')
          PY
      - name: Preserve the B9 evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: b9-evidence
          path: ${{ runner.temp }}/coreav-b9/evidence
          if-no-files-found: ignore
  # docs/design/mkv.md: the Matroska and WebM fixtures through coreav-mkv and
  # the coreav binary, against the pinned ffprobe on every change (100% after
  # the documented divergences of docs/known-divergences-mkv.md), and against
  # MediaInfo as the informational second oracle; and every
  # fixture remuxed to MP4 (docs/design/mkv-remux.md).
  # It follows ci-changes' `run`.
  mkv-fixtures:
    # Draft PRs skip it (workflow_dispatch still runs it on demand).
    needs: ci-changes
    if: >-
      needs.ci-changes.outputs.run == 'true' &&
      (github.event_name != 'pull_request' || !github.event.pull_request.draft)
    concurrency:
      group: ${{ github.workflow }}-mkv-fixtures-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # isobmff-fixtures' cache, restored only: that job builds every
          # crate and feature this one does, and one entry instead of three
          # keeps the repository's caches under GitHub's limit
          # (docs/design/ci-checks.md, "Caches").
          shared-key: isobmff-fixtures
          save-if: false
      - name: Cache pinned black-box binaries
        id: bin-cache
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ runner.temp }}/coreav-oracle-bin
          key: linux-x64-oracle-mediainfo-26.10-${{ hashFiles('scripts/oracle-ffmpeg.env', 'scripts/install-oracle-ffmpeg.sh', 'scripts/install-oracle-mediainfo.sh') }}
      - name: Install pinned FFmpeg, ffprobe and MediaInfo
        if: steps.bin-cache.outputs.cache-hit != 'true'
        run: |
          scripts/install-oracle-ffmpeg.sh "$RUNNER_TEMP/coreav-oracle-bin"
          scripts/install-oracle-mediainfo.sh "$RUNNER_TEMP/coreav-oracle-bin"
      - name: Use pinned binaries
        run: |
          python3 -I scripts/oracle_pin.py --verify-bin "$RUNNER_TEMP/coreav-oracle-bin"
          echo "$RUNNER_TEMP/coreav-oracle-bin" >> "$GITHUB_PATH"
      # Generated on every run; required fixtures cannot be skipped.
      - name: Generate the Matroska fixtures
        env:
          COREAV_REQUIRE_ALL_FIXTURES: '1'
          PYTHONDONTWRITEBYTECODE: '1'
        run: scripts/gen-fixtures-mkv.sh "$RUNNER_TEMP/mkv-fixtures"
      - name: Test the known-divergence predicates
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 -m unittest tools/oracle/tests/test_kd_mkv.py
      - name: Build the comparator, the adapter and the coreav binary
        run: cargo build --locked --release -p coreav-oracle -p coreav-mkv-adapter -p coreav-isobmff-adapter -p coreav-cli
      - name: Compare coreav-mkv with ffprobe
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/mkv-oracle"
          scripts/oracle-capture.sh --media "$RUNNER_TEMP/mkv-fixtures" --out "$OUT/reference" --levels streams,packets
          scripts/oracle-capture.sh --media "$RUNNER_TEMP/mkv-fixtures" --out "$OUT/candidate" \
            --adapter target/release/mkv-adapter --levels streams,packets
          status=0
          target/release/coreav-oracle compare --reference "$OUT/reference" --candidate "$OUT/candidate" \
            --levels streams,packets --profile fixtures --max-diffs 1000000 --report "$OUT/report.json" \
            > "$OUT/compare.log" || status=$?
          # 1 means "not 100% before known divergences"; anything else is a harness error.
          [ "$status" -le 1 ]
          python3 -I scripts/oracle_kd_mkv.py --report "$OUT/report.json" --reference "$OUT/reference" \
            --candidate "$OUT/candidate" --out "$OUT/known-divergences.json" \
            --media "$RUNNER_TEMP/mkv-fixtures"
      - name: Compare coreav probe --ffprobe-compat with ffprobe
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 -I scripts/compat_check.py --coreav target/release/coreav \
            --media "$RUNNER_TEMP/mkv-fixtures" --report "$RUNNER_TEMP/mkv-compat.json" \
            --kd-overlay "$RUNNER_TEMP/mkv-oracle/known-divergences.json"
      # docs/design/compat-cli.md (B1, B2 and B3a on the fixtures, B6):
      # every ffprobe command of the coverage set through `coreav ffprobe`
      # on every fixture, against the pinned ffprobe, and every refusal; a
      # failure the committed baseline does not list fails the run.
      - name: Run the command-coverage set through coreav ffprobe
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 -I tools/compat-corpus/run.py commands --coreav target/release/coreav \
            --media "$RUNNER_TEMP/mkv-fixtures" --baseline tools/compat-corpus/baseline-matroska.json \
            --report "$RUNNER_TEMP/mkv-compat-commands.json"
      - name: List frames through coreav ffprobe
        run: |
          cargo build --locked --release -p coreav-cli --features native-h264 --target-dir target/native
          python3 -I tools/compat-corpus/frames.py --coreav target/native/release/coreav \
            --media "$RUNNER_TEMP/mkv-fixtures" --native-h264 \
            --baseline tools/compat-corpus/baseline-frames.json --report "$RUNNER_TEMP/mkv-frames.json"
      # R1 of the 0.1.0 round (docs/measurements/compat-0.1.0/README.md): the
      # 0.1.0 ffprobe commands on these fixtures, with no baseline. The round
      # reads its verdict from the job summary; a miss or a void run does not
      # fail the job, so that a change of the oracle's output (FFmpeg 9 prints
      # keys 7.0.2 did not) is reported here rather than blocking unrelated
      # pull requests. A run that measured nothing fails it.
      - name: R1 of the 0.1.0 round
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          cargo build --locked --profile dist -p coreav-cli
          sha256sum target/dist/coreav > "$RUNNER_TEMP/mkv-r1.sha256"
          code=0
          python3 -I tools/compat-corpus/run.py commands --set 0.1.0 --coreav target/dist/coreav \
            --media "$RUNNER_TEMP/mkv-fixtures" --report "$RUNNER_TEMP/mkv-r1.json" > "$RUNNER_TEMP/mkv-r1.txt" || code=$?
          case "$code" in 0) verdict=met ;; 1) verdict=missed ;; 2) verdict=void ;; *) verdict="not measured (exit $code)" ;; esac
          [ -s "$RUNNER_TEMP/mkv-r1.json" ] || { verdict='not measured (no report)'; code=3; }
          { echo "### R1 of the 0.1.0 round, Matroska and WebM fixtures: $verdict"; echo '```'; cat "$RUNNER_TEMP/mkv-r1.sha256"; tail -n 15 "$RUNNER_TEMP/mkv-r1.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          [ "$code" -le 2 ]
      - name: Check the coreav binary against the library adapter
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/mkv-oracle"
          scripts/oracle-capture.sh --media "$RUNNER_TEMP/mkv-fixtures" --out "$OUT/cli" \
            --adapter scripts/oracle-coreav-cli.sh --levels streams
          scripts/oracle-capture.sh --media "$RUNNER_TEMP/mkv-fixtures" --out "$OUT/library" \
            --adapter scripts/oracle-library-adapter.sh --levels streams
          target/release/coreav-oracle compare --reference "$OUT/library" --candidate "$OUT/cli" \
            --levels streams --profile fixtures --max-diffs 1000000 --report "$OUT/cli-report.json"
      - name: Validate coreav probe and remux output against the schemas
        env:
          COREAV_FIXTURES: ${{ runner.temp }}/mkv-fixtures
        # The probe and remux outputs; clips take MP4 sources only.
        run: cargo test --locked -p coreav-cli --test cli -- --ignored fixtures_match_the_schema fixture_remuxes_match_the_schema
      - name: Remux every fixture to MP4 and check it with ffprobe, ffmpeg and MediaInfo
        # docs/design/mkv-remux.md: 100% of the remuxed fixtures, and exactly
        # the expected refusals.
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 -I scripts/mkv_remux_check.py fixtures --coreav target/release/coreav \
            --media "$RUNNER_TEMP/mkv-fixtures" --out "$RUNNER_TEMP/mkv-remux" --mediainfo mediainfo
      # docs/design/compat-cli.md, "coreav ffmpeg" (R3 on the fixtures): the
      # ffmpeg commands of commands-0.1.0 that read Matroska and WebM, on
      # every fixture they can take. Threshold: 100% of the outputs.
      - name: Run the 0.1.0 ffmpeg commands on the fixtures and check the outputs
        env:
          COREAV_FIXTURES: ${{ runner.temp }}/mkv-fixtures
          COREAV_FFMPEG_OUT: ${{ runner.temp }}/mkv-ffmpeg
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          cargo test --locked --release -p coreav-cli --test ffmpeg the_0_1_0_commands_on_the_fixtures -- --ignored
          python3 -I tools/compat-corpus/copy_check.py --records "$COREAV_FFMPEG_OUT/records.json" \
            --mediainfo mediainfo --report "$RUNNER_TEMP/mkv-ffmpeg.json"
      # docs/design/remux.md, "Audio sample entries": FLAC, ALAC, AC-3 and
      # E-AC-3 copied into MP4 by remux, clip, split, join and coreav ffmpeg
      # (-c copy, -f concat) from sources the pinned oracle FFmpeg makes
      # (scripts/oracle-ffmpeg.env). ffprobe reads each output's
      # codec, channels and sample rate as the source's, every packet is the
      # source's, and a copy of the whole file decodes to the source's audio.
      # Threshold: 100% of the cases.
      - name: Copy FLAC, ALAC, AC-3 and E-AC-3 into MP4 and check with the pinned FFmpeg
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 -I scripts/audio_copy_check.py --coreav target/release/coreav \
            --work "$RUNNER_TEMP/audio-copy" --report "$RUNNER_TEMP/audio-copy.json"
      # docs/design/policy-matroska.md: `coreav check` with the example
      # policies and the tight test policy on every Matroska fixture: no
      # crash, the same bytes twice, the reasons of scripts/policy_ref.py
      # over the probe output, each reason's value at its path, and the
      # verdict ffprobe's output implies (with the predicate-checked entries
      # of docs/known-divergences-policy.md); the headers that understate
      # sizes and durations are rejected. Threshold: 100% of cases.
      - name: Check coreav check on the Matroska fixtures
        env:
          COREAV_FIXTURES: ${{ runner.temp }}/mkv-fixtures
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          cargo test --locked -p coreav-cli --test check -- --ignored \
            fixtures_give_valid_verdicts matroska_understatements_are_rejected
          policies=(--policy scripts/policy_fixtures.json)
          for p in docs/schema/policy-examples/*.json; do policies+=(--policy "$p"); done
          python3 -I scripts/policy_check.py --coreav target/release/coreav "${policies[@]}" \
            --media "$COREAV_FIXTURES" --ffprobe ffprobe --oracle-frames \
            --report "$RUNNER_TEMP/mkv-policy-fixtures.json"
      - name: Three-way stream report with MediaInfo (informational, never gates)
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          OUT="$RUNNER_TEMP/mkv-oracle"
          python3 -I tools/mediainfo-oracle/mediainfo_oracle.py capture \
            --media "$RUNNER_TEMP/mkv-fixtures" --out "$OUT/mediainfo"
          python3 -I tools/mediainfo-oracle/mediainfo_oracle.py report \
            --ffprobe "$OUT/reference" --coreav "$OUT/candidate" --mediainfo "$OUT/mediainfo" \
            --out "$OUT/three-way.json" --markdown "$OUT/three-way.md" \
            --title 'Three-way stream report on the Matroska fixtures' || true
          cat "$OUT/three-way.md" >> "$GITHUB_STEP_SUMMARY" || true
      - name: Preserve normalized output and diffs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mkv-oracle-output
          path: |
            ${{ runner.temp }}/mkv-oracle/known-divergences.json
            ${{ runner.temp }}/mkv-oracle/compare.log
            ${{ runner.temp }}/mkv-oracle/three-way.md
            ${{ runner.temp }}/mkv-compat.json
            ${{ runner.temp }}/mkv-compat-commands.json
            ${{ runner.temp }}/mkv-frames.json
            ${{ runner.temp }}/mkv-r1.json
            ${{ runner.temp }}/mkv-r1.sha256
            ${{ runner.temp }}/mkv-policy-fixtures.json
            ${{ runner.temp }}/audio-copy.json
          if-no-files-found: ignore

  # docs/design/mpegts.md: the transport stream fixtures through
  # coreav-mpegts and the coreav binary, against the pinned ffprobe on every
  # change (100% after the documented divergences of
  # docs/known-divergences-ts.md), the binary against the library adapter and
  # against the schema, and the transport stream hostile cases.
  # It follows ci-changes' `run`.
  ts-fixtures:
    # Draft PRs skip it (workflow_dispatch still runs it on demand).
    needs: ci-changes
