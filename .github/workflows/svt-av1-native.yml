name: svt-av1-native

# workflow-check: not required

on:
  push:
    branches: [main]
    paths:
      - scripts/encoders/svt-av1/**
      - crates/coreav-backend-svt-av1/**
      - Cargo.toml
      - Cargo.lock
      - scripts/tests/test_svt_native_workflow.py
      - scripts/svt_av1_licenses.py
      - scripts/svt-av1-notices.json
      - scripts/svt_av1_rust_link.py
      - scripts/tests/test_svt_av1_rust_link.py
      - scripts/rust-dist.env
      - scripts/tests/test_svt_av1_licenses.py
      - scripts/tests/fixtures/svt-av1-notices/**
      - .github/workflows/svt-av1-native.yml
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - scripts/encoders/svt-av1/**
      - crates/coreav-backend-svt-av1/**
      - Cargo.toml
      - Cargo.lock
      - scripts/tests/test_svt_native_workflow.py
      - scripts/svt_av1_licenses.py
      - scripts/svt-av1-notices.json
      - scripts/svt_av1_rust_link.py
      - scripts/tests/test_svt_av1_rust_link.py
      - scripts/rust-dist.env
      - scripts/tests/test_svt_av1_licenses.py
      - scripts/tests/fixtures/svt-av1-notices/**
      - .github/workflows/svt-av1-native.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  svt-native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-24.04
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
          - target: x86_64-apple-darwin
            os: macos-15-intel
          - target: aarch64-apple-darwin
            os: macos-15
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install Linux build tools
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y cmake make musl-tools g++ binutils
          if [[ "$TARGET" == x86_64-* ]]; then
            sudo apt-get install -y nasm
          fi
      - name: Install macOS build tools
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          brew install cmake
          if [[ "$TARGET" == x86_64-* ]]; then
            brew install nasm
          fi
      - name: Read the distribution Rust pin
        id: rust
        shell: bash
        run: |
          set -euo pipefail
          . scripts/rust-dist.env
          echo "version=$RUST_DIST_TOOLCHAIN" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: ${{ steps.rust.outputs.version }}
          targets: ${{ matrix.target }}
      - name: Build and verify the native static library
        id: native-build
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/svt-native-logs"
          python3 -m unittest discover -s scripts/encoders/svt-av1 -p 'test_*.py' 2>&1 | tee "$RUNNER_TEMP/svt-native-logs/tests.log"
          python3 scripts/encoders/svt-av1/build.py --target "$TARGET" --prefix "$RUNNER_TEMP/svt-av1" --jobs 2 2>&1 | tee "$RUNNER_TEMP/svt-native-logs/build.log"
          "$RUNNER_TEMP/svt-av1/bin/svt-av1-version" 2>&1 | tee "$RUNNER_TEMP/svt-native-logs/version.log"
      - name: Check the scoped native licence and notices
        id: native-licenses
        shell: bash
        run: |
          set -euo pipefail
          python3 -I -m unittest discover -s scripts/tests -p 'test_svt_av1_licenses.py' 2>&1 | tee "$RUNNER_TEMP/svt-native-logs/license-tests.log"
          python3 -I scripts/svt_av1_licenses.py --target "$TARGET" --prefix "$RUNNER_TEMP/svt-av1" 2>&1 | tee "$RUNNER_TEMP/svt-native-logs/licenses.log"
      - name: Verify the rooted Rust static link
        id: rust-link
        shell: bash
        run: |
          set -euo pipefail
          python3 -I -m unittest discover -s scripts/tests -p 'test_svt_av1_rust_link.py' 2>&1 | tee "$RUNNER_TEMP/svt-native-logs/rust-link-tests.log"
          python3 -I scripts/svt_av1_rust_link.py --target "$TARGET" --prefix "$RUNNER_TEMP/svt-av1" --output "$RUNNER_TEMP/svt-rust-link" 2>&1 | tee "$RUNNER_TEMP/svt-native-logs/rust-link.log"
      - name: Test the native Rust backend
        shell: bash
        run: |
          set -euo pipefail
          compiler=clang
          [[ "$TARGET" == *-linux-musl ]] && compiler=musl-gcc
          key="CARGO_TARGET_$(printf '%s' "$TARGET" | tr '[:lower:]-' '[:upper:]_')_LINKER"
          export "$key=$compiler"
          export SVT_AV1_PREFIX="$RUNNER_TEMP/svt-av1"
          . scripts/rust-dist.env
          cargo +"$RUST_DIST_TOOLCHAIN" test --locked -p coreav-backend-svt-av1 --features native --target "$TARGET"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: svt-native-${{ matrix.target }}
          path: |
            ${{ runner.temp }}/svt-av1/manifest.json
            ${{ runner.temp }}/svt-av1/include/svt-av1/*.h
            ${{ runner.temp }}/svt-rust-link/manifest.json
            ${{ runner.temp }}/svt-native-logs/*.log
          if-no-files-found: warn
          retention-days: 7
