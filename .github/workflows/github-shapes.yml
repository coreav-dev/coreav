name: github-shapes-premise-only
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  count:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 43742ab7fed01adfc8713b39497a0bd5cebd89b9
          persist-credentials: false
      - name: Build existing diagnostic and install pinned oracle
        run: |
          set -eu
          cargo build --locked --release -p coreav-aac --features diagnostics --example pns_diagnostic
          scripts/install-oracle-ffmpeg.sh "$RUNNER_TEMP/oracle"
      - name: Fetch and bind retained fixture
        env:
          R2_ENDPOINT: ${{ secrets.COREAV_CORPUS_R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.COREAV_CORPUS_R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.COREAV_CORPUS_R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ vars.COREAV_CORPUS_R2_BUCKET }}
        run: |
          set -eu
          if ! python3 - 2>"$RUNNER_TEMP/fetch-error" <<'PY'
          import hashlib, io, json, os, pathlib, stat, sys, zipfile
          sys.path.insert(0, 'tools/compat-corpus')
          import round_files
          key = 'evidence/github-shapes-200/2026-11-06-521a0d39/evidence.zip'
          pool = round_files.pool()
          try:
              size, etag = pool.head(key)
              if not 0 < size <= 512 * 1024 * 1024:
                  raise ValueError('archive size limit')
              data = pool.get(key, size, etag)
          finally:
              pool.close()
          if len(data) != size:
              raise ValueError('archive size mismatch')
          if hashlib.sha256(data).hexdigest() != 'fd24199f8df0c24f743e2217c80527ce4591a734aa3330b92119ab2e65797ddd':
              raise ValueError('retained archive differs from original Actions artifact')
          with zipfile.ZipFile(io.BytesIO(data)) as archive:
              entries = archive.infolist()
              files = [entry for entry in entries if entry.filename.endswith('/fixtures/source.mp4') or entry.filename == 'fixtures/source.mp4']
              if len(files) != 1:
                  raise ValueError('fixture identity is not unique')
              fixture = files[0]
              prefix = fixture.filename[:-len('fixtures/source.mp4')]
              manifests = [entry for entry in entries if entry.filename == prefix + 'manifest.json']
              if len(manifests) != 1 or manifests[0].file_size > 8 * 1024 * 1024:
                  raise ValueError('manifest identity or size')
              if not 0 < fixture.file_size <= 128 * 1024 * 1024 or stat.S_ISLNK(fixture.external_attr >> 16):
                  raise ValueError('fixture type or size')
              manifest = json.loads(archive.read(manifests[0]))
              if manifest['commit'] != '521a0d396c670294bf79a674c42aedbee1776db3':
                  raise ValueError('retained commit mismatch')
              expected = manifest['inventory']['fixtures/source.mp4']
              if expected != '2240cb1e506d918dc3e575177b2a59d49afac0d08e26e345192ef07b0e2ccff5':
                  raise ValueError('fixture differs from the committed manifest')
              content = archive.read(fixture)
              if hashlib.sha256(content).hexdigest() != expected:
                  raise ValueError('fixture digest mismatch')
              pathlib.Path(os.environ['RUNNER_TEMP'], 'source.mp4').write_bytes(content)
          PY
          then
            echo 'Retained archive fetch or integrity validation failed.' >&2
            exit 1
          fi
      - name: Count packets and PNS bands
        run: |
          set -eu
          mkdir "$RUNNER_TEMP/diagnostic"
          target/release/examples/pns_diagnostic "$RUNNER_TEMP/source.mp4" "$RUNNER_TEMP/diagnostic" 2>"$RUNNER_TEMP/diagnostic-error"
          "$RUNNER_TEMP/oracle/ffprobe" -v error -select_streams a -count_packets -show_entries stream=codec_name,nb_read_packets -of json "$RUNNER_TEMP/source.mp4" >"$RUNNER_TEMP/probe.json" 2>"$RUNNER_TEMP/probe-error"
          python3 - <<'PY'
          import json, os, pathlib, sys
          sys.path[:0] = ['scripts', 'tools/compat-corpus']
          from github_shapes_aac import noise_count
          root = pathlib.Path(os.environ['RUNNER_TEMP'])
          metadata = json.loads((root / 'diagnostic/metadata.json').read_text())
          streams = json.loads((root / 'probe.json').read_text())['streams']
          if len(streams) != 1 or streams[0]['codec_name'] != 'aac' or int(streams[0]['nb_read_packets']) != metadata['packets']:
              raise ValueError('independent packet count mismatch')
          bands = noise_count(metadata)
          packets_with_pns = sum(any(channel['noise'] for channel in frame['channels']) for frame in metadata['frames'])
          print(f"AAC packets: {metadata['packets']}\nPackets with PNS: {packets_with_pns}\nPNS bands: {bands}")
          PY
