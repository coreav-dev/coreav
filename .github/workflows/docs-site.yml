name: docs-site

# The documentation site in docs-site/ (docs/design/docs-site.md): Mintlify's
# strict build and its check of links between pages, with the CLI's npm
# package at a pinned version and no account. The links into the repository,
# the page list and the public text are checked by scripts/tests/test_docs_site.py
# in deny.yml, and the command reference's help text by
# crates/coreav-cli/tests/docs_site.rs in ci.yml. Not a required check, so the
# ruleset is unchanged; a failure still shows on the pull request.
# workflow-check: not required

on:
  push:
    branches: [main]
    paths:
      - docs-site/**
      - .github/workflows/docs-site.yml
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - docs-site/**
      - .github/workflows/docs-site.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  docs-site:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: docs-site
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # The Mintlify CLI does not support Node 25 or later.
          node-version: '24'
      - name: Build the site
        run: npx --yes mint@4.2.1176 validate --telemetry false
      - name: Check the links between pages
        run: npx --yes mint@4.2.1176 broken-links --check-anchors --telemetry false
