name: ci-full-failure

# workflow-check: not required

on:
  workflow_run:
    workflows: [hevc-conformance]
    types: [completed]

permissions:
  contents: read

jobs:
  full-failure-issues:
    if: >-
      github.repository == 'coreav-dev/coreav' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_branch == 'main' &&
      (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'schedule')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Report full-suite failures to their owning areas
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -I scripts/ci_full.py report --event "$GITHUB_EVENT_PATH"
