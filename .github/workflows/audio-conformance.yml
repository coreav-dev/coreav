name: audio-conformance

# The conformance bars of docs/design/audio-decode.md: each decoder of
# crates/coreav-audio, crates/coreav-aac and crates/coreav-opus against its standard's test
# vectors, fetched at a pinned commit or checksum. Runs when either crate or
# this workflow changes, and weekly.

on:
  push:
    branches: [main]
    paths: ["crates/coreav-audio/**", "crates/coreav-aac/**", "scripts/aac_agreement.py", "scripts/decode_audio_check.py", "crates/coreav-opus/**", "scripts/opus_tables.py", "scripts/pinned_sources.py", ".github/workflows/audio-conformance.yml"]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths: ["crates/coreav-audio/**", "crates/coreav-aac/**", "scripts/aac_agreement.py", "scripts/decode_audio_check.py", "crates/coreav-opus/**", "scripts/opus_tables.py", "scripts/pinned_sources.py", ".github/workflows/audio-conformance.yml"]
  schedule:
    - cron: '17 6 * * 2'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  flac:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # ietf-wg-cellar/flac-test-files (CC0), the commit the bars were
      # measured on.
      FLAC_TESTS_COMMIT: aa7b0c6cf32994c106ae517a08134c28a96ff5b2
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Cache the FLAC test files
        id: vectors
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ runner.temp }}/flac-test-files
          key: flac-test-files-${{ env.FLAC_TESTS_COMMIT }}
      - name: Fetch the FLAC test files
        if: steps.vectors.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          git init -q "$RUNNER_TEMP/flac-test-files"
          cd "$RUNNER_TEMP/flac-test-files"
          git fetch -q --depth 1 https://github.com/ietf-wg-cellar/flac-test-files.git "$FLAC_TESTS_COMMIT"
          git checkout -q FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$FLAC_TESTS_COMMIT"
      - name: Decode every file (bit-exact against its streaminfo MD5)
        env:
          COREAV_FLAC_VECTORS: ${{ runner.temp }}/flac-test-files
        run: cargo test --locked --release -p coreav-audio --test flac conformance_vectors -- --ignored --nocapture

  mp3:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # The Layer III compliance package of ISO/IEC 11172-4 (Fraunhofer
      # IIS, v2.2), the file the bars were measured on. The mirror serves
      # plain HTTP only; the checksum pins the bytes.
      MP3_VECTORS_URL: http://mpgedit.org/mpgedit/mpgedit/testdata/mpeg1/compliance/layer3.tar.gz
      MP3_VECTORS_SHA256: d2eeeb101b419bf20e26baffeda01d483ab86cce11457eadc59a39252aef5fbe
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Cache the compliance package
        id: vectors
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ runner.temp }}/layer3.tar.gz
          key: mp3-layer3-${{ env.MP3_VECTORS_SHA256 }}
      - name: Fetch the compliance package
        if: steps.vectors.outputs.cache-hit != 'true'
        run: curl -fsSL --retry 3 -o "$RUNNER_TEMP/layer3.tar.gz" "$MP3_VECTORS_URL"
      - name: Check and unpack it
        run: |
          set -euo pipefail
          echo "$MP3_VECTORS_SHA256  $RUNNER_TEMP/layer3.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/mp3"
          tar -xzf "$RUNNER_TEMP/layer3.tar.gz" -C "$RUNNER_TEMP/mp3"
          ls "$RUNNER_TEMP/mp3"
      - name: Decode every stream (compl.bit to full accuracy)
        run: |
          set -euo pipefail
          export COREAV_MP3_VECTORS="$(dirname "$(find "$RUNNER_TEMP/mp3" -name compl.bit)")"
          cargo test --locked --release -p coreav-audio --test mp3 compliance_bitstreams -- --ignored --nocapture

  aac:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      # The MPEG-4 audio conformance bitstreams of ISO/IEC 14496-26:2010,
      # publicly available at standards.iso.org: the AAC streams in MP4
      # (first DVD) and the reference waveforms of the AAC LC ones (second
      # DVD), 2.1 GB, each file pinned by SHA-256 in
      # crates/coreav-aac/tests/conformance.sha256.
      AAC_VECTORS_BASE: https://standards.iso.org/ittf/PubliclyAvailableStandards/ISO_IEC_14496-26_2010_Bitstreams
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Cache the conformance streams
        id: vectors
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ runner.temp }}/aac
          key: aac-conformance-${{ hashFiles('crates/coreav-aac/tests/conformance.sha256') }}
      - name: Fetch the conformance streams
        if: steps.vectors.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/aac/compressedMp4" "$RUNNER_TEMP/aac/referencesWav"
          cd "$RUNNER_TEMP/aac"
          awk '{print $2}' "$GITHUB_WORKSPACE/crates/coreav-aac/tests/conformance.sha256" |
            while read -r f; do
              case "$f" in
                compressedMp4/*) echo "$AAC_VECTORS_BASE/DVD1/mpeg4audio-conformance/$f $f" ;;
                *) echo "$AAC_VECTORS_BASE/DVD2/mpeg4audio-conformance/$f $f" ;;
              esac
            done | xargs -P 8 -n 2 sh -c 'curl -fsSL --retry 3 -o "$1" "$0"'
      - name: Check the streams
        run: cd "$RUNNER_TEMP/aac" && sha256sum --quiet -c "$GITHUB_WORKSPACE/crates/coreav-aac/tests/conformance.sha256"
      - name: Decode every stream (full accuracy, HE-AAC refused by name)
        env:
          COREAV_AAC_VECTORS: ${{ runner.temp }}/aac
        run: cargo test --locked --release -p coreav-aac --test conformance conformance_streams -- --ignored --nocapture
      # Bars 2 to 5 (docs/design/audio-decode.md, "AAC-LC bars"): against
      # the pinned oracle FFmpeg (scripts/oracle-ffmpeg.env).
      - name: Cache the pinned FFmpeg
        id: ffmpeg-cache
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ runner.temp }}/coreav-oracle-bin
          key: linux-x64-oracle-${{ hashFiles('scripts/oracle-ffmpeg.env', 'scripts/install-oracle-ffmpeg.sh') }}
      - name: Install the pinned FFmpeg
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        run: scripts/install-oracle-ffmpeg.sh "$RUNNER_TEMP/coreav-oracle-bin"
      - name: Build the command with the feature aac
        run: cargo build --locked --release -p coreav-cli --features aac
      - name: The generated set and the references
        run: |
          "$RUNNER_TEMP/coreav-oracle-bin/ffmpeg" -version | head -1
          python3 -I scripts/aac_agreement.py prepare --ffmpeg "$RUNNER_TEMP/coreav-oracle-bin/ffmpeg" \
            --work "$RUNNER_TEMP/aac-agreement" --conformance "$RUNNER_TEMP/aac"
      - name: Decode every MP4 input (bar 2)
        env:
          COREAV_AAC_AGREEMENT: ${{ runner.temp }}/aac-agreement/agreement.tsv
          COREAV_AAC_AGREEMENT_OUT: ${{ runner.temp }}/aac-agreement/decoder.jsonl
        run: cargo test --locked --release -p coreav-aac --test conformance ffmpeg_agreement -- --ignored --nocapture
      - name: Judge bars 2 to 5
        run: |
          set -euo pipefail
          W="$RUNNER_TEMP/aac-agreement"
          status=0
          python3 -I scripts/aac_agreement.py judge --coreav target/release/coreav \
            --ffmpeg "$RUNNER_TEMP/coreav-oracle-bin/ffmpeg" --ffprobe "$RUNNER_TEMP/coreav-oracle-bin/ffprobe" \
            --work "$W" --out "$W/aac-agree.json" > "$W/summary.json" || status=$?
          cat "$W/summary.json"
          { echo '```json'; cat "$W/summary.json"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
      - name: Keep the results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: aac-agreement
          path: |
            ${{ runner.temp }}/aac-agreement/aac-agree.json
            ${{ runner.temp }}/aac-agreement/edit-lists.json
            ${{ runner.temp }}/aac-agreement/set.json
            ${{ runner.temp }}/aac-agreement/decoder.jsonl
          if-no-files-found: warn

  mp3-transforms:
    # The unrolled transforms regenerate from their generators byte for
    # byte. The tables come from two documents (tables/gen_mp3.py pins
    # their SHA-256) that CI does not fetch: one is a copy of ISO text; they
    # are regenerated by hand when the generator changes.
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Regenerate the unrolled transforms and the trigonometric constants
        run: |
          set -euo pipefail
          cd crates/coreav-audio
          python3 tables/gen_dct32.py src/mp3/dct32.rs
          python3 tables/gen_imdct.py src/mp3/imdct.rs
          python3 tables/gen_trig.py src/mp3/trig.rs
          git diff --exit-code -- src/mp3

  opus:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # The RFC 8251 test vectors, at the address its section 11 names; the
      # files inside match the SHA-1 hashes printed there.
      OPUS_VECTORS_URL: https://www.ietf.org/proceedings/98/slides/materials-98-codec-opus-newvectors-00.tar.gz
      OPUS_VECTORS_SHA256: 6b26a22f9ba87b2b836906a9bb7afec5f8e54d49553b1200382520ee6fedfa55
      # opus_compare from libopus 1.6.1. Built and run as a black box: its
      # source is compiled, never read, and deleted.
      LIBOPUS_URL: https://downloads.xiph.org/releases/opus/opus-1.6.1.tar.gz
      LIBOPUS_SHA256: 6ffcb593207be92584df15b32466ed64bbec99109f007c82205f0194572411a1
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Cache the Opus test vectors
        id: vectors
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ runner.temp }}/opus-vectors
          key: opus-vectors-${{ env.OPUS_VECTORS_SHA256 }}
      - name: Fetch the Opus test vectors
        if: steps.vectors.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/opus-vectors"
          cd "$RUNNER_TEMP/opus-vectors"
          curl -sSfL --retry 3 -o vectors.tar.gz "$OPUS_VECTORS_URL"
          echo "$OPUS_VECTORS_SHA256  vectors.tar.gz" | sha256sum -c -
          tar xzf vectors.tar.gz
          rm vectors.tar.gz
      - name: Build opus_compare
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/opus-compare"
          cd "$RUNNER_TEMP/opus-compare"
          curl -sSfL --retry 3 -o libopus.tar.gz "$LIBOPUS_URL"
          echo "$LIBOPUS_SHA256  libopus.tar.gz" | sha256sum -c -
          tar xzf libopus.tar.gz opus-1.6.1/src/opus_compare.c
          cc -O2 -o opus_compare opus-1.6.1/src/opus_compare.c -lm
          rm -rf libopus.tar.gz opus-1.6.1
      - name: The generated tables are what scripts/opus_tables.py makes from the RFC's code
        run: python3 -I scripts/opus_tables.py --check --cache "$RUNNER_TEMP/pinned-sources"
      - name: Read every packet and decode the SILK-only and CELT-only vectors (durations against the reference outputs, range state of every packet, opus_compare above 90)
        env:
          COREAV_OPUS_VECTORS: ${{ runner.temp }}/opus-vectors/opus_newvectors
          COREAV_OPUS_COMPARE: ${{ runner.temp }}/opus-compare/opus_compare
        run: cargo test --locked --release -p coreav-opus -- --ignored --nocapture
