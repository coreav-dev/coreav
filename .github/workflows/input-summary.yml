name: input-summary

# workflow-check: not required

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - crates/coreav-cli/**
      - crates/coreav-audio/**
      - crates/coreav-isobmff/**
      - crates/coreav-mkv/**
      - crates/coreav-mpegts/**
      - scripts/input_summary_*.py
      - scripts/standalone_audio_probe_check.py
      - scripts/oracle_audio.py
      - scripts/oracle-audio-args.txt
      - scripts/oracle-ffmpeg.env
      - scripts/oracle_pin.py
      - scripts/oracle_pin_macos.py
      - scripts/install-oracle-ffmpeg.sh
      - scripts/tests/test_input_summary_*.py
      - .github/workflows/input-summary.yml
  workflow_dispatch:
    inputs:
      development:
        description: Compare explicit development inputs only
        type: boolean
        default: false
      evidence_certificate:
        description: Base64 PEM certificate for encrypted diagnostics
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  fixtures:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
      - name: Verify fixture checker behavior
        run: python3 -I -m unittest discover -s scripts/tests -p 'test_input_summary_*.py'
      - name: Install the pinned black-box oracle
        run: scripts/install-oracle-ffmpeg.sh "$RUNNER_TEMP/oracle"
      - name: Build the native CLI
        run: cargo build --locked --release -p coreav-cli --bin coreav
      - name: Compare exact summary bytes
        run: python3 -I scripts/input_summary_check.py --coreav target/release/coreav --oracle-dir "$RUNNER_TEMP/oracle" --directory "$RUNNER_TEMP/generated" --audio

  development:
    if: github.event_name == 'workflow_dispatch' && inputs.development
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
      - name: Require encrypted private diagnostics
        env:
          CERTIFICATE: ${{ inputs.evidence_certificate }}
        run: |
          python3 - <<'PY'
          import base64, os, pathlib
          value = base64.b64decode(os.environ['CERTIFICATE'], validate=True)
          if not value.startswith(b'-----BEGIN CERTIFICATE-----'):
              raise SystemExit('missing-evidence-certificate')
          (pathlib.Path(os.environ['RUNNER_TEMP']) / 'evidence.pem').write_bytes(value)
          PY
          openssl x509 -in "$RUNNER_TEMP/evidence.pem" -noout
      - name: Install the pinned black-box oracle
        run: scripts/install-oracle-ffmpeg.sh "$RUNNER_TEMP/oracle"
      - name: Build the native CLI
        run: cargo build --locked --release -p coreav-cli --bin coreav
      - name: Compare development summaries without held-out inputs
        env:
          R2_ENDPOINT: ${{ secrets.COREAV_CORPUS_R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.COREAV_CORPUS_R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.COREAV_CORPUS_R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ vars.COREAV_CORPUS_R2_BUCKET }}
        run: python3 -I scripts/input_summary_development.py --coreav target/release/coreav --oracle-dir "$RUNNER_TEMP/oracle" --directory "$RUNNER_TEMP/evidence" --evidence-cert "$RUNNER_TEMP/evidence.pem"
      - name: Retain counts and encrypted diagnostics only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: input-summary-development
          path: |
            ${{ runner.temp }}/evidence/summary.json
            ${{ runner.temp }}/evidence/details.p7m
          if-no-files-found: error
          retention-days: 7
