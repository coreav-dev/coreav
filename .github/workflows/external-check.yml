name: external-check

# Asks for the `external-check` commit status on every pull request and on
# every commit of main: it sends the commit to a check that runs outside
# this repository, which posts the status on that commit, pass or fail, and
# nothing else (docs/design/ci-checks.md). The status is
# required on pull requests; this workflow's own job is not.
#
# It needs the variable EXTERNAL_CHECK_REPOSITORY and the secret
# EXTERNAL_CHECK_TOKEN. Without them, as in a fork, the job is skipped and
# the status never arrives, so such a pull request cannot merge.

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  dispatch:
    if: >-
      vars.EXTERNAL_CHECK_REPOSITORY != '' && (github.event_name == 'push'
      || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Send the commit
        env:
          GH_TOKEN: ${{ secrets.EXTERNAL_CHECK_TOKEN }}
          TARGET: ${{ vars.EXTERNAL_CHECK_REPOSITORY }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          jq -n --arg sha "$SHA" '{ref: "main", inputs: {sha: $sha}}' \
            | gh api --method POST "repos/$TARGET/actions/workflows/external-check-run.yml/dispatches" --input -
          echo "sent $SHA"
