name: core-660-reference
on:
  push:
    branches: [gunwooterry/core-660-reference]
permissions:
  contents: read
jobs:
  reference:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Build and prepare
        env:
          R2_ENDPOINT: ${{ secrets.COREAV_CORPUS_R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.COREAV_CORPUS_R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.COREAV_CORPUS_R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ vars.COREAV_CORPUS_R2_BUCKET }}
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet 'boto3==1.35.36'
          ab/build.sh "$RUNNER_TEMP/reference" 33f983421e58e34a4175ad4aa8780a2d0a36e12c 33f983421e58e34a4175ad4aa8780a2d0a36e12c
          "$RUNNER_TEMP/venv/bin/python" -I ab/prepare.py "$RUNNER_TEMP/work" "$RUNNER_TEMP/reference/bin"
      - name: Measure on this runner
        run: python3 -I ab/time_threads.py "$RUNNER_TEMP/work" "$RUNNER_TEMP/reference/bin" "$RUNNER_TEMP/results.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: internal-reference
          path: ${{ runner.temp }}/results.json
          retention-days: 1
