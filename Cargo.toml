[workspace]
resolver = "3"
members = [
    "crates/coreav-h264",
    "crates/coreav-isobmff",
    "crates/coreav-isobmff-write",
    "crates/coreav-kernels-h264",
    "crates/coreav-kernels-audio",
    "crates/coreav-mkv",
    "crates/coreav-mpegts",
    "crates/coreav-text",
    "crates/coreav-cli",
    "crates/coreav-py",
    "crates/coreav-policy",
    "crates/coreav-range",
    "crates/coreav-wasm",
    "crates/coreav-audio",
    "crates/coreav-opus",
    "crates/coreav-frame",
    "crates/coreav-decode",
    "crates/coreav-backend-dav1d",
    "crates/coreav-backend-libvpx",
    "crates/coreav-backend-ffmpeg",
    "crates/coreav-backend-h264",
    "crates/coreav-worker",
    "crates/coreav-thumbnail",
    "crates/coreav-transcode",
    "tools/oracle",
    "tools/isobmff-adapter",
    "tools/mkv-adapter",
    "tools/ts-adapter",
    "tools/edge-native",
    "tools/decode-oracle",
    "tools/counting-alloc",
]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
repository = "https://github.com/coreav-dev/coreav"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4.3.3", features = ["derive"] }

# Every crate opts in with `[lints] workspace = true`.
# `unsafe_code` is forbidden by default. A crate that may opt out copies this
# table with `unsafe_code = "deny"` instead; each opt-out is scoped in its
# crate's design note and listed in docs/unsafe-sites.md.
[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
todo = "deny"
unimplemented = "deny"

# What is shipped: the wheels, the npm packages' binaries
# (docs/design/npm-cli.md), `cargo install --profile dist`, and the builds
# the benchmark guard counts (docs/design/benchmarks.md). Fat LTO with one
# codegen unit removes the dead code of the linked HTTP and TLS crates,
# which halves the binary's relocations (most of what #127 added to
# start-up).
[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1

# The WebAssembly module and the native reference engine it is measured
# against: one profile for both.
[profile.edge]
inherits = "release"
lto = "fat"
codegen-units = 1
panic = "abort"
# Not `true`: wasm-bindgen reads the `target_features` section to find
# reference types, which its JSPI support needs; it removes the rest itself.
strip = "debuginfo"
