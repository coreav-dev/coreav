[graph]
all-features = true

[advisories]
version = 2

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
]
# The jpeg-encoder crate (thumbnails' JPEG encoder) is "(MIT OR
# Apache-2.0) AND IJG"; IJG is allowed for it alone
# (docs/design/thumbnails.md, "JPEG encoder"). Its notice is in NOTICE,
# which every binary distribution ships.
[[licenses.exceptions]]
crate = "jpeg-encoder"
allow = ["IJG"]

[bans]
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
