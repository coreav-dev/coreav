[package]
name = "coreav-counting-alloc"
description = "Test-only counting global allocator for the pinned limit tests; never published"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

# Checked by scripts/unsafe_sites_check.py: no crate may name this one
# outside its `[dev-dependencies]`, so the `unsafe` below is compiled into
# test binaries and nothing else.
[package.metadata.coreav]
test-only = true

[dependencies]

# A test-only `unsafe` exception copies the workspace lint table and lowers
# only `unsafe_code`, to `deny`, so that the one module that needs it can
# allow it. Everything else matches the root Cargo.toml.
[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
todo = "deny"
unimplemented = "deny"
