[package]
name = "coreav-vp9-corpus-oracle"
description = "Test-only VP9 corpus frame and packet-timeline adapter; never published"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "vp9-corpus-oracle"
path = "src/main.rs"

[features]
native-vp9 = ["dep:coreav-backend-vp9", "dep:coreav-decode", "dep:coreav-frame"]

[dependencies]
coreav-backend-vp9 = { path = "../../crates/coreav-backend-vp9", optional = true }
coreav-decode = { path = "../../crates/coreav-decode", optional = true }
coreav-frame = { path = "../../crates/coreav-frame", optional = true }
coreav-mkv = { path = "../../crates/coreav-mkv" }
coreav-vp9 = { path = "../../crates/coreav-vp9" }
md-5 = "0.10"
serde_json.workspace = true
serde.workspace = true
sha2 = "0.10"

[lints]
workspace = true
