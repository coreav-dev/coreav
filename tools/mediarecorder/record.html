<!doctype html>
<meta charset="utf-8">
<title>CoreAV MediaRecorder corpus</title>
<canvas id="c"></canvas>
<script>
// Records a synthetic MediaStream (canvas + WebAudio) with MediaRecorder and
// POSTs the bytes to the local generate.py server exactly as delivered.
//
// Query parameters (all optional except id):
//   id      output name, echoed back to the server
//   mime    MediaRecorder mimeType; empty means browser default
//   w, h    canvas size in pixels                 (default 320x240)
//   fps     canvas.captureStream frame rate       (default 30)
//   dur     wall-clock recording time in ms       (default 3000)
//   video   1/0 include the canvas video track    (default 1)
//   audio   1/0 include the oscillator audio track (default 1)
//   slice   timeslice in ms for start(), or "none" (default none)
//   vbps    videoBitsPerSecond                     (default: browser)
//   abps    audioBitsPerSecond                     (default: browser)
//   pause   comma list of AT:LEN in ms, e.g. "1000:1000" pauses at 1 s for 1 s
//   resize  WxH@AT, e.g. "640x360@2000" resizes the canvas at 2 s
const q = new URLSearchParams(location.search);
const num = (k, d) => (q.has(k) && q.get(k) !== "" ? Number(q.get(k)) : d);
const id = q.get("id") || "unnamed";
const mime = q.get("mime") || "";
const fps = num("fps", 30), dur = num("dur", 3000);
const wantVideo = q.get("video") !== "0", wantAudio = q.get("audio") !== "0";
const slice = q.get("slice") && q.get("slice") !== "none" ? Number(q.get("slice")) : null;

function report(status, body, extra = {}) {
  const p = new URLSearchParams({ id, status, ...extra });
  return fetch("/result?" + p, { method: "POST", body });
}

const canvas = document.getElementById("c");
canvas.width = num("w", 320);
canvas.height = num("h", 240);
const ctx = canvas.getContext("2d");
let frame = 0;

function draw() {
  const { width: W, height: H } = canvas;
  const t = frame / fps;
  ctx.fillStyle = `hsl(${(frame * 3) % 360}, 60%, 25%)`;
  ctx.fillRect(0, 0, W, H);
  // Moving shapes so the encoder sees real motion.
  for (let i = 0; i < 6; i++) {
    const x = (W / 2) + Math.cos(t * (1 + i * 0.3) + i) * W * 0.4;
    const y = (H / 2) + Math.sin(t * (1.3 + i * 0.2) + i) * H * 0.4;
    ctx.fillStyle = `hsl(${(i * 60 + frame * 5) % 360}, 90%, 60%)`;
    ctx.beginPath();
    ctx.arc(x, y, Math.max(4, Math.min(W, H) * 0.08), 0, 2 * Math.PI);
    ctx.fill();
  }
  ctx.fillStyle = "#fff";
  ctx.fillRect((frame * 4) % W, 0, Math.max(2, W / 40), H);
  ctx.font = `${Math.max(10, Math.round(H / 8))}px monospace`;
  ctx.fillText(`#${frame} ${W}x${H}`, 4, H - 6);
  frame++;
}

async function main() {
  if (typeof MediaRecorder === "undefined") return report("error", "MediaRecorder missing");
  if (mime && !MediaRecorder.isTypeSupported(mime)) {
    return report("skipped", "isTypeSupported returned false");
  }

  const tracks = [];
  let audioCtx = null;
  if (wantVideo) {
    draw();
    setInterval(draw, 1000 / fps);
    tracks.push(...canvas.captureStream(fps).getVideoTracks());
  }
  if (wantAudio) {
    audioCtx = new AudioContext();
    await audioCtx.resume();
    const osc = audioCtx.createOscillator();
    const lfo = audioCtx.createOscillator();
    const lfoGain = audioCtx.createGain();
    lfo.frequency.value = 0.5;          // sweep the tone so audio changes too
    lfoGain.gain.value = 200;
    lfo.connect(lfoGain).connect(osc.frequency);
    osc.frequency.value = 440;
    const dest = audioCtx.createMediaStreamDestination();
    osc.connect(dest);
    osc.start(); lfo.start();
    tracks.push(...dest.stream.getAudioTracks());
  }

  const opts = {};
  if (mime) opts.mimeType = mime;
  if (q.get("vbps")) opts.videoBitsPerSecond = Number(q.get("vbps"));
  if (q.get("abps")) opts.audioBitsPerSecond = Number(q.get("abps"));
  const rec = new MediaRecorder(new MediaStream(tracks), opts);

  const chunks = [];
  rec.ondataavailable = (e) => { if (e.data.size > 0) chunks.push(e.data); };
  rec.onerror = (e) => report("error", "recorder error: " + (e.error || e));
  const stopped = new Promise((r) => (rec.onstop = r));
  slice === null ? rec.start() : rec.start(slice);

  for (const p of (q.get("pause") || "").split(",").filter(Boolean)) {
    const [at, len] = p.split(":").map(Number);
    setTimeout(() => rec.pause(), at);
    setTimeout(() => rec.resume(), at + len);
  }
  const m = /^(\d+)x(\d+)@(\d+)$/.exec(q.get("resize") || "");
  if (m) setTimeout(() => { canvas.width = +m[1]; canvas.height = +m[2]; }, +m[3]);

  setTimeout(() => rec.stop(), dur);
  await stopped;
  tracks.forEach((t) => t.stop());
  if (audioCtx) audioCtx.close();

  const blob = new Blob(chunks, { type: rec.mimeType });
  await report("ok", blob, { actual: rec.mimeType, chunks: String(chunks.length) });
  document.title = "done";
}

main().catch((e) => report("error", String(e && e.stack || e)));
</script>
