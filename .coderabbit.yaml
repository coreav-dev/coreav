# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
---
language: en-US
reviews:
  profile: chill
  auto_approvals:
    enabled: true
  auto_review:
    auto_pause_after_reviewed_commits: 0
    auto_incremental_review: true
    drafts: false
  poem: false
  in_progress_fortune: false
  sequence_diagrams: false
  suggested_reviewers: false
  related_prs: false
  related_issues: false
  path_filters:
    - "!docs/measurements/**/*.json"
    - "!docs/measurements/**/*.jsonl"
    - "!**/evidence/**"
    - "!tools/mediainfo-oracle/results/**/*.json"
    - "!docs/measurements/transcode/fixtures/**"
    - "!**/Cargo.lock"
knowledge_base:
  code_guidelines:
    filePatterns:
      - AGENTS.md
      - CONTRIBUTING.md
      - docs/design/**/*.md
