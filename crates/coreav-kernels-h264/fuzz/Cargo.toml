# cargo-fuzz project (docs/design/fuzz-campaign.md); outside the
# workspace, never published. The targets compare each vector kernel with
# the scalar reference (bar C3 of docs/design/h264.md).
[package]
name = "coreav-kernels-h264-fuzz"
version = "0.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[package.metadata]
cargo-fuzz = true

[workspace]

[dependencies]
libfuzzer-sys = "0.4"
coreav-kernels-h264 = { path = ".." }

[[bin]]
name = "luma_mc"
path = "fuzz_targets/luma_mc.rs"
test = false
doc = false
bench = false

[[bin]]
name = "chroma_mc"
path = "fuzz_targets/chroma_mc.rs"
test = false
doc = false
bench = false

[[bin]]
