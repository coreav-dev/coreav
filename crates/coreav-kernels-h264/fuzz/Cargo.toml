path = "fuzz_targets/filter_edge.rs"
test = false
doc = false
bench = false

[[bin]]
name = "combine"
path = "fuzz_targets/combine.rs"
test = false
doc = false
bench = false

[lints.rust]
unsafe_code = "forbid"

