[package]
name = "coreav-h264-encoder"
description = "Opt-in H.264 encoder with bit-identical SIMD"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[features]
default = []
full = ["dep:coreav-kernels-h264"]
scalar = []

[dependencies]
coreav-kernels-h264 = { path = "../coreav-kernels-h264", optional = true }

[dev-dependencies]
coreav-h264 = { path = "../coreav-h264" }

[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
todo = "deny"
unimplemented = "deny"

[[example]]
name = "g1"
required-features = ["full"]

[[example]]
name = "p"
required-features = ["full"]
