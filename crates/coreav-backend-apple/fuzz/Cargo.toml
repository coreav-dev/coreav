[package]
name = "coreav-backend-apple-fuzz"
version = "0.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[package.metadata]
cargo-fuzz = true

[workspace]

[dependencies]
arbitrary = { version = "1", features = ["derive"] }
libfuzzer-sys = "0.4"
coreav-backend-apple = { path = ".." }

[[bin]]
name = "aac_output"
path = "fuzz_targets/aac_output.rs"
test = false
doc = false
bench = false

[[bin]]
name = "h264_output"
path = "fuzz_targets/h264_output.rs"
test = false
doc = false
bench = false

[lints.rust]
unsafe_code = "forbid"

[[bin]]
name = "hevc_output"
path = "fuzz_targets/hevc_output.rs"
test = false
doc = false
bench = false
