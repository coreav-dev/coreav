# cargo-fuzz project; outside the workspace, never published.
[package]
name = "coreav-isobmff-write-fuzz"
version = "0.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[package.metadata]
cargo-fuzz = true

[workspace]

[dependencies]
libfuzzer-sys = "0.4"
coreav-isobmff = { path = "../../coreav-isobmff" }
coreav-isobmff-write = { path = ".." }
coreav-mkv = { path = "../../coreav-mkv" }

[[bin]]
name = "extract_audio"
path = "fuzz_targets/extract_audio.rs"
test = false
doc = false
bench = false

