[package]
name = "coreav-backend-hevc-fuzz"
version = "0.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[package.metadata]
cargo-fuzz = true

[workspace]

[dependencies]
libfuzzer-sys = "0.4"
coreav-backend-hevc = { path = "..", features = ["native-hevc"] }
coreav-decode = { path = "../../coreav-decode" }

[[bin]]
name = "boundary"
path = "fuzz_targets/boundary.rs"
test = false
doc = false
bench = false

[lints.rust]
unsafe_code = "forbid"
