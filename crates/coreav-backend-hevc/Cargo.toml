[package]
name = "coreav-backend-hevc"
description = "CoreAV's opt-in scalar Main/Main10 HEVC decode-boundary backend"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
publish = false

[features]
default = []
native-hevc = ["dep:coreav-hevc", "coreav-hevc/native-hevc-rows-private", "coreav-decode/native-hevc-private"]

[dependencies]
coreav-decode = { path = "../coreav-decode" }
coreav-frame = { path = "../coreav-frame" }
coreav-hevc = { path = "../coreav-hevc", default-features = false, optional = true }

[dev-dependencies]
coreav-counting-alloc = { path = "../../tools/counting-alloc" }
serde_json.workspace = true
md-5 = "0.10"
sha2 = "0.10"
coreav-isobmff = { path = "../coreav-isobmff" }
coreav-thumbnail = { path = "../coreav-thumbnail", default-features = false }

[[example]]
name = "boundary"
required-features = ["native-hevc"]

[lints]
workspace = true
