# cargo-fuzz project (docs/design/fuzz-campaign.md); outside the
# workspace, never published.
[package]
name = "coreav-vp9-fuzz"
version = "0.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[package.metadata]
cargo-fuzz = true

[workspace]

[dependencies]
libfuzzer-sys = "0.4"
coreav-vp9 = { path = ".." }

[[bin]]
name = "headers"
path = "fuzz_targets/headers.rs"
test = false
doc = false
bench = false

[lints.rust]
unsafe_code = "forbid"
