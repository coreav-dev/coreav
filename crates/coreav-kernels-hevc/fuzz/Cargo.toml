[package]
name = "coreav-kernels-hevc-fuzz"
version = "0.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[package.metadata]
cargo-fuzz = true

[workspace]

[dependencies]
libfuzzer-sys = "0.4"
coreav-kernels-hevc = { path = "..", features = ["native-hevc", "test-support"] }

[[bin]]
name = "horizontal"
path = "fuzz_targets/horizontal.rs"
test = false
doc = false
bench = false

[[bin]]
name = "vertical"
path = "fuzz_targets/vertical.rs"
test = false
doc = false
bench = false

[lints.rust]
unsafe_code = "forbid"

[[bin]]
name = "sao"
path = "fuzz_targets/sao.rs"
test = false
doc = false
bench = false

[[bin]]
name = "intra"
path = "fuzz_targets/intra.rs"
test = false
doc = false
bench = false
