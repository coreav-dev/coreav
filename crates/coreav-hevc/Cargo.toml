[package]
name = "coreav-hevc"
description = "Opt-in HEVC headers and scalar reconstruction from ITU-T H.265"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
publish = false

[features]
default = []
native-hevc = ["dep:sha2", "dep:md-5", "dep:coreav-kernels-hevc", "coreav-kernels-hevc/native-hevc"]
native-hevc-rows-private = ["native-hevc"]
scalar = ["coreav-kernels-hevc?/scalar"]
test-support = []

[dependencies]
sha2 = { version = "0.10", optional = true }
md-5 = { version = "0.10", optional = true }
coreav-kernels-hevc = { path = "../coreav-kernels-hevc", optional = true, default-features = false }

[dev-dependencies]
serde_json.workspace = true
coreav-decode = { path = "../coreav-decode" }
coreav-isobmff = { path = "../coreav-isobmff" }
coreav-thumbnail = { path = "../coreav-thumbnail", default-features = false }

[[example]]
name = "headers"
required-features = ["native-hevc"]

[[example]]
name = "intra"
required-features = ["native-hevc"]

[[example]]
name = "decode"
required-features = ["native-hevc"]

[[example]]
name = "packets"
required-features = ["native-hevc"]

[lints]
workspace = true
