[package]
name = "coreav-hevc"
description = "Opt-in HEVC headers written from ITU-T H.265"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
publish = false

[features]
default = []
native-hevc = ["dep:sha2"]

[dependencies]
sha2 = { version = "0.10", optional = true }

[dev-dependencies]
serde_json.workspace = true

[[example]]
name = "headers"
required-features = ["native-hevc"]

[lints]
workspace = true
