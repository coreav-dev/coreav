[package]
name = "coreav-hevc-fuzz"
version = "0.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[package.metadata]
cargo-fuzz = true

[workspace]

[dependencies]
libfuzzer-sys = "0.4"
coreav-hevc = { path = "..", features = ["native-hevc"] }

[[bin]]
name = "intra"
path = "fuzz_targets/intra.rs"
test = false
doc = false
bench = false

[[bin]]
name = "headers"
path = "fuzz_targets/headers.rs"
test = false
doc = false
bench = false

[lints.rust]
unsafe_code = "forbid"
