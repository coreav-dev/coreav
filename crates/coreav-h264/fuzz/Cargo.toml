# cargo-fuzz project (docs/design/fuzz-campaign.md); outside the
# workspace, never published.
[package]
name = "coreav-h264-fuzz"
version = "0.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[package.metadata]
cargo-fuzz = true

[workspace]

[dependencies]
libfuzzer-sys = "0.4"
coreav-h264 = { path = ".." }

[[bin]]
name = "nal"
path = "fuzz_targets/nal.rs"
test = false
doc = false
bench = false

[[bin]]
name = "decode"
path = "fuzz_targets/decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "decode_limited"
path = "fuzz_targets/decode_limited.rs"
test = false
doc = false
bench = false

[[bin]]
name = "threads"
path = "fuzz_targets/threads.rs"
test = false
doc = false
bench = false

[[bin]]
name = "instances"
path = "fuzz_targets/instances.rs"
test = false
doc = false
bench = false

[[bin]]
name = "parameter_sets"
path = "fuzz_targets/parameter_sets.rs"
test = false
doc = false
bench = false

[lints.rust]
unsafe_code = "forbid"
