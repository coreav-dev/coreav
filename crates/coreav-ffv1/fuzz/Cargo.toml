[package]
name = "coreav-ffv1-fuzz"
version = "0.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[package.metadata]
cargo-fuzz = true

[workspace]

[dependencies]
libfuzzer-sys = "0.4"
coreav-ffv1 = { path = ".." }
coreav-frame = { path = "../../coreav-frame" }

[[bin]]
name = "encode"
path = "fuzz_targets/encode.rs"
test = false
doc = false
bench = false

[lints.rust]
unsafe_code = "forbid"
