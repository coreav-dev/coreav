# cargo-fuzz project (docs/design/decode.md, bar 4); outside the workspace, never published.
[package]
name = "coreav-worker-fuzz"
version = "0.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[package.metadata]
cargo-fuzz = true

[workspace]

[dependencies]
libfuzzer-sys = "0.4"
coreav-worker = { path = ".." }
coreav-decode = { path = "../../coreav-decode" }

[[bin]]
name = "descriptor"
path = "fuzz_targets/descriptor.rs"
test = false
doc = false
bench = false

[[bin]]
name = "messages"
path = "fuzz_targets/messages.rs"
test = false
doc = false
bench = false

[lints.rust]
unsafe_code = "forbid"
