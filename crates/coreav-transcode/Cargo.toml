[package]
name = "coreav-transcode"
description = "Video transcoding through CoreAV's decode boundary: external H.264 encoding with copied audio, or native lossless FFV1 video in Matroska"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
coreav-ffv1 = { path = "../coreav-ffv1" }
coreav-audio = { path = "../coreav-audio" }
coreav-decode = { path = "../coreav-decode" }
coreav-frame = { path = "../coreav-frame" }
coreav-isobmff = { path = "../coreav-isobmff" }
coreav-isobmff-write = { path = "../coreav-isobmff-write" }
coreav-mkv = { path = "../coreav-mkv" }
coreav-thumbnail = { path = "../coreav-thumbnail" }
coreav-worker = { path = "../coreav-worker" }

[features]
# AAC LC decoding in `coreav-audio`, including sources of audio encodes.
aac = ["coreav-audio/aac"]

[[test]]
name = "sandboxed"
# Its `main` is also the sandbox launcher the tests start (`EXEC_ARG`).
harness = false

[lints]
workspace = true
