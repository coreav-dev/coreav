# cargo-deny configuration for the fuzz project only (docs/design/decode.md).
[graph]
all-features = true

[advisories]
version = 2

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    # libfuzzer-sys bundles libFuzzer under the permissive NCSA license.
    # Allowed for this fuzz project only (docs/design/decode.md); never in the library graph.
    "NCSA",
]
# As in the workspace's deny.toml: IJG for the jpeg-encoder crate alone
# (docs/design/thumbnails.md, "JPEG encoder").
[[licenses.exceptions]]
crate = "jpeg-encoder"
allow = ["IJG"]

[bans]
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
