# Clippy reads the clippy.toml nearest the crate and nothing above it, so
# this file repeats the workspace's ../../clippy.toml line for line
# (tests/clippy_config.rs checks it) and adds what holds for this crate.
allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-panic-in-tests = true
allow-indexing-slicing-in-tests = true
# Clippy's version-aware lints keep to Rust 1.85, the workspace's version
# before the H.264 kernels' AVX-512 tier raised `rust-version` to 1.89 for
# its target features (docs/design/h264.md, "Kernel round: an AVX-512
# tier"); suggestions of what 1.86 to 1.89 stabilized are left to a change
# of their own.
msrv = "1.85"

# State kept per PID is bounded by a limit fixed when its map is built
# (docs/design/mpegts.md, "Per-PID state"): the standard maps are for
# src/pid_map.rs alone.
disallowed-types = [
    { path = "std::collections::BTreeMap", reason = "a map keyed by PID is a `PidMap` (src/pid_map.rs), built from a limit of `Limits`" },
    { path = "std::collections::HashMap", reason = "a map keyed by PID is a `PidMap` (src/pid_map.rs), built from a limit of `Limits`" },
]
