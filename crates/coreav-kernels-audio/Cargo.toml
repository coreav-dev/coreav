[package]
name = "coreav-kernels-audio"
description = "Audio kernels of CoreAV: the resampler's filter, in SIMD with a bit-identical portable twin"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]

# A kernel crate may use `unsafe` for SIMD intrinsics, so it
# copies the workspace lint table with `unsafe_code` denied instead of
# forbidden. The allow is on the `avx` module alone, and every site is
# listed in docs/unsafe-sites.md.
[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
todo = "deny"
unimplemented = "deny"
